// 🎯T113 / 🎯T154: follow-up send queue (pure policy in send_queue.js).
// Persist to localStorage so full reload restores FIFO; soft reconnect
// must never reset to emptyState() (onOpen hard wipe leaves queue alone).
let sendQueueState = (typeof SendQueue !== 'undefined')
  ? SendQueue.load(window.localStorage)
  : { items: [], nextId: 1 };
// Combined Alt+Up/Down focus: live | queue | history (queue before history).
let navFocus = { zone: 'live' };
let liveDraftBackup = '';
const sendQueueEl = document.getElementById('send-queue');
let histDraft = '';
let editingEl = null;  // the bubble currently highlighted as "being edited"

function persistSendQueue() {
  if (typeof SendQueue === 'undefined') return;
  SendQueue.save(window.localStorage, sendQueueState);
}

// 🎯T239: durable draft + unacked wire sends (localStorage; survives
// hard-reload / soft reconnect / daily daemon restart — not sessionStorage-only).
let pendingSendState = (typeof ComposerPersist !== 'undefined')
  ? (function () {
      const r = ComposerPersist.loadPending(window.localStorage);
      if (!r.ok && r.present) {
        console.error('ComposerPersist: pending restore failed', r.error);
        if (typeof sTxt !== 'undefined' && sTxt) sTxt.textContent = 'pending-send restore failed';
      }
      return r.state || ComposerPersist.emptyPending();
    })()
  : { items: [] };

function persistComposerDraft(text) {
  if (typeof ComposerPersist === 'undefined') return;
  const t = text == null ? '' : String(text);
  const r = ComposerPersist.saveDraft(window.localStorage, t);
  if (!r.ok) console.error('ComposerPersist: saveDraft failed', r.error);
}

function clearComposerDraft() {
  if (typeof ComposerPersist === 'undefined') return;
  ComposerPersist.clearDraft(window.localStorage);
}

function persistPendingSend() {
  if (typeof ComposerPersist === 'undefined') return;
  const r = ComposerPersist.savePending(window.localStorage, pendingSendState);
  if (!r.ok) console.error('ComposerPersist: savePending failed', r.error);
}

function stagePendingSend(text) {
  if (typeof ComposerPersist === 'undefined') return;
  const t = text == null ? '' : String(text).trim();
  if (!t) return;
  pendingSendState = ComposerPersist.stagePending(pendingSendState, t);
  persistPendingSend();
}

// Ack pending items that already appear as user bubbles / history.
function ackPendingFromContent(content) {
  if (typeof ComposerPersist === 'undefined' || !content) return;
  const r = ComposerPersist.ackPendingAgainstHistory(pendingSendState, [content]);
  if (r.acked && r.acked.length) {
    pendingSendState = r.state;
    persistPendingSend();
  }
}

// After history_meta: re-queue unacked pending not already on chatlog or queue.
// History source = msgHistory, with DOM user bubbles as fallback (hard replay).
function reconcilePendingSends() {
  if (typeof ComposerPersist === 'undefined') return;
  let historyTexts = (msgHistory || []).map(function (h) {
    return h && h.text != null ? String(h.text) : '';
  }).filter(function (t) { return t.trim().length > 0; });
  if (!historyTexts.length && typeof collectDomOwnerEntries === 'function') {
    try {
      historyTexts = collectDomOwnerEntries().map(function (e) {
        return e && e.text != null ? String(e.text) : '';
      }).filter(function (t) { return t.trim().length > 0; });
    } catch (_) { /* DOM not ready */ }
  }
  const queueTexts = (sendQueueState && sendQueueState.items || []).map(function (it) {
    return it && it.text != null ? String(it.text) : '';
  });
  const plan = ComposerPersist.planRestore({
    draftText: '',
    pendingState: pendingSendState,
    historyTexts: historyTexts,
    queueTexts: queueTexts,
  });
  pendingSendState = plan.pendingAfterAck;
  // Drop requeued from pending once enqueued (queue is durable via T154).
  if (plan.requeueTexts && plan.requeueTexts.length && typeof SendQueue !== 'undefined') {
    for (let i = 0; i < plan.requeueTexts.length; i++) {
      const t = plan.requeueTexts[i];
      sendQueueState = SendQueue.enqueue(sendQueueState, t);
      pendingSendState = ComposerPersist.ackPendingAgainstHistory(pendingSendState, [t]).state;
    }
    persistSendQueue();
    if (typeof renderSendQueue === 'function') renderSendQueue();
    if (sTxt && plan.requeueTexts.length && sTxt.textContent !== 'connected') {
      sTxt.textContent = 'requeued unacked (' + plan.requeueTexts.length + ')';
    }
  }
  // Pending already covered by visible queue: drop (no silent re-dupe).
  if (queueTexts.length) {
    pendingSendState = ComposerPersist.ackPendingAgainstHistory(pendingSendState, queueTexts).state;
  }
  persistPendingSend();
  if (typeof drainSendQueueIfIdle === 'function') {
    try { drainSendQueueIfIdle(); } catch (_) {}
  }
}

// setEditingHighlight moves the .editing highlight to el (or clears it),
// scrolling it into view so you can see which message you're editing.
function setEditingHighlight(el) {
  if (editingEl && editingEl !== el) editingEl.classList.remove('editing');
  editingEl = el || null;
  if (editingEl) {
    editingEl.classList.add('editing');
    editingEl.scrollIntoView({ block: 'nearest' });
  }
}

// 🎯T113: render queued follow-ups above the composer (send-now / cancel).
function renderSendQueue() {
  if (!sendQueueEl || typeof SendQueue === 'undefined') return;
  const items = sendQueueState.items || [];
  sendQueueEl.innerHTML = '';
  if (!items.length) {
    sendQueueEl.classList.remove('visible');
    return;
  }
  sendQueueEl.classList.add('visible');
  items.forEach(function (it, idx) {
    const row = document.createElement('div');
    row.className = 'send-queue-item';
    row.setAttribute('role', 'listitem');
    row.dataset.id = it.id;
    if (navFocus.zone === 'queue' && (navFocus.index | 0) === idx) {
      row.classList.add('focused');
    }
    const text = document.createElement('span');
    text.className = 'sq-text';
    text.textContent = it.text;
    text.title = it.text;
    row.appendChild(text);
    const actions = document.createElement('div');
    actions.className = 'sq-actions';
    const sendNow = document.createElement('button');
    sendNow.type = 'button';
    sendNow.className = 'sq-send-now';
    sendNow.textContent = 'Send now';
    sendNow.title = 'Send now (interject if a turn is in flight)';
    sendNow.addEventListener('click', function () { sendQueueNow(it.id); });
    sendNow.addEventListener('mousedown', function (e) { e.preventDefault(); });
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'sq-cancel';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.title = 'Remove from queue';
    cancelBtn.addEventListener('click', function () { cancelQueued(it.id); });
    cancelBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    actions.appendChild(sendNow);
    actions.appendChild(cancelBtn);
    row.appendChild(actions);
    sendQueueEl.appendChild(row);
  });
}

// 🎯T154: paint restored queue on boot (load already ran at declaration).
renderSendQueue();

function cancelQueued(id) {
  if (typeof SendQueue === 'undefined') return;
  sendQueueState = SendQueue.cancel(sendQueueState, id);
  persistSendQueue();
  if (navFocus.zone === 'queue') {
    const n = sendQueueState.items.length;
    if (!n) {
      navFocus = { zone: 'live' };
      input.value = liveDraftBackup;
    } else if ((navFocus.index | 0) >= n) {
      navFocus = { zone: 'queue', index: n - 1 };
      input.value = sendQueueState.items[n - 1].text;
    }
    if (typeof syncComposerSeedClass === 'function') syncComposerSeedClass();
  }
  renderSendQueue();
  autoGrow();
}

// Send-now: pull one queued item and submit immediately (interject if busy).
function sendQueueNow(id) {
  if (typeof SendQueue === 'undefined') return;
  const taken = SendQueue.takeById(sendQueueState, id);
  if (!taken.item) return;
  sendQueueState = taken.state;
  persistSendQueue();
  if (navFocus.zone === 'queue') {
    navFocus = { zone: 'live' };
    liveDraftBackup = '';
  }
  renderSendQueue();
  const sent = submitWireText(taken.item.text, { interrupt: !!workingEl });
  if (!sent) {
    // 🎯T228: restore to visible queue — never drop on failed wire.
    sendQueueState = SendQueue.enqueue(sendQueueState, taken.item.text);
    persistSendQueue();
    renderSendQueue();
  }
}

// 🎯T228: chat wire ready for owner turns (WS OPEN or native bridge open).
function isChatWireOpen() {
  if (typeof transport === 'undefined' || !transport) return false;
  if (typeof transport.isOpen === 'function') return !!transport.isOpen();
  if (transport.ws != null) return transport.ws.readyState === 1;
  // Legacy native without isOpen: assume post path exists.
  return typeof transport.send === 'function';
}

// Submit a fully-prepared wire string (interrupt optional). Used by send()
// and by auto-drain / send-now so queue drain does not re-enter attention.
// Returns true only when transport accepted the payload (🎯T228 — callers
// must not clear the composer on false).
function submitWireText(t, opts) {
  const o = opts || {};
  if (o.interrupt && workingEl) {
    // Interject: cancel in-flight turn first; claudia's Send waits for
    // ready, so interrupt-then-send ordering is safe.
    try { transport.send('{"type":"interrupt"}'); } catch (_) {}
  }
  let ok = false;
  try {
    ok = !!transport.send(t);
  } catch (_) {
    ok = false;
  }
  if (!ok) return false;
  // 🎯T239: stage until user echo / chatlog ack — never silent-drop on restart.
  stagePendingSend(t);
  // 🎯T250: optimistic sidebar record for aside wires (server echo will dedupe).
  if (typeof noteAsideWireFromMain === 'function') noteAsideWireFromMain(t);
  histIdx = null; histDraft = ''; setEditingHighlight(null);
  navFocus = { zone: 'live' };
  liveDraftBackup = '';
  enterTrackBottom();
  setWorking(true);
  requestAnimationFrame(() => { scrollDown(); });
  if (typeof renderAttention === 'function') renderAttention();
  return true;
}

// Drain head of queue once the in-flight turn seals (or wire reopens idle).
function drainSendQueueIfIdle() {
  if (workingEl) return;
  if (typeof SendQueue === 'undefined') return;
  if (!sendQueueState.items.length) return;
  // 🎯T228: never shift-off a queue item if the wire cannot take it.
  if (!isChatWireOpen()) return;
  const r = SendQueue.shiftNext(sendQueueState);
  if (!r.item) return;
  sendQueueState = r.state;
  persistSendQueue();
  if (navFocus.zone === 'queue') {
    const n = sendQueueState.items.length;
    if (!n) {
      navFocus = { zone: 'live' };
      input.value = liveDraftBackup;
      if (typeof syncComposerSeedClass === 'function') syncComposerSeedClass();
      autoGrow();
    } else if ((navFocus.index | 0) >= n) {
      navFocus = { zone: 'queue', index: n - 1 };
      input.value = sendQueueState.items[n - 1].text;
      if (typeof syncComposerSeedClass === 'function') syncComposerSeedClass();
      autoGrow();
    }
  }
  renderSendQueue();
  const sent = submitWireText(r.item.text, { interrupt: false });
  if (!sent) {
    // Put head back so the strip still shows the owner's text (no drop).
    sendQueueState = {
      items: [{ id: r.item.id, text: r.item.text }].concat(sendQueueState.items || []),
      nextId: sendQueueState.nextId || 1,
    };
    persistSendQueue();
    renderSendQueue();
  }
}

function clearComposerAfterQueueOrSend() {
  input.value = '';
  pendingImages.forEach(img => { if (img.objectUrl) try { URL.revokeObjectURL(img.objectUrl); } catch (_) {} });
  pendingImages.length = 0;
  renderComposerImages();
  histIdx = null; histDraft = ''; setEditingHighlight(null);
  navFocus = { zone: 'live' };
  liveDraftBackup = '';
  // 🎯T239: intentional clear after accept/enqueue — drop durable draft.
  clearComposerDraft();
  autoGrow();
  // 🎯T21: empty composer again — re-seed for next dictation (stripped on send).
  ensureWisprSeed();
  // 🎯T153: send/enqueue returns focus to composer (composer-first Tab path).
  focusComposer();
}

// opts.interrupt: true when Control+Enter (Grok-class interject).
function send(opts) {
  const interruptChord = !!(opts && opts.interrupt);
  // If Alt-nav is focused on a queue row, Enter commits edits back into
  // that row (does not re-enqueue a duplicate).
  if (navFocus.zone === 'queue' && typeof SendQueue !== 'undefined' && !interruptChord) {
    const qi = navFocus.index | 0;
    const it = sendQueueState.items[qi];
    if (it) {
      // Queue row text is owner draft — strip any accidental seed prefix.
      const rowText = (typeof WisprContext !== 'undefined')
        ? WisprContext.prepareWireText(input.value)
        : input.value;
      sendQueueState = SendQueue.updateItem(sendQueueState, it.id, rowText);
      persistSendQueue();
      navFocus = { zone: 'live' };
      input.value = liveDraftBackup;
      liveDraftBackup = '';
      histIdx = null; histDraft = ''; setEditingHighlight(null);
      renderSendQueue();
      autoGrow();
      ensureWisprSeed();
      focusComposer();
      return;
    }
  }
  // 🎯T21: strip empty-composer seed before wire; never invent grammar/`?`.
  let t = (typeof WisprContext !== 'undefined')
    ? WisprContext.prepareWireText(input.value).trim()
    : input.value.trim();
  // 🎯T76: allow send with only images attached.
  if (!t && !pendingImages.length) return;
  // Prepend image markers so the overseer receives durable references.
  if (pendingImages.length) {
    const markers = pendingImages.map(img => img.marker || ('[image: ' + img.id + ']')).join(' ');
    t = t ? (markers + '\n' + t) : markers;
  }
  // 🎯T65/T95 prefix-first: aside:/capture:/park:/main:/pursue:/target:
  // 🎯T247: when an explicit open prefix already spawns/routes the aside, do not
  // fall through to T135 "Continue in" / create-affordance after send.
  let explicitAsideOpened = false;
  if (attentionState && typeof AttentionThreads !== 'undefined') {
    if (!AttentionThreads.isMainFocus(attentionState)) {
      // Don't clobber side-thread body with a command-prefixed draft.
      const p = AttentionThreads.parsePrefix(t);
      if (!p.command) {
        // Persist seed-stripped draft only (🎯T21).
        attentionState = AttentionThreads.updateActiveBody(attentionState, t);
      }
    }
    const ownerDraftForLog = t;
    const parsedCmd = AttentionThreads.parsePrefix(t);
    const r = AttentionThreads.handleComposer(attentionState, t);
    attentionState = r.state;
    persistAttention();
    // Decision log: composer outcome (kind/command/purpose/threadId) — audit §3.2.
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('info', DecisionLog.decisionMsg('attention'), DecisionLog.formatComposerDecision(r, {
        command: parsedCmd && parsedCmd.command,
        draft: ownerDraftForLog,
        corr: pageCorr,
      }));
      // Local focus transitions from prefixes (main/pursue/park/capture/…).
      if (r.kind === 'local' && parsedCmd && parsedCmd.command) {
        const focusAct = parsedCmd.command === 'capture' ? 'capture'
          : (parsedCmd.command === 'target' ? 'target' : parsedCmd.command);
        if (focusAct === 'main' || focusAct === 'pursue' || focusAct === 'park' ||
            focusAct === 'capture') {
          jLog('info', DecisionLog.decisionMsg('attention'), DecisionLog.formatFocusDecision(focusAct, {
            threadId: r.threadId,
            draft: ownerDraftForLog,
            corr: pageCorr,
          }));
        }
      }
    }
    // 🎯T136: any create that yields an aside id dual-writes to fleet registry
    // so RHS tree shows 💡 + auto-select/inspect (not top chip chrome).
    // 🎯T263: freeform aside: also pass opening body so server starts + delivers
    // in the same turn (not registry-only empty transcript).
    if (r.threadId && (parsedCmd && (parsedCmd.command === 'aside' ||
        parsedCmd.command === 'capture' || parsedCmd.command === 'target'))) {
      const th = AttentionThreads.findThread(attentionState, r.threadId);
      let title = th && th.title ? th.title : '';
      if (!title && typeof AttentionThreads.titleFromBody === 'function') {
        title = AttentionThreads.titleFromBody((th && th.body) || '');
      }
      const openingBody = (th && th.body) || (parsedCmd.body) || '';
      const createOpts = (typeof AgentTranscript !== 'undefined' &&
          AgentTranscript.freeformAsideCreateOpts)
        ? AgentTranscript.freeformAsideCreateOpts(parsedCmd.command, openingBody)
        : (parsedCmd.command === 'aside' && String(openingBody).trim()
          ? { text: String(openingBody).trim(), expectDeliver: true }
          : {});
      // 🎯T270: persist type on create so closed history delineates filing vs side-chat.
      if (typeof AsideHistory !== 'undefined' && AsideHistory.kindFromCommand) {
        createOpts.kind = AsideHistory.kindFromCommand(parsedCmd.command);
      } else if (parsedCmd.command === 'target') {
        createOpts.kind = 'target';
      } else if (parsedCmd.command === 'capture') {
        createOpts.kind = 'capture';
      } else {
        createOpts.kind = createOpts.kind || 'side';
      }
      createOpts.command = parsedCmd.command;
      ensureFleetAside(r.threadId, title || 'aside', createOpts).catch(function () {
        // ensureFleetAside already surfaces loud UI for freeform deliver fail.
      });
      // 🎯T247: explicit open prefix already spawned — no post-send route chip.
      explicitAsideOpened = true;
    } else if (r.routed) {
      // Already delivered onto an aside wire (pursue focus / aside: body).
      explicitAsideOpened = true;
    }
    if (r.kind === 'local' || r.kind === 'empty') {
      if (r.clearComposer) {
        input.value = r.composerBody != null ? r.composerBody : '';
      }
      if (AttentionThreads.isMainFocus(attentionState)) {
        mainDraftBackup = (typeof WisprContext !== 'undefined')
          ? WisprContext.prepareWireText(input.value)
          : input.value;
      }
      histIdx = null; histDraft = ''; setEditingHighlight(null);
      ensureWisprSeed();
      autoGrow();
      renderAttention();
      // 🎯T153: local attention cmds (main/park/pursue/…) keep composer focused.
      focusComposer();
      return; // no wire send for local commands
    }
    t = r.text;
    if (!t) return;
    if (AttentionThreads.isMainFocus(attentionState)) mainDraftBackup = '';
    renderAttention();
  }
  // 🎯T99: cheap continuation routing when on main with no explicit prefix.
  // 🎯T134: routeCandidates = open only — never done/archive ghosts.
  // 🎯T135: match is suggestion only; no silent steal — NEVER pursue or
  // rewrite `t` / wire via formatAsideWire on auto-match. Main draft stays main.
  // 🎯T247: skip entirely when target:/aside:/capture: (or other routed
  // composer path) already opened the aside — no intermediate create/continue chip.
  // ALWAYS log the route hit (T99 opacity / T120 DecisionLog) when we do plan.
  let pendingRouteSuggestion = null;
  if (!explicitAsideOpened && typeof ThreadRoute !== 'undefined' && attentionState &&
      typeof AttentionThreads !== 'undefined' && AttentionThreads.isMainFocus(attentionState)) {
    // Route on seed-stripped draft (🎯T21) so EMPTY_SEED never influences match.
    const ownerDraft = t;
    const threads = (typeof AttentionThreads.routeCandidates === 'function')
      ? AttentionThreads.routeCandidates(attentionState)
      : (attentionState.threads || []).filter(function (th) {
          return th && th.status === 'open';
        }).map(function (th) {
          return { id: th.id, title: th.title, digest: th.body, body: th.body, status: th.status };
        });
    const hit = ThreadRoute.route(ownerDraft || t, threads);
    // ALWAYS log full hit even when we do not rewrite wire (🎯T135).
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('info', DecisionLog.decisionMsg('thread_route'), DecisionLog.formatRouteDecision(hit, pageCorr));
    }
    // 🎯T135: plan only — steal always false; suggestion for opt-in affordance.
    if (typeof RouteSuggest !== 'undefined' && typeof RouteSuggest.planAutoRouteAction === 'function') {
      const act = RouteSuggest.planAutoRouteAction(hit, {
        threads: threads,
        body: ownerDraft || t,
      });
      // act.steal is always false by contract; never pursue / formatAsideWire here.
      pendingRouteSuggestion = act.suggestion;
    } else if (hit && hit.threadId && hit.reason === 'match') {
      const matched = AttentionThreads.findThread(attentionState, hit.threadId);
      if (matched && matched.status === 'open') {
        pendingRouteSuggestion = {
          threadId: String(hit.threadId),
          title: matched.title || '',
          score: typeof hit.score === 'number' ? hit.score : 0,
          body: ownerDraft || t,
        };
      }
    }
    // Intentionally NO AttentionThreads.pursue / formatAsideWire on match (🎯T135).
  }
  // 🎯T113: while busy, plain Enter enqueues; only Control+Enter interjects.
  // 🎯T228: offline / wire-down also enqueues visibly (never clear-and-drop).
  const wireOpen = isChatWireOpen();
  const decision = (typeof SendQueue !== 'undefined')
    ? SendQueue.decideSend({
        busy: !!workingEl,
        interrupt: interruptChord,
        text: t,
        hasImages: pendingImages.length > 0,
        wireOpen: wireOpen,
      })
    : (!wireOpen || (workingEl && !interruptChord)
      ? { action: 'enqueue', text: t, reason: !wireOpen ? 'offline' : 'busy' }
      : { action: 'send', text: t, interrupt: !!(workingEl && interruptChord) });
  if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
    jLog('info', DecisionLog.decisionMsg('send_queue'), DecisionLog.formatSendDecision(decision, pageCorr));
  }
  if (decision.action === 'noop') return; // seed-only / empty residual — no clear
  if (decision.action === 'enqueue') {
    if (typeof SendQueue !== 'undefined') {
      sendQueueState = SendQueue.enqueue(sendQueueState, decision.text);
      persistSendQueue();
      clearComposerAfterQueueOrSend();
      renderSendQueue();
      // Owner-visible: queue strip. Offline reason also flashes status briefly.
      if (decision.reason === 'offline' && sTxt && sTxt.textContent !== 'connected') {
        /* status already reconnecting/connecting — strip is the evidence */
      } else if (decision.reason === 'offline' && sTxt) {
        sTxt.textContent = 'queued (offline)';
      }
      return;
    }
    // No SendQueue module — keep draft and surface error (never silent drop).
    if (sTxt) sTxt.textContent = 'send failed — not connected';
    return;
  }
  // Wire send stays on main; stash suggestion for the user-bubble affordance.
  // 🎯T228: clear composer ONLY after transport accepts the payload.
  lastRouteSuggestion = pendingRouteSuggestion;
  const sent = submitWireText(decision.text, { interrupt: !!decision.interrupt });
  if (sent) {
    clearComposerAfterQueueOrSend();
    return;
  }
  // Race: wire closed between decide and send — fall back to visible queue.
  if (typeof SendQueue !== 'undefined') {
    sendQueueState = SendQueue.enqueue(sendQueueState, decision.text);
    persistSendQueue();
    clearComposerAfterQueueOrSend();
    renderSendQueue();
    if (sTxt) sTxt.textContent = 'queued (offline)';
    return;
  }
  if (sTxt) sTxt.textContent = 'send failed — not connected';
}

// 🎯T135: attach opt-in "Continue in: «title»" under a user bubble.
function attachRouteSwitch(msgEl, suggestion) {
  if (!msgEl || !suggestion || typeof RouteSuggest === 'undefined') return;
  if (!RouteSuggest.shouldShowSwitch({ reason: 'match', threadId: suggestion.threadId })) return;
  if (msgEl.querySelector && msgEl.querySelector('.route-switch')) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'route-switch';
  // 🎯T153: route-switch is pointer-only chrome — not a Tab stop.
  btn.tabIndex = -1;
  btn.textContent = RouteSuggest.formatSwitchLabel(suggestion);
  btn.title = 'Deliver this message to the suggested aside and interrupt main';
  btn.setAttribute('aria-label', btn.textContent);
  btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (btn.disabled) return;
    btn.disabled = true;
    optInRouteSwitch(suggestion);
    // 🎯T153: return focus to main composer after opt-in route click.
    focusComposer();
  });
  msgEl.appendChild(btn);
}

// 🎯T135 opt-in only: interrupt main + deliver body to suggested thread.
// Default auto-match never calls this — only the owner click does.
function optInRouteSwitch(suggestion) {
  if (typeof RouteSuggest === 'undefined' || typeof AttentionThreads === 'undefined') return;
  const plan = RouteSuggest.planOptInSwitch(suggestion);
  if (!plan.ok) return;
  if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
    jLog('info', DecisionLog.decisionMsg('thread_route'), {
      decision: 'opt_in_route_switch',
      threadId: plan.deliverTo,
      title: plan.title || '',
      corr: pageCorr,
    });
  }

      d.className = 'msg ' + msgRole;
      const body = document.createElement('div');
      body.className = 'msg-body';
      d.appendChild(body);
      d._body = body;
      if (typeof paintBody === 'function') {
        paintBody(d, msgRole, raw);
      } else if (msgRole === 'jevons' && typeof parseAssistantMarkdown === 'function') {
        body.innerHTML = parseAssistantMarkdown(raw);
        if (typeof decorateBodyLinks === 'function') decorateBodyLinks(body);
      } else if (msgRole === 'user' && typeof renderUserText === 'function') {
        body.innerHTML = renderUserText(raw);
      } else if (msgRole === 'jevons' || msgRole === 'user') {
        // Last-resort escape (still not textContent for assistant — avoids raw MD look
        // when marked is absent; escaped HTML is visible as plain).
        body.textContent = raw;
      } else {
        body.textContent = raw;
      }
      agentInspectBody.appendChild(d);
    } catch (paintErr) {
      // One bad turn must not abort the forEach — keep remaining turns paint-able.
      try {
        const d = document.createElement('div');
        d.className = 'msg ' + msgRole;
        const body = document.createElement('div');
        body.className = 'msg-body';
        d.appendChild(body);
        if (msgRole === 'jevons' && typeof parseAssistantMarkdown === 'function') {
          body.innerHTML = parseAssistantMarkdown(raw);
        } else if (msgRole === 'user' && typeof parseAssistantMarkdown === 'function'
            && typeof AgentTranscript !== 'undefined'
            && AgentTranscript.inspectUserShouldMarkdown
            && AgentTranscript.inspectUserShouldMarkdown(raw, false)) {
          body.innerHTML = parseAssistantMarkdown(raw);
        } else {
          body.textContent = raw;
        }
        agentInspectBody.appendChild(d);
      } catch (_) {
        const d = document.createElement('div');
        d.className = 'msg ' + msgRole;
        const body = document.createElement('div');
        body.className = 'msg-body';
        body.textContent = raw;
        d.appendChild(body);
        agentInspectBody.appendChild(d);
      }
    }
  });
  if (typeof decorateBodyLinks === 'function') {
    decorateBodyLinks(agentInspectBody); // 🎯T151 belt-and-suspenders
  }
  // 🎯T263/T265: working/activity chrome while turn open (aside/agent microcosm).
  if (wantWorking) {
    const wi = document.createElement('div');
    wi.className = 'working-indicator';
    wi.setAttribute('data-aside-working', '1');
    const dots = '<span class="work-dots" aria-hidden="true"><span></span><span></span><span></span></span>';
    // Prefer agent-named inspect label (not overseer "Jevons is working").
    if (typeof AgentTranscript !== 'undefined' && AgentTranscript.inspectWorkingLabel) {
      wi.innerHTML = dots + ' ' + AgentTranscript.escapeHtml(AgentTranscript.inspectWorkingLabel(
        model.title || selectedAgent || '',
      ));
    } else if (typeof workingLabelHTML === 'function') {
      wi.innerHTML = workingLabelHTML();
    } else {
      wi.innerHTML = dots + ' Working…';
    }
    agentInspectBody.appendChild(wi);
  }
  _agentInspectFp = fp;
  // Stickiness: pin only while Tracking; free preserves prevTop.
  if (follow && follow.applyAfterUpdate) {
    follow.applyAfterUpdate(agentInspectBody, prevTop);
    if (follow.shouldPin && follow.shouldPin()) {
      requestAnimationFrame(function () {
        if (follow.shouldPin()) follow.applyAfterUpdate(agentInspectBody);
      });
    }
  }
}

// 🎯T209 residual: manual refresh re-issues inspect_subscribe (wire history),
// optionally falling back to HTTP GET for debug when transport is down.
function loadAgentTranscript(name, opts) {
  if (!name || !agentInspectEl) return;
  // Hard guard: never fetch/render overseer into RHS pane.
  if (typeof AgentTranscript !== 'undefined' && !AgentTranscript.shouldOpenTranscript(name)) {
    hideAgentInspect();
    return;
  }
  const quiet = !!(opts && opts.quiet);
  // Primary product path: re-subscribe on /ws/chat for sealed history push.
  if (typeof transport !== 'undefined' && transport.send) {
    subscribeAgentInspect(name);
    return;
  }
  // Residual HTTP when no chat transport (export/debug / hermetic stubs).
  fetch('/api/agents/' + encodeURIComponent(name) + '/transcript')
    .then(function (r) {
      if (!r.ok) return r.json().then(function (j) {
        throw new Error((j && j.error) || ('HTTP ' + r.status));
      });
      return r.json();
    })
    .then(function (payload) {
      const model = (typeof AgentTranscript !== 'undefined')
        ? AgentTranscript.paneModel(name, payload)
        : { title: name, lines: (payload && payload.turns) || [], empty: !(payload && payload.turns && payload.turns.length), error: '' };
      if (payload && payload.error && model.empty) {
        model.error = '';
      }
      _agentInspectLines = (model.lines || []).map(function (l) {
        return { role: l.role, text: l.text };
      });
      renderAgentInspect(model);
      document.querySelectorAll('.agent-node').forEach(n =>
        n.classList.toggle('selected', n.dataset.agent === name));
    })
    .catch(function (err) {
      if (quiet) return;
      const model = (typeof AgentTranscript !== 'undefined')
        ? AgentTranscript.paneModel(name, null, err)
        : { title: name, lines: [], empty: true, error: String(err && err.message || err) };
      renderAgentInspect(model);
    });
}

function renderFrontierTable(model) {
  if (!frontierBodyEl) return;
  // 🎯T266: cache ledger/cwd for target-ask context chrome resolution.
  if (model) {
    lastFrontierLedger = model.ledger ? String(model.ledger) : '';
    lastFrontierCwd = model.cwd ? String(model.cwd) : '';
  }
  // 🎯T230: never tear down a latched InstantTip (pointer over tip or host).
  // Quiet poll / frontier_changed used to removeChild every .instant-tip,
  // which felt like an idle auto-timeout while the mouse sat still on the card.
  // Skip remount while latched; next poll after leave applies the fresh model.
  if (typeof InstantTip !== 'undefined' && typeof InstantTip.anyHoverLatched === 'function'
      && InstantTip.anyHoverLatched()) {
    return;
  }
  // Drop previous fixed-layer tips (hosts are about to be destroyed).
  // Prefer InstantTip.discardDetachedTips so registry + sticky state stay consistent.
  if (typeof InstantTip !== 'undefined' && typeof InstantTip.discardDetachedTips === 'function') {
    InstantTip.discardDetachedTips(document);
  } else {
    document.querySelectorAll('.instant-tip').forEach(function (el) {
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });
  }
  if (rhsTabMeta) {
    rhsTabMeta.textContent = model.available
      ? ((model.rows && model.rows.length) + ' ready')
      : '';
    rhsTabMeta.title = model.ledger
      ? ('Ledger: ' + model.ledger + ' (via bullseye discovery)')
      : (model.error || 'No ledger');
  }
  if (model.error && !model.available) {
    frontierBodyEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'ai-empty';
    empty.textContent = (typeof FrontierTable !== 'undefined')
      ? FrontierTable.emptyMessage(model)
      : (model.error || 'Frontier unavailable.');
    frontierBodyEl.appendChild(empty);
    return;
  }
  if (model.empty) {
    frontierBodyEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'ai-empty';
    empty.textContent = (typeof FrontierTable !== 'undefined')
      ? FrontierTable.emptyMessage(model)
      : 'Frontier is empty.';
    frontierBodyEl.appendChild(empty);
    return;
  }
  // 🎯T173: headerless table — id / name / status abbr / fanout N᚛ (hide 0).
  // 🎯T175: explanations via InstantTip (0ms), never native title= on these cells.
  // 🎯T181: ID + name → rich markdown target card (left-of-pointer placement).
  // 🎯T198: merge /api/agents target_id → engaged rows sink bottom, play→stop.
  const table = document.createElement('table');
  table.id = 'frontier-table';
  table.setAttribute('aria-label', 'Bullseye frontier');
  const tbody = document.createElement('tbody');
  const agents = (model && model.agents) || frontierAgentsCache || [];
  const rows = (typeof FrontierTable !== 'undefined' && FrontierTable.applyEngagement)
    ? FrontierTable.applyEngagement(model.rows || [], agents)
    : (model.rows || []);
  // 🎯T267: emphasize row matching frontierHighlightId (target-ask focus).
  const highlightId = (typeof frontierHighlightId !== 'undefined' && frontierHighlightId)
    ? frontierHighlightId
    : '';
  rows.forEach(function (row) {
    const tr = document.createElement('tr');
    const classes = [];
    if (row.engaged) {
      classes.push('ft-engaged');
      tr.setAttribute('data-engaged', '1');
      if (row.engaged_agents && row.engaged_agents.length) {
        tr.setAttribute('data-engaged-agents', row.engaged_agents.join(','));
      }
    }
    if (row.id) {
      tr.setAttribute('data-target-id', String(row.id).replace(/^🎯/, '').trim());
    }
    const isHL = (typeof FrontierTable !== 'undefined' && FrontierTable.rowMatchesHighlight)
      ? FrontierTable.rowMatchesHighlight(row, highlightId)
      : !!(highlightId && row.id &&
        String(row.id).replace(/^🎯/, '').trim() === String(highlightId).replace(/^🎯/, '').trim());
    if (isHL) {
      classes.push('ft-highlight');
      tr.setAttribute('data-frontier-highlight', '1');
      tr.setAttribute('aria-selected', 'true');
    }
    if (classes.length) tr.className = classes.join(' ');
    const id = document.createElement('td');
    id.className = 'ft-id';
    id.textContent = '🎯' + row.id;
    const name = document.createElement('td');
    name.className = 'ft-name';
    const fullName = row.name || '';
    name.textContent = (typeof FrontierTable !== 'undefined')
      ? FrontierTable.shortName(fullName, 72)
      : fullName;
    // 🎯T181/T184: full semantic card on ID and name (markdown HTML + mermaid deps).
    if (typeof InstantTip !== 'undefined' && typeof FrontierTable !== 'undefined'
        && FrontierTable.formatTargetCardMarkdown) {
      const md = FrontierTable.formatTargetCardMarkdown(row);
      const plain = FrontierTable.formatTargetCardPlain
        ? FrontierTable.formatTargetCardPlain(row)
        : md;
      if (md) {
        let html = md;
        // Markdown-bearing fields (acceptance/context/attestation + mermaid fence)
        // via marked / parseAssistantMarkdown — not plain escaped text only.
        if (typeof parseAssistantMarkdown === 'function') {
          try { html = parseAssistantMarkdown(md); } catch (_) { html = md; }
        } else if (typeof marked !== 'undefined' && marked.parse) {
          try { html = marked.parse(md); } catch (_) { html = md; }
        }
        // 🎯T186/T231: sticky card; ONE hit rect = AABB(card ∪ id+name).
        // Leave rect → dismiss immediately (HIDE_GRACE_MS=0). No bridge element.
        // groupHosts = id+name of active row; clamp right edge left of table.
        const cardOpts = {
          html: true,
          ariaLabel: plain,
          placement: InstantTip.PLACE_LEFT_OF_POINTER || 'left-of-pointer',
          className: InstantTip.CARD_CLASS || 'instant-tip-card',
          sticky: true,
          hitGroup: true,
          groupHosts: [id, name],
          clampSelectors: ['#frontier-table', '#frontier-body'],
        };
        // Single attach per row (id primary; name in groupHosts hit rect).
        const tipCard = InstantTip.attach(id, html, cardOpts);
        // 🎯T184: render mermaid minigraph inside card tips (same path as chat).
        if (typeof renderMermaidIn === 'function' && tipCard) {
          renderMermaidIn(tipCard);
        }
      }
    } else if (fullName && typeof InstantTip !== 'undefined') {
      // Fallback: name-only tip when pure helpers unavailable.
      InstantTip.attach(name, fullName);
    }
    const status = document.createElement('td');
    status.className = 'ft-status';
    let statusTip = '';
    if (typeof FrontierTable !== 'undefined') {
      status.textContent = FrontierTable.formatStatus(row.status);
      statusTip = FrontierTable.statusTitle(row.status);
    } else {
      status.textContent = row.status || '';
      statusTip = row.status || '';
    }
    if (statusTip && typeof InstantTip !== 'undefined') {
      InstantTip.attach(status, statusTip);
    }
    const fan = document.createElement('td');
    fan.className = 'ft-fanout';
    if (typeof FrontierTable !== 'undefined' && FrontierTable.formatFanout) {
      // 🎯T179: tip = lead count line + "• TID Name" bullets from dependents[]
      const fo = FrontierTable.formatFanout(row.fanout, row.id, row.dependents);
      if (fo.visible) {
        fan.textContent = fo.text;
        if (fo.title && typeof InstantTip !== 'undefined') {
          InstantTip.attach(fan, fo.title);
        }
      } else {
        fan.className = 'ft-fanout ft-fanout-empty';
        fan.textContent = '';
      }
    } else {
      const n = row.fanout != null ? row.fanout : 0;
      fan.textContent = n > 0 ? String(n) : '';
    }
    // 🎯T182/T198: free → play (kickoff PO); engaged → stop (kill by target_id).
    const play = document.createElement('td');
    play.className = 'ft-play';
    const playBtn = document.createElement('button');
    playBtn.type = 'button';
    const engaged = !!row.engaged;
    if (engaged) {
      playBtn.className = 'ft-play-btn ft-stop-btn';
      playBtn.textContent = (typeof FrontierTable !== 'undefined' && FrontierTable.STOP_GLYPH)
        ? FrontierTable.STOP_GLYPH
        : '\u25A0';
      playBtn.setAttribute('aria-label', 'Stop work on 🎯' + (row.id || ''));
      playBtn.title = 'Stop engaged worker(s) for this target';
      playBtn.addEventListener('click', function (ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        stopFrontierEngagement(row, playBtn);
      });
    } else {
      playBtn.className = 'ft-play-btn';
      playBtn.textContent = (typeof FrontierTable !== 'undefined' && FrontierTable.PLAY_GLYPH)
        ? FrontierTable.PLAY_GLYPH
        : '\u25B6';
      playBtn.setAttribute('aria-label', 'Start work on 🎯' + (row.id || ''));
      // 🎯T255: tooltip shows real kickoff recipient (selected product PO, not hard-coded).
      const playPO = (typeof FrontierTable !== 'undefined' && FrontierTable.resolvePlayPO)
        ? FrontierTable.resolvePlayPO({
            selectedAgent: typeof selectedAgent !== 'undefined' ? selectedAgent : null,
            agents: agents,
          })
        : 'jevons-po';
      playBtn.title = (typeof FrontierTable !== 'undefined' && FrontierTable.playKickoffTitle)
        ? FrontierTable.playKickoffTitle(playPO)
        : ('Start work via ' + playPO);
      playBtn.setAttribute('data-play-po', playPO);
      playBtn.addEventListener('click', function (ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        playFrontierTarget(row, playBtn);
      });
    }
    play.appendChild(playBtn);
    tr.appendChild(id);
    tr.appendChild(name);
    tr.appendChild(status);
    tr.appendChild(fan);
    tr.appendChild(play);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  frontierBodyEl.innerHTML = '';
  frontierBodyEl.appendChild(table);
  // 🎯T267: ensure highlighted target-ask row is visible in the pane.
  const hlRow = tbody.querySelector('tr.ft-highlight');
  if (hlRow && typeof hlRow.scrollIntoView === 'function') {
    try { hlRow.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (_) { /* ignore */ }
  }
}

// 🎯T198: latest /api/agents snapshot for frontier engagement merge.
let frontierAgentsCache = [];

// 🎯T182: POST product agent-send path so PO spawns/briefs work on the target.
// Mock seam: window.__frontierAgentSend(url, body) → Promise (hermetic tests).
// 🎯T222: blocked when engaged / set_aside / achieved — no second kickoff.
// 🎯T255: kickoff recipient = selected product PO (not hard-coded jevons-po).
function playFrontierTarget(row, btnEl) {
  if (!row || !row.id) return Promise.resolve(null);
  const playOpts = {
    selectedAgent: typeof selectedAgent !== 'undefined' ? selectedAgent : null,
    agents: (typeof frontierAgentsCache !== 'undefined' && frontierAgentsCache)
      ? frontierAgentsCache
      : (typeof lastFleetAgents !== 'undefined' && lastFleetAgents ? lastFleetAgents : []),
  };
  const req = (typeof FrontierTable !== 'undefined' && FrontierTable.playKickoffRequest)
    ? FrontierTable.playKickoffRequest(row, playOpts)
    : (function () {
        const po = (typeof FrontierTable !== 'undefined' && FrontierTable.resolvePlayPO)
          ? FrontierTable.resolvePlayPO(playOpts)
          : 'jevons-po';
        return {
          url: '/api/agents/' + encodeURIComponent(po) + '/send',
          method: 'POST',
          body: {
            text: 'Start work on frontier target 🎯' + row.id +
              (row.name ? (' — ' + row.name) : '') +
              '.\n\nKick off now: spawn/brief a fleet worker with parent=' + po +
              ' and target_id=' + row.id +
              ' (jevons_agent_start target_id — 🎯T198). Do not only toast or acknowledge.',
          },
          po: po,
        };
      })();
  // 🎯T222: pure gate may return blocked (no body).
  if (req && req.blocked) {
    if (typeof jLog === 'function') {
      jLog('info', 'frontier_play_blocked', {
        target: row.id,
        reason: req.reason,
        message: req.message,
      });
    }
    return Promise.resolve({ status: 'blocked', reason: req.reason, message: req.message });
  }
  if (!req || !req.body || !req.body.text) return Promise.resolve(null);
  if (btnEl) btnEl.disabled = true;
  const sendFn = (typeof window !== 'undefined' && typeof window.__frontierAgentSend === 'function')
    ? window.__frontierAgentSend
    : function (url, body) {
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) {
              const err = new Error((j && j.error) || ('HTTP ' + r.status));
              err.status = r.status;
              err.body = j;
              throw err;
            }
            return j;
          }).catch(function (e) {
            if (e && e.status) throw e;
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return {};
          });
        });
      };
  return Promise.resolve(sendFn(req.url, req.body))
    .then(function (res) {
      if (typeof jLog === 'function') {
        jLog('info', 'frontier_play', {
          target: row.id,
          po: req.po,
          status: (res && res.status) || 'sent',
        });
      }
      return res;
    })
    .catch(function (err) {
      if (typeof jLog === 'function') {
        jLog('warn', 'frontier_play_failed', {
          target: row.id,
          po: req.po,
          err: String(err && err.message || err),
        });
      }
      return null;
    })
    .finally(function () {
      if (btnEl) btnEl.disabled = false;
    });
}

// 🎯T198: POST /api/agents/engagement/stop — kill workers with matching target_id.
// Mock seam: window.__frontierEngagementStop(url, body) → Promise.
function stopFrontierEngagement(row, btnEl) {
  if (!row || !row.id) return Promise.resolve(null);
  const req = (typeof FrontierTable !== 'undefined' && FrontierTable.stopEngagementRequest)
    ? FrontierTable.stopEngagementRequest(row.id)
    : {
        url: '/api/agents/engagement/stop',
        method: 'POST',
        body: { target_id: String(row.id).replace(/^🎯/, '').trim() },
        target_id: String(row.id).replace(/^🎯/, '').trim(),
      };
  if (!req || !req.body || !req.body.target_id) return Promise.resolve(null);
  if (btnEl) btnEl.disabled = true;
  const stopFn = (typeof window !== 'undefined' && typeof window.__frontierEngagementStop === 'function')
    ? window.__frontierEngagementStop
    : function (url, body) {
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) {
              const err = new Error((j && j.error) || ('HTTP ' + r.status));
              err.status = r.status;
              err.body = j;
              throw err;
            }
            return j;
          }).catch(function (e) {
            if (e && e.status) throw e;
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return {};
          });
        });
      };
  return Promise.resolve(stopFn(req.url, req.body))
    .then(function (res) {
      if (typeof jLog === 'function') {
        jLog('info', 'frontier_stop', {
          target: row.id,
          stopped: (res && res.stopped) || [],
          status: (res && res.status) || 'ok',
        });
      }
      // Refresh agents + frontier so engaged chrome clears without waiting for poll.
      if (typeof refreshAgents === 'function') refreshAgents();
      if (typeof loadFrontier === 'function') loadFrontier({ quiet: true });
      return res;
    })
    .catch(function (err) {
      if (typeof jLog === 'function') {
        jLog('warn', 'frontier_stop_failed', {
          target: row.id,
          err: String(err && err.message || err),
        });
      }
      return null;
    })
    .finally(function () {
      if (btnEl) btnEl.disabled = false;
    });
}

function loadFrontier(opts) {
  if (!frontierBodyEl) return;
  const quiet = !!(opts && opts.quiet);
  // 🎯T253: bind frontier fetch to selected agent workdir (primary when none/overseer).
  const baseApi = (typeof FrontierTable !== 'undefined' && FrontierTable.API_PATH)
    ? FrontierTable.API_PATH
    : '/api/frontier';
  const agentsForCwd = (typeof frontierAgentsCache !== 'undefined' && frontierAgentsCache && frontierAgentsCache.length)
    ? frontierAgentsCache
    : (typeof lastFleetAgents !== 'undefined' ? lastFleetAgents : []);
  const frontierCwd = (typeof FrontierTable !== 'undefined' && FrontierTable.resolveFrontierCwd)
    ? FrontierTable.resolveFrontierCwd(
        typeof selectedAgent !== 'undefined' ? selectedAgent : null,
        agentsForCwd)
    : '';
  const api = (typeof FrontierTable !== 'undefined' && FrontierTable.frontierAPIURL)
    ? FrontierTable.frontierAPIURL(baseApi, frontierCwd)
    : (frontierCwd
      ? baseApi + '?cwd=' + encodeURIComponent(frontierCwd)
      : baseApi);
  const agentsApi = (typeof FrontierTable !== 'undefined' && FrontierTable.AGENTS_API_PATH)
    ? FrontierTable.AGENTS_API_PATH
    : '/api/agents';
  // 🎯T198: fetch frontier + agents; merge by target_id (no name parse).
  Promise.all([
    fetch(api).then(function (r) {
      if (!r.ok) return r.json().then(function (j) {
        throw new Error((j && j.error) || ('HTTP ' + r.status));
      }).catch(function () {
        throw new Error('HTTP ' + r.status);
      });
      return r.json();
    }),
    fetch(agentsApi).then(function (r) {
      if (!r.ok) return [];
      return r.json().catch(function () { return []; });
    }).catch(function () { return []; }),
  ])
    .then(function (pair) {
      const payload = pair[0];
      const agents = Array.isArray(pair[1]) ? pair[1] : [];
      frontierAgentsCache = agents;
      const model = (typeof FrontierTable !== 'undefined')
        ? FrontierTable.normalizePayload(payload)
        : {
            available: !!(payload && payload.available),
            ledger: (payload && payload.ledger) || '',
            rows: (payload && payload.targets) || [],
            empty: !(payload && payload.targets && payload.targets.length),
            error: (payload && payload.error) || '',
          };
      model.agents = agents;
      renderFrontierTable(model);
      // Light poll fallback when pane is up (fsnotify pushes frontier_changed).
      if (!frontierPollTimer) {
        const ms = (typeof FrontierTable !== 'undefined' && FrontierTable.POLL_MS)
          ? FrontierTable.POLL_MS
          : 8000;
        frontierPollTimer = setInterval(function () {
          loadFrontier({ quiet: true });
        }, ms);
      }
    })
    .catch(function (err) {
      if (quiet) return;
      const model = (typeof FrontierTable !== 'undefined')
        ? FrontierTable.normalizePayload(null, err)
        : { available: false, rows: [], empty: true, error: String(err && err.message || err) };
      model.agents = frontierAgentsCache || [];
      renderFrontierTable(model);
    });
}

const agentInspectClose = document.getElementById('agent-inspect-close');
if (agentInspectClose) agentInspectClose.onclick = function () { selectAgent(selectedAgent); };
const agentInspectRefresh = document.getElementById('agent-inspect-refresh');
if (agentInspectRefresh) agentInspectRefresh.onclick = function () {
  if (selectedAgent) loadAgentTranscript(selectedAgent, { quiet: false });
};

// 🎯T251: sidebar Transcript composer → POST /api/agents/{selected}/send
// Independent of main #input / transport overseer wire.
function sendSidebarComposer() {
  if (!agentInspectInput || !selectedAgent) return Promise.resolve(null);
  const text = agentInspectInput.value;
  let purpose = '';
  if (Array.isArray(lastFleetAgents)) {
    const row = lastFleetAgents.find(function (a) {
      return a && a.name === selectedAgent;
    });
    if (row) purpose = row.purpose || '';
  }
  const req = (typeof AgentTranscript !== 'undefined' && AgentTranscript.sidebarSendRequest)
    ? AgentTranscript.sidebarSendRequest(selectedAgent, text, { purpose: purpose })
    : (function () {
        const body = String(text || '').trim();
        if (!body || !selectedAgent) return { ok: false, reason: 'empty' };
        return {
          ok: true,
          name: selectedAgent,
          url: '/api/agents/' + encodeURIComponent(selectedAgent) + '/send',
          method: 'POST',
          body: { text: body },
        };
      })();
  if (!req || !req.ok) {
    syncSidebarSendEnabled();
    return Promise.resolve(null);
  }
  _sidebarComposerSending = true;
  syncSidebarSendEnabled();
  // Hermetic/mock seam (mirrors frontier play).
  const sendFn = (typeof window !== 'undefined' && typeof window.__sidebarAgentSend === 'function')
    ? window.__sidebarAgentSend
    : function (url, body) {
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) {
              const err = new Error((j && j.error) || ('HTTP ' + r.status));
              err.status = r.status;
              err.body = j;
              throw err;
            }
            return j;
          }).catch(function (e) {
            if (e && e.status) throw e;
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return {};
          });
        });
      };
  return Promise.resolve(sendFn(req.url, req.body))
    .then(function (res) {
      if (typeof jLog === 'function') {
        jLog('info', 'sidebar_agent_send', {
          name: req.name,
          status: (res && res.status) || 'sent',
        });
      }
      // Clear draft for this agent after accept.
      if (agentInspectInput) {
        agentInspectInput.value = '';
        if (req.name) sidebarDraftByAgent[req.name] = '';
      }
      // 🎯T265: optimistic owner bubble + working chrome (main-chat microcosm).
      if (req.body && req.body.text) {
        if (typeof AgentTranscript !== 'undefined' && AgentTranscript.afterSidebarSendOptimistic) {
          const opt = AgentTranscript.afterSidebarSendOptimistic(
            _agentInspectLines,
            req.body.text,
            { title: selectedAgent },
          );
          _agentInspectLines = opt.lines;
          _agentInspectWorking = true;
          _agentInspectFp = '';
          if (typeof renderAgentInspect === 'function') {
            renderAgentInspect(opt.model);
          }
        } else {
          _agentInspectLines = (_agentInspectLines || []).concat([
            { role: 'user', text: req.body.text },
          ]);
          _agentInspectWorking = true;
          _agentInspectFp = '';
          if (typeof renderAgentInspect === 'function') {
            renderAgentInspect({
              title: selectedAgent,
              empty: false,
              error: '',
              lines: (_agentInspectLines || []).map(function (l) {
                return { role: l.role, text: l.text };
              }),
              working: true,
            });
          }
        }
      }
      // 🎯T252: post-send empty draft → next attention aside if any.
      if (typeof onSidebarComposerSent === 'function') {
        onSidebarComposerSent(req.name);
      }
      return res;
    })
    .catch(function (err) {
      if (typeof jLog === 'function') {
        jLog('warn', 'sidebar_agent_send_failed', {
          name: req.name,
          err: String(err && err.message || err),
        });
      }
      if (agentInspectBody) {
        let errEl = agentInspectBody.querySelector('.ai-err.sidebar-send-err');
        if (!errEl) {
          errEl = document.createElement('div');
          errEl.className = 'ai-err sidebar-send-err';
          agentInspectBody.insertBefore(errEl, agentInspectBody.firstChild);
        }
        errEl.textContent = 'Send failed: ' + String(err && err.message || err);
      }
      return null;
    })
    .finally(function () {
      _sidebarComposerSending = false;
      syncSidebarSendEnabled();
      if (agentInspectInput && typeof agentInspectInput.focus === 'function') {
        try { agentInspectInput.focus(); } catch (_) { /* isolated */ }
      }
    });
}

if (agentInspectInput) {
  agentInspectInput.addEventListener('input', function () {
    if (selectedAgent) sidebarDraftByAgent[selectedAgent] = agentInspectInput.value;
    syncSidebarSendEnabled();
    // 🎯T252: draft cleared while queue non-empty → may advance attention.
    if (typeof isSidebarComposerDraftEmpty === 'function' && isSidebarComposerDraftEmpty() &&
        typeof maybeAutoActivateAttention === 'function') {
      maybeAutoActivateAttention('draft-cleared');
    }
    // Compact auto-grow (sidebar cap).
    agentInspectInput.style.height = 'auto';
    const maxPx = Math.round(window.innerHeight * 0.22) || 120;
    const next = Math.min(agentInspectInput.scrollHeight, maxPx);
    agentInspectInput.style.height = next + 'px';
    agentInspectInput.style.overflowY =
      agentInspectInput.scrollHeight > maxPx + 1 ? 'auto' : 'hidden';
  });
  agentInspectInput.addEventListener('keydown', function (e) {
    const act = (typeof AgentTranscript !== 'undefined' && AgentTranscript.classifySidebarComposerKey)
      ? AgentTranscript.classifySidebarComposerKey(e)
      : ((e.key === 'Enter' || e.code === 'Enter')
        ? (e.shiftKey ? 'newline' : 'send')
        : null);
    if (act === 'send') {
      e.preventDefault();
      e.stopPropagation();
      sendSidebarComposer();
    }
  });
}
if (agentInspectSend) {
  agentInspectSend.addEventListener('mousedown', function (e) { e.preventDefault(); });
  agentInspectSend.addEventListener('click', function (e) {
    e.preventDefault();
    sendSidebarComposer();
  });
}
if (typeof syncSidebarComposer === 'function') syncSidebarComposer();

const frontierRefresh = document.getElementById('frontier-refresh');
if (frontierRefresh) frontierRefresh.onclick = function () {
  loadFrontier({ quiet: false });
};
// 🎯T185: Graph — ~90% unachieved dependency graph (Refresh kept as recovery).
const frontierGraph = document.getElementById('frontier-graph');
if (frontierGraph) frontierGraph.onclick = function () {
  if (typeof openFrontierGraph === 'function') openFrontierGraph({ pin: true });
};
// Boot: show frontier table (T131 default tab).
if (typeof loadFrontier === 'function') {
  try { loadFrontier({ quiet: false }); } catch (e) { /* isolated */ }
}

function openTerminal(name) {
  closeTerminal();
  termHeader.textContent = name;
  termHeader.style.display = 'block';
  termContainer.style.display = 'block';

  term = new Terminal({
    fontFamily: 'JetBrains Mono, SF Mono, Menlo, monospace',
    fontSize: 12,
    theme: {
      background: '#0c0c0f',
      foreground: '#d4d4dc',
      cursor: '#8b7cf6',
      selectionBackground: 'rgba(139,124,246,0.3)',
    },
    scrollback: 10000,
    convertEol: true,
  });
  termFit = new FitAddon.FitAddon();
  term.loadAddon(termFit);
  term.open(termContainer);
  termFit.fit();

  const h = location.hostname === 'localhost' ? '127.0.0.1:'+location.port : location.host;
  const cols = term.cols;
  const rows = term.rows;
  termWs = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+h+'/ws/agent-terminal?name='+encodeURIComponent(name)+'&cols='+cols+'&rows='+rows);
  termWs.binaryType = 'arraybuffer';
  termWs.onmessage = e => {
    if (e.data instanceof ArrayBuffer) {
      term.write(new Uint8Array(e.data));
    } else {
      term.write(e.data);
    }
  };
  termWs.onclose = () => { /* terminal closed */ };

  // Handle resize.
  const ro = new ResizeObserver(() => {
    if (termFit) {
      termFit.fit();
      if (termWs && termWs.readyState === 1) {
        termWs.send(JSON.stringify({type:'resize', cols:term.cols, rows:term.rows}));
      }
    }
  });
  ro.observe(termContainer);
  termContainer._ro = ro;
}

function closeTerminal() {
  selectedAgent = null;
  if (typeof hideAgentInspect === 'function') hideAgentInspect();
  if (termWs) { termWs.close(); termWs = null; }
  if (term) { term.dispose(); term = null; }
  if (termContainer._ro) { termContainer._ro.disconnect(); termContainer._ro = null; }
  termHeader.style.display = 'none';
  termContainer.style.display = 'none';
  termContainer.innerHTML = '';
  document.querySelectorAll('.agent-node').forEach(n => n.classList.remove('selected'));
}

// Preserve input across reloads (late path if boot restore missed).
// 🎯T183/T239: re-sync seed-only class after restore so real draft is visible.
try {
  if (typeof ComposerPersist !== 'undefined') {
    const late = ComposerPersist.restoreDraft(window.localStorage, window.sessionStorage);
    if (!late.ok && late.present) {
      console.error('ComposerPersist: late draft restore failed', late.error);
    } else if (late.text && late.text.trim() && (!input.value || !(input.value || '').trim() ||
        (typeof WisprContext !== 'undefined' && WisprContext.isEffectivelyEmpty(input.value)))) {
      input.value = late.text;
      liveDraftBackup = late.text;
    }
  } else {
    const savedInput = sessionStorage.getItem('jevons-input');
    if (savedInput) {
      input.value = savedInput;
      sessionStorage.removeItem('jevons-input');
    }
  }
} catch (_) {}
if (typeof syncComposerSeedClass === 'function') syncComposerSeedClass();
if (typeof autoGrow === 'function') autoGrow();

// Voice UI — uses transport abstraction for both browser and native modes.
const voiceBtn = document.getElementById('voice-btn');
const voiceStatus = document.getElementById('voice-status');
const voiceStatusText = document.getElementById('voice-status-text');
let voiceActive = false;

// Built-in voice/mic removed from the web UI — dictation is done via
// Wispr Flow into the text field. The voice machinery below is left
// dormant (never engaged) rather than ripped out. Guard the (now
// absent) button so the rest of the script still loads.
voiceBtn?.addEventListener('click', () => {
  if (voiceActive) stopVoice(); else startVoice();
});

// Push-to-talk via Ctrl. Hold Control to engage voice, release to stop.
// If any other key is pressed while Ctrl is down, treat it as a Ctrl+X
// shortcut and cancel voice (so Ctrl+C / Ctrl+R / etc. still work).
// PTT model: voiceActive means "the WS to the server is open". pttActive
// means "Ctrl is currently held — actively recording". The WS persists
// across press/release cycles so the Grok session can stay alive between
// utterances (commit on release, response streams back over the same WS).
//
// Ctrl is the engagement key, but the user has system hotkeys that
// include Ctrl as a modifier (screenshots, etc.). To avoid engaging the
// mic the moment Ctrl goes down during one of those chords, we arm a
// short timer on Ctrl keydown and only engage when Ctrl has been held
// ALONE for pttArmDelayMs. Any other key arriving in that window
// cancels the arm, so Ctrl-Shift-3 etc. never fires the mic.
// 250ms is long enough to cover most multi-key system hotkeys
// (Ctrl→Shift→key chord sequences) without feeling sluggish for
// deliberate PTT presses, where the user is naturally holding the
// key down for >>250ms.
const pttArmDelayMs = 250;
let pttActive = false;
let pttArmTimer = null;

// Track every non-Ctrl key currently held so we can detect chords where
// some other key was pressed BEFORE Ctrl (simultaneous chord presses
// can land in any order; the previous logic only handled Ctrl-first).
const pttHeldKeys = new Set();

function pttArm() {
  return; // Ctrl push-to-talk disabled — using Wispr Flow, not the built-in mic.
  if (pttArmTimer || pttActive) return;
  pttArmTimer = setTimeout(() => {
    pttArmTimer = null;
    pttEngage();
  }, pttArmDelayMs);
}

function pttCancelArm() {
  if (pttArmTimer) {
    clearTimeout(pttArmTimer);
    pttArmTimer = null;
  }
}

function pttEngage() {
  if (!voiceActive) startVoice(); // lazy-open on first engage
  pttActive = true;
  transport.startMic();
  vadReset();
  voiceBtn.classList.add('active');
  voiceBtn.style.boxShadow = '0 0 4px rgba(248,113,113,0.3)';
  voiceStatusText.textContent = 'listening';
  jLog('info', 'ptt engage', {
    voiceActive,
    audioCtxState: transport._audioCtx?.state,
    mediaStreamActive: transport._mediaStream?.active,
    voiceWsState: transport.voiceWs?.readyState,
  });
}

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key !== 'Control') pttHeldKeys.add(e.code);

  if (e.key === 'Control') {
    // Refuse to arm if anything else is already held — chord, not PTT.
    // Covers BOTH orderings: Ctrl-after-X (pttHeldKeys non-empty) and
    // Ctrl-with-modifier (e.shiftKey/altKey/metaKey already set, which
    // can happen even if the modifier keydown wasn't observed yet on
    // this listener — the underlying state is current).
    if (pttHeldKeys.size > 0 || e.shiftKey || e.altKey || e.metaKey) {
      console.debug('[ptt] arm suppressed — other key/modifier held');
      return;
    }
    pttArm();
  } else {
    // Any other keydown while we are armed or active → chord.
    pttCancelArm();
    if (pttActive && (e.ctrlKey || e.metaKey)) pttRelease();
  }
});
window.addEventListener('keyup', e => {
  if (e.key !== 'Control') pttHeldKeys.delete(e.code);
  if (e.key === 'Control') {
    pttCancelArm(); // brief Ctrl tap (< arm delay) → never engaged
    if (pttActive) pttRelease();
  }
});
// Window-blur, tab-switch, visibility loss: stop recording even if we
// missed the keyup (focus changes can swallow it). Force-kill the mic
// regardless of pttActive's state so the OS indicator can never hang
// stale. Also clear the held-keys Set — a key whose keyup we missed
// during a focus shift would otherwise stay "held" forever.
window.addEventListener('blur', () => {
  pttHeldKeys.clear();
  if (pttActive) pttRelease();
  transport.stopMic();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    pttHeldKeys.clear();
    if (pttActive) pttRelease();
    transport.stopMic();
  }
});

function pttRelease() {
  pttActive = false;
  voiceBtn.classList.remove('active');
  voiceBtn.style.boxShadow = '';
  const audioCtxState = transport._audioCtx?.state;
  const voiceWsState = transport.voiceWs?.readyState;
  const stats = {
    framesSeen: vad.framesSeen,
    framesSent: vad.framesSent,
    peakRms:    vad.peakRms,
    noiseFloor: vad.noiseFloor,
    audioCtxState, voiceWsState,
  };
  if (vad.heardSpeech) {
    voiceStatusText.textContent = 'processing';
    transport.commitVoice();
    jLog('info', 'ptt release / commit', stats);
  } else {
    voiceStatusText.textContent = 'listening';
    transport.clearVoice();
    jLog('info', 'ptt release / clear (no speech)', stats);
  }
}

function startVoice() {
  voiceBtn.classList.add('connecting');
  voiceActive = true;
  transport.startVoice();
}

function stopVoice() {
  voiceActive = false;
  pttActive = false;
  voiceBtn.classList.remove('active', 'connecting');
  voiceStatus.classList.remove('on');
  voiceBtn.style.boxShadow = '';
  transport.stopVoice();
}

// Transport's voice WS closed unexpectedly (most commonly: server-side
// 30 s idle timeout). Reset the page-level state so the next PTT press
// triggers a fresh startVoice() — without this, voiceActive stays true,
// startVoice is skipped, and the next utterance's audio + commit are
// silently dropped over a dead WS.
transport.onVoiceClose = () => {
  jLog?.('info', 'voice WS closed — resetting page state');
  // Don't call pttRelease — its commitVoice() would no-op against a
  // dead WS and the UI state would land in 'processing' instead of
  // back at 'idle'. Just inline the cleanup.
  pttCancelArm();
  pttActive = false;
  voiceActive = false;
  voiceBtn.classList.remove('active', 'connecting');
  voiceBtn.style.boxShadow = '';
  voiceStatus.classList.remove('on');
  voiceStatusText.textContent = 'listening';
};

// Local VAD — gate the audio stream to Grok so silence between turns
// or mid-pause "I changed my mind" releases don't deliver an empty
// buffer that Grok dutifully responds to.
//
// Design constraints (learned the hard way):
//   - holdMs must be long enough to span a normal mid-sentence pause
//     (~2-3 seconds), or VAD chops mid-utterance and Grok hears two
//     fragments instead of one. We pick 2500ms.
//   - preBuffer captures the few frames before VAD onset, otherwise
//     soft openings ("uh, can you...") lose their leading consonants.
//   - onset/offset use hysteresis (different ratios) so a single
//     loud blip doesn't briefly start/stop the stream.
//
// State is per-engagement: reset in pttEngage so VAD's noise floor
// learns from the current room rather than yesterday's session.
const vad = {
  noiseFloor:   0.005, // running estimate of background level
  noiseAlpha:   0.02,  // EMA weight for noise-floor adaptation
  onsetRatio:   2.5,   // RMS > noiseFloor * onsetRatio triggers speech
  offsetRatio:  1.5,   // RMS < noiseFloor * offsetRatio counts as silence
  holdMs:       2500,  // continue sending for this long after silence
  preBufferMax: 8,     // ~340ms of pre-roll at ~43ms/frame
  speaking:     false,
  holdUntil:    0,
  preBuffer:    [],
  heardSpeech:  false, // any onset during the current PTT cycle?
  // Per-engagement counters (for jLog diagnostics).
  framesSeen:   0,
  framesSent:   0,
  peakRms:      0,
};

function vadReset() {
  vad.speaking = false;
  vad.holdUntil = 0;
  vad.preBuffer = [];
  vad.heardSpeech = false;
  vad.framesSeen = 0;
  vad.framesSent = 0;
  vad.peakRms = 0;
  // Don't reset noiseFloor — let it stay adapted across PTT cycles.
}

transport.onMicFrame = ({handle, rms}) => {
  if (!pttActive) {
    return;
  }
  vad.framesSeen++;
  if (rms > vad.peakRms) vad.peakRms = rms;

  const now = Date.now();

  if (!vad.speaking) {
    vad.noiseFloor += vad.noiseAlpha * (rms - vad.noiseFloor);
    vad.preBuffer.push(handle);
    if (vad.preBuffer.length > vad.preBufferMax) vad.preBuffer.shift();

    if (rms > vad.noiseFloor * vad.onsetRatio && rms > 0.005) {
      vad.speaking = true;
      vad.heardSpeech = true;
      vad.holdUntil = now + vad.holdMs;
      for (const h of vad.preBuffer) { transport.sendAudio(h); vad.framesSent++; }
      vad.preBuffer = [];
      voiceBtn.style.boxShadow = '0 0 12px rgba(248,113,113,0.7)';
      jLog('debug', 'vad onset', {rms, noiseFloor: vad.noiseFloor});
    }
    return;
  }

  transport.sendAudio(handle);
  vad.framesSent++;

  if (rms > vad.noiseFloor * vad.offsetRatio) {
    vad.holdUntil = now + vad.holdMs;
  } else if (now > vad.holdUntil) {
    vad.speaking = false;
    voiceBtn.style.boxShadow = '0 0 4px rgba(248,113,113,0.3)';
    jLog('debug', 'vad hold expired', {framesSent: vad.framesSent});
  }
};

// Incoming audio from Grok — play it.
transport.onAudio = handle => transport.playAudio(handle);

// Voice events: status, transcripts, errors.
transport.onVoiceEvent = msg => {
  if (msg.type === 'status') {
    if (msg.status === 'connected') {
      voiceBtn.classList.remove('connecting');
      voiceBtn.classList.add('active');
      voiceStatus.classList.add('on');
      voiceStatusText.textContent = 'connecting to grok...';
    } else if (msg.status === 'ready') {
      voiceStatusText.textContent = 'listening';
    } else {
      voiceStatusText.textContent = msg.status;
    }
  } else if (msg.type === 'user_transcript') {
    addMsg('user', msg.text + ' \u{1F3A4}');
    voiceStatusText.textContent = 'listening';
  } else if (msg.type === 'assistant_transcript') {
    voiceStatusText.textContent = 'speaking';
    if (!startVoice._assistantEl) {
      startVoice._assistantEl = addMsg('jevons', '');
    }
    startVoice._assistantBuf = (startVoice._assistantBuf || '') + msg.text;
    const el = startVoice._assistantEl;
    const timeEl = el.querySelector('.msg-time');
    el.textContent = startVoice._assistantBuf;
    if (timeEl) el.appendChild(timeEl);
    scrollDown();
  } else if (msg.type === 'assistant_transcript_done') {
    if (startVoice._assistantEl && startVoice._assistantBuf) {
      const el = startVoice._assistantEl;
      const timeEl = el.querySelector('.msg-time');
      el.innerHTML = parseAssistantMarkdown(startVoice._assistantBuf);
      if (timeEl) el.appendChild(timeEl);
    }
    startVoice._assistantEl = null;
    startVoice._assistantBuf = '';
  } else if (msg.type === 'worker_note') {
    addWorkerMsg(msg);
  } else if (msg.type === 'transcript_failed') {
    // FSM unstuck from a wedged COMMITTING (xAI silent after commit).
    // Surface a brief inline note so the user knows the turn was lost
    // and they should retry, rather than waiting forever for a
    // response that's never coming.
    addStatusMsg('Sorry — didn\'t catch that. Try again.');
    voiceStatusText.textContent = 'listening';
  } else if (msg.type === 'error') {
    console.error('voice error:', msg.error);
    voiceStatusText.textContent = 'error';
    const d = document.createElement('div');
    d.className = 'msg jevons';
    d.style.color = 'var(--red)';
    d.style.border = '1px solid var(--red)';
    d.style.borderRadius = 'var(--radius)';
    d.style.padding = '10px 16px';
    d.textContent = msg.error;
    msgs.appendChild(d);
    scrollDown();
    stopVoice();
  }
};

// Hot reload + server-restart detection. The /ws/reload socket
// signals dev-time file changes ("reload" message). If the socket
// drops and a reconnect succeeds, the server was restarted —
// reload the page so fresh bundled assets are fetched.
(function hotReload() {
  const delays = [50, 100, 200, 400, 800, 1600, 3200, 5000];
  let attempt = 0;
  let wasOpen = false;
  const open = () => {
    const rh = location.hostname === 'localhost' ? '127.0.0.1:'+location.port : location.host;
    const rws = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+rh+'/ws/reload');
    rws.onopen = () => {
      if (wasOpen) {
        // Server came back after going away — page assets may be stale.
        // 🎯T239: localStorage draft is continuous; also flush seed-stripped.
        try {
          const t = (typeof WisprContext !== 'undefined')
            ? WisprContext.prepareWireText(input.value) : input.value;
          if (typeof persistComposerDraft === 'function') persistComposerDraft(t);
          else sessionStorage.setItem('jevons-input', input.value);
        } catch (_) {
          try { sessionStorage.setItem('jevons-input', input.value); } catch (__) {}
        }
        location.reload();
        return;
      }
      wasOpen = true;
      attempt = 0;
    };
    rws.onmessage = () => {
      try {
        const t = (typeof WisprContext !== 'undefined')
          ? WisprContext.prepareWireText(input.value) : input.value;
        if (typeof persistComposerDraft === 'function') persistComposerDraft(t);
        else sessionStorage.setItem('jevons-input', input.value);
      } catch (_) {
        try { sessionStorage.setItem('jevons-input', input.value); } catch (__) {}
      }
      location.reload();
    };
    rws.onclose = () => {
      const delay = delays[Math.min(attempt, delays.length - 1)];
      attempt++;
      setTimeout(open, delay);
    };
  };
  open();
})();
</script>
</body>
</html>
