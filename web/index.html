<script>
// 🎯T110.1 layout probe — packs grade via window.JevonsProbe.snapshot().
if (typeof LayoutProbe !== 'undefined') LayoutProbe.bind(window);
// 🎯T248: drag-resize RHS sidebar width + fleet/frontier split (localStorage).
// Residual: narrow main (< MIN_MAIN_FOR_DRAG) keeps fixed proportions.
(function wireRhsLayout() {
  if (typeof RhsLayout === 'undefined' || !RhsLayout.bind) return;
  const main = document.getElementById('main');
  const activityPane = document.getElementById('activity-pane');
  const agents = document.getElementById('agents');
  const rhsSplit = document.getElementById('rhs-split');
  const rhsBottom = document.getElementById('rhs-bottom');
  const widthHandle = document.getElementById('rhs-width-handle');
  const splitHandle = document.getElementById('rhs-split-handle');
  if (!main || !activityPane || !agents) return;
  window._rhsLayout = RhsLayout.bind({
    main: main,
    activityPane: activityPane,
    agents: agents,
    rhsSplit: rhsSplit,
    rhsBottom: rhsBottom,
    widthHandle: widthHandle,
    splitHandle: splitHandle,
  });
})();
// 🎯T151: content links open in a new tab (never steal chat session).
(function wireLinkSafety() {
  if (typeof LinkSafety === 'undefined') return;
  // Capture-phase: any user click on an <a href> that still lacks target
  // gets safe attrs before navigation (activity chrome, late-injected HTML).
  document.addEventListener('click', function (e) {
    const t = e.target;
    if (!t || typeof t.closest !== 'function') return;
    const a = t.closest('a[href]');
    if (!a) return;
    // Leave plain product hash-only routes in-app if intentional.
    const href = a.getAttribute('href') || '';
    if (href.charAt(0) === '#' && href.indexOf('://') < 0) return;
    LinkSafety.decorateAnchor(a);
  }, true);
})();
</script>
<script>
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dot = document.getElementById('dot');
const sTxt = document.getElementById('status-text');
const agentsEl = document.getElementById('agents');
const attentionBar = document.getElementById('attention-bar');
const attentionStackEl = document.getElementById('attention-stack');
const attentionActionsEl = document.getElementById('attention-actions');
// 🎯T134: expand overflow chips in-session (not persisted).
let attentionBarExpanded = false;
// 🎯T135: last auto-route match is suggestion-only (never steals wire).
// Stashed until the next user bubble echo so we can attach "Continue in: …".
let lastRouteSuggestion = null;
const MAIN_PLACEHOLDER = 'Write a message to Jevons. Enter to send, Ctrl+Enter to interject, Alt+Enter force-sends draft or next queued, Shift+Enter for a new line. / focuses box when not typing.';

// 🎯T153: force focus back to main composer after pointer chrome actions.
// Prefer ComposerFocus.focusComposer; fall back to #input.focus().
function focusComposer() {
  if (typeof ComposerFocus !== 'undefined' && ComposerFocus.focusComposer) {
    return ComposerFocus.focusComposer(input);
  }
  if (input && typeof input.focus === 'function') {
    input.focus();
    return { didFocus: true, reason: 'focused' };
  }
  return { didFocus: false, reason: 'no-composer' };
}

// 🎯T21 Wispr Flow: live a11y context + optional empty seed (strip before wire).
const wisprContextEl = document.getElementById('wispr-context');
function collectWisprTurns() {
  if (!msgs) return [];
  const nodes = msgs.querySelectorAll('.msg.user, .msg.jevons');
  const out = [];
  for (let i = 0; i < nodes.length; i++) {
    const d = nodes[i];
    const role = d.classList && d.classList.contains('user') ? 'user' : 'assistant';
    const text = d._layoutText != null
      ? d._layoutText
      : (d._body ? d._body.textContent : (d.textContent || ''));
    out.push({ role: role, text: text });
  }
  return out;
}
function refreshWisprContext() {
  if (typeof WisprContext === 'undefined') return;
  const text = WisprContext.buildContextText(collectWisprTurns());
  if (wisprContextEl) wisprContextEl.textContent = text;
  if (input) {
    // Keep describedby contract even if markup is edited later.
    input.setAttribute(
      'aria-describedby',
      WisprContext.describedByIds(WisprContext.STATIC_HINT_ID, WisprContext.LIVE_REGION_ID)
    );
  }
}
function syncComposerSeedClass() {
  if (!input || typeof WisprContext === 'undefined') return;
  const on = WisprContext.needsSeedOnlyClass(input.value);
  input.classList.toggle(
    WisprContext.SEED_ONLY_CLASS || 'composer-seed-only',
    on
  );
}
function ensureWisprSeed() {
  if (typeof WisprContext === 'undefined' || !input) return;
  // Only seed when the live draft is empty of real text (fallback B).
  if (!WisprContext.needsSeed(input.value)) {
    syncComposerSeedClass();
    return;
  }
  const next = WisprContext.applySeedIfEmpty(input.value);
  if (next !== input.value) input.value = next;
  syncComposerSeedClass();
}
function stripWisprSeedFromComposerValue() {
  if (typeof WisprContext === 'undefined' || !input) return;
  const stripped = WisprContext.prepareWireText(input.value);
  if (stripped !== input.value && !WisprContext.isEffectivelyEmpty(input.value)) {
    // Keep visible draft free of seed once the owner has real text.
    input.value = stripped;
  }
  syncComposerSeedClass();
}

// 🎯T120 page-session correlation id for decision logs (audit §3.1).
// Stable for the life of this page load (survives WS reconnect; not regenerated).
const pageCorr = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
  ? crypto.randomUUID()
  : ('c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8));

// 🎯T65 attention threads — prefix-first (docs/design/attention-threads.md).
// Commands: aside: | capture: | park: | main: | pursue:  (case-insensitive)
// Focus chrome is the composer placeholder when on a side thread — no "Focus:" label.
let attentionState = (typeof AttentionThreads !== 'undefined')
  ? AttentionThreads.load(window.localStorage)
  : null;
let mainDraftBackup = '';

function persistAttention() {
  if (!attentionState || typeof AttentionThreads === 'undefined') return;
  AttentionThreads.save(window.localStorage, attentionState);
}

function updateComposerPlaceholder() {
  if (!input) return;
  // 🎯T136: when a purpose=aside is selected in the RHS tree, show aside hint
  // even though top chip focus is retired.
  if (selectedAgent && Array.isArray(lastFleetAgents)) {
    const row = lastFleetAgents.find(function (a) {
      return a && a.name === selectedAgent;
    });
    if (row && String(row.purpose || '').toLowerCase() === 'aside') {
      const title = row.description || row.name || 'aside';
      if (typeof AttentionThreads !== 'undefined' && AttentionThreads.shortTitle) {
        input.placeholder = '[aside: ' + AttentionThreads.shortTitle(title) + '] Write a message to Jevons';
      } else {
        input.placeholder = '[aside: ' + title + '] Write a message to Jevons';
      }
      return;
    }
  }
  if (typeof AttentionThreads === 'undefined' || !attentionState) {
    input.placeholder = MAIN_PLACEHOLDER;
    return;
  }
  // Side model focus (pursue: / residual): "[aside: short-title] …"; main: clean.
  input.placeholder = AttentionThreads.composerPlaceholder(attentionState, MAIN_PLACEHOLDER);
}

// 🎯T136: top attention chip bar is never the home for asides.
// Keep DOM host for layout stability; never add .visible / chip wall.
function renderAttention() {
  if (!attentionBar) return;
  attentionBar.classList.remove('visible');
  attentionBar.classList.remove('attn-expanded');
  attentionBar.hidden = true;
  attentionBarExpanded = false;
  if (attentionStackEl) attentionStackEl.innerHTML = '';
  if (attentionActionsEl) attentionActionsEl.innerHTML = '';
  updateComposerPlaceholder();
}

// 🎯T136: dual-write create-aside into fleet registry (purpose=aside) so RHS
// tree shows 💡 nodes; auto-select + inspect follow agents_changed / refresh.
// 🎯T263: opts.text = owner's opening prompt — server starts/rehydrates and
// delivers in the same request. Deliver failure is loud in the aside inspect
// pane (not silent empty + stopped). opts.expectDeliver forces surface on fail.
function ensureFleetAside(id, title, opts) {
  if (!id) return Promise.resolve(null);
  const o = opts || {};
  const opening = o.text == null ? '' : String(o.text).trim();
  const payload = {
    id: String(id),
    title: String(title || 'aside'),
  };
  if (opening) payload.text = opening;
  // 🎯T270: kind for durable closed-history type (side | capture | target).
  if (o.kind) {
    payload.kind = String(o.kind);
  } else if (typeof AsideHistory !== 'undefined' && AsideHistory.kindFromCommand && o.command) {
    payload.kind = AsideHistory.kindFromCommand(o.command);
  }
  const body = JSON.stringify(payload);
  return fetch('/api/asides', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body,
  }).then(function (r) {
    if (!r.ok) {
      return r.text().then(function (t) {
        let msg = t || ('aside register HTTP ' + r.status);
        try {
          const j = JSON.parse(t);
          if (j && j.error) msg = j.error;
        } catch (_) { /* plain text body */ }
        const err = new Error(msg);
        err.status = r.status;
        throw err;
      });
    }
    return r.json();
  }).then(function (row) {
    // Prefer explicit select of the created id; refreshAgents also auto-picks new asides.
    if (row && row.name) {
      selectedAgent = row.name;
    }
    // 🎯T263: freeform opening delivered — show owner question + working chrome
    // in RHS Transcript while the first turn is in flight.
    if (opening && row && row.deliver) {
      try {
        if (typeof showAsideOpeningWorking === 'function') {
          showAsideOpeningWorking(row.name || id, opening);
        }
      } catch (_) { /* inspect may not be mounted yet */ }
    } else if (opening && row && !row.deliver) {
      // Server accepted create but did not report deliver — treat as fail for freeform.
      const err = new Error('aside created but opening was not delivered');
      err.status = 502;
      throw err;
    }
    refreshAgents();
    return row;
  }).catch(function (err) {
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('warn', DecisionLog.decisionMsg('attention'), {
        decision: opening ? 'aside_create_deliver_error' : 'aside_register_error',
        threadId: id,
        err: err && err.message ? err.message : String(err || 'unknown'),
        corr: pageCorr,
      });
    }
    // 🎯T263: loud fail in aside/UI when start or deliver fails.
    if (opening || (o && o.expectDeliver)) {
      try {
        if (typeof showAsideDeliverError === 'function') {
          showAsideDeliverError(id, err && err.message ? err.message : String(err || 'start/deliver failed'));
        }
      } catch (_) { /* isolated */ }
      if (typeof sTxt !== 'undefined' && sTxt) {
        sTxt.textContent = 'aside start/deliver failed';
      }
    }
    // Still refresh in case agents_changed already fired elsewhere.
    try { refreshAgents(); } catch (_) {}
    // Freeform path: rethrow so callers can see failure (register-only stays soft).
    if (opening || (o && o.expectDeliver)) {
      return Promise.reject(err);
    }
    return null;
  });
}

// 🎯T263: optimistic owner bubble + working indicator in RHS Transcript after
// freeform aside create+deliver (until agent_transcript live frames arrive).
function showAsideOpeningWorking(name, openingText) {
  if (!name) return;
  selectedAgent = name;
  _agentInspectWorking = true;
  const text = String(openingText || '').trim();
  if (text) {
    // Keep wire cache in sync so merge/history reloads still show the question.
    if (!asideWireTurnsCache[name]) asideWireTurnsCache[name] = [];
    const list = asideWireTurnsCache[name];
    if (!list.length || list[list.length - 1].role !== 'user' || list[list.length - 1].text !== text) {
      list.push({ role: 'user', text: text });
    }
    _agentInspectLines = (list || []).map(function (l) {
      return { role: l.role, text: l.text };
    });
  }
  _agentInspectFp = '';
  if (typeof renderAgentInspect === 'function') {
    renderAgentInspect({
      title: name,
      empty: !(_agentInspectLines && _agentInspectLines.length),
      error: '',
      lines: (_agentInspectLines || []).slice(),
      working: true,
    });
  }
  if (typeof setRhsBottomTab === 'function') {
    try { setRhsBottomTab('transcript'); } catch (_) { /* residual */ }
  }
}

// 🎯T263: surface create/start/deliver failure in the aside inspect pane.
function showAsideDeliverError(name, message) {
  if (name) selectedAgent = name;
  _agentInspectWorking = false;
  const msg = String(message || 'aside start/deliver failed');
  _agentInspectFp = '';
  if (typeof renderAgentInspect === 'function') {
    renderAgentInspect({
      title: name || selectedAgent || 'aside',
      empty: true,
      error: msg,
      lines: [],
      working: false,
    });
  }
  if (typeof setRhsBottomTab === 'function') {
    try { setRhsBottomTab('transcript'); } catch (_) { /* residual */ }
  }
}
window.showAsideOpeningWorking = showAsideOpeningWorking;
window.showAsideDeliverError = showAsideDeliverError;

// 🎯T152: reverse of ensureFleetAside — DELETE /api/asides/{id} deregisters the
// dual-written purpose=aside fleet agent so RHS 💡 leaves with target-file close.
// Selection returns to main (selectedAgent=null) when the dismissed id was focused.
function dismissFleetAside(id) {
  if (!id) return Promise.resolve(null);
  const name = String(id);
  return fetch('/api/asides/' + encodeURIComponent(name), {
    method: 'DELETE',
  }).then(function (r) {
    if (!r.ok && r.status !== 404) {
      return r.text().then(function (t) {
        throw new Error(t || ('aside dismiss HTTP ' + r.status));
      });
    }
    // 404 = already gone (idempotent). 200 = deregistered.
    // 🎯T164: never treat "route missing / stale binary" as success without a
    // follow-up refresh; refreshAgents is the owner-visible truth.
    return r.status === 404
      ? { name: name, dismissed: true, missing: true }
      : r.json();
  }).then(function (row) {
    // Optimistic local drop so RHS does not wait on poll for agents_changed.
    if (Array.isArray(lastFleetAgents)) {
      lastFleetAgents = lastFleetAgents.filter(function (a) {
        return !(a && a.name === name);
      });
    }
    if (selectedAgent === name) {
      selectedAgent = null;
      try {
        document.querySelectorAll('.agent-node').forEach(function (n) {
          n.classList.remove('selected');
        });
      } catch (_) {}
      try { if (typeof hideAgentInspect === 'function') hideAgentInspect(); } catch (_) {}
    }
    try { refreshAgents(); } catch (_) {}
    return row;
  }).catch(function (err) {
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('warn', DecisionLog.decisionMsg('attention'), {
        decision: 'aside_dismiss_error',
        threadId: name,
        err: err && err.message ? err.message : String(err || 'unknown'),
        corr: pageCorr,
      });
    }
    // Optimistic local clear so a flaky DELETE still drops RHS selection noise.
    if (selectedAgent === name) {
      selectedAgent = null;
      try {
        document.querySelectorAll('.agent-node').forEach(function (n) {
          n.classList.remove('selected');
        });
      } catch (_) {}
      try { if (typeof hideAgentInspect === 'function') hideAgentInspect(); } catch (_) {}
    }
    try { refreshAgents(); } catch (_) {}
    return null;
  });
}

let turnDetails = null;
let turnItems = null;
let turnCount = 0;

// ── History replay scroll suppress (reload + soft reconnect) ─────────
// WS replays recent turns chronologically; stick-to-bottom per message
// causes a scroll parade. Suppress pin during the burst; one pin after
// history_meta (or idle end). Progressive hydrate still preserves viewport.
let historyReplayActive = false;
let historyReplayIdleTimer = 0;
// Declared early so beginHistoryReplay can cancel a pending pin.
let _scrollRaf = 0;

function beginHistoryReplay() {
  historyReplayActive = true;
  if (_scrollRaf) { cancelAnimationFrame(_scrollRaf); _scrollRaf = 0; }
  armHistoryReplayIdleEnd();
}

function armHistoryReplayIdleEnd() {
  if (!historyReplayActive) return;
  if (historyReplayIdleTimer) clearTimeout(historyReplayIdleTimer);
  const ms = (typeof VirtualList !== 'undefined' && VirtualList.REPLAY_IDLE_END_MS) || 150;
  historyReplayIdleTimer = setTimeout(function () {
    historyReplayIdleTimer = 0;
    endHistoryReplayAndPin('idle');
  }, ms);
}

function endHistoryReplayAndPin(reason) {
  if (!historyReplayActive) return;
  historyReplayActive = false;
  if (historyReplayIdleTimer) { clearTimeout(historyReplayIdleTimer); historyReplayIdleTimer = 0; }
  if (_scrollRaf) { cancelAnimationFrame(_scrollRaf); _scrollRaf = 0; }
  // One pin to live end — no per-message chase.
  enterTrackBottom();
  _pinningScroll = true;
  beginScrollBookkeeping();
  try {
    const top = (typeof VirtualList !== 'undefined' && VirtualList.finalPinScrollTop)
      ? VirtualList.finalPinScrollTop(msgs.scrollHeight, msgs.clientHeight)
      : Math.max(0, msgs.scrollHeight - msgs.clientHeight);
    msgs.scrollTop = top;
    noteScrollMetrics();
  } finally {
    _pinningScroll = false;
    endScrollBookkeeping();
  }
  // 🎯T261: after hard-reload / WS history pin, expand tall messages that
  // remain in the bottom viewport (mid-replay sat at top and must not leave
  // end-of-transcript rows collapsed). Collapse still applies above fold.
  if (latestRaf) { cancelAnimationFrame(latestRaf); latestRaf = 0; }
  refreshLatestExpansion();
  scheduleVirtualize();
  updateJumpFab();
  // 🎯T21: replay finished — refresh Wispr continuation context from history.
  refreshWisprContext();
  if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
    jLog('info', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision('replay_pin', {
      reason: reason || 'end',
      corr: pageCorr,
    }));
  }
}
window.beginHistoryReplay = beginHistoryReplay;
window.endHistoryReplayAndPin = endHistoryReplayAndPin;
Object.defineProperty(window, 'historyReplayActive', {
  configurable: true,
  get() { return historyReplayActive; },
  set(v) { historyReplayActive = !!v; },
});
// 🎯T164 hermetic UI oracles (and debug): bridge global-lexical lets so
// page.evaluate can drive maybeCloseTargetAside / dual-write dismiss.
Object.defineProperty(window, 'attentionState', {
  configurable: true,
  get() { return attentionState; },
  set(v) { attentionState = v; },
});
window.ensureFleetAside = ensureFleetAside;
window.dismissFleetAside = dismissFleetAside;

// 🎯T270: toggle closed-aside history pane (GET /api/asides/history — durable).
function setAsideHistoryOpen(open) {
  const panel = document.getElementById('aside-history-panel');
  const btn = document.getElementById('aside-history-btn');
  if (!panel) return;
  const on = !!open;
  panel.classList.toggle('open', on);
  if (on) {
    panel.removeAttribute('hidden');
  } else {
    panel.setAttribute('hidden', '');
  }
  if (btn) btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  if (on && typeof loadAsideHistory === 'function') {
    loadAsideHistory();
  }
}
function loadAsideHistory() {
  const body = document.getElementById('aside-history-body');
  if (!body) return Promise.resolve();
  const path = (typeof AsideHistory !== 'undefined' && AsideHistory.historyPath)
    ? AsideHistory.historyPath()
    : '/api/asides/history';
  body.innerHTML = '<div class="aside-history-empty">Loading…</div>';
  return fetch(path).then(function (r) {
    if (!r.ok) throw new Error('history HTTP ' + r.status);
    return r.json();
  }).then(function (payload) {
    const rows = (typeof AsideHistory !== 'undefined' && AsideHistory.recordsFromPayload)
      ? AsideHistory.recordsFromPayload(payload)
      : ((payload && payload.asides) || []);
    if (typeof AsideHistory !== 'undefined' && AsideHistory.historyListHtml) {
      body.innerHTML = AsideHistory.historyListHtml(rows);
    } else {
      body.innerHTML = rows.length
        ? ('<ul class="aside-history-list">' + rows.map(function (x) {
          return '<li>' + (x.kind || '') + ' ' + (x.title || x.id || '') + '</li>';
        }).join('') + '</ul>')
        : '<div class="aside-history-empty">No closed asides yet</div>';
    }
  }).catch(function (err) {
    body.innerHTML = '<div class="aside-history-empty">Could not load history' +
      (err && err.message ? (': ' + err.message) : '') + '</div>';
  });
}
window.setAsideHistoryOpen = setAsideHistoryOpen;
window.loadAsideHistory = loadAsideHistory;
(function wireAsideHistoryChrome() {
  const btn = document.getElementById('aside-history-btn');
  const closeBtn = document.getElementById('aside-history-close');
  if (btn) {
    btn.addEventListener('click', function () {
      const panel = document.getElementById('aside-history-panel');
      const open = !(panel && panel.classList.contains('open'));
      setAsideHistoryOpen(open);
    });
  }
  if (closeBtn) {
    closeBtn.addEventListener('click', function () {
      setAsideHistoryOpen(false);
    });
  }
})();
window.maybeCloseTargetAside = maybeCloseTargetAside;
// 🎯T267: smoke/hermetic seam for target-ask PO select + frontier highlight.
window.focusTargetAsk = focusTargetAsk;
window.maybeFocusTargetAsk = maybeFocusTargetAsk;
window.refreshAgents = refreshAgents;

// 🎯T140: client connect spans — join server conn_id + pageCorr + ms.
let chatConnId = null;
let chatConnOpenedAt = 0;
let chatConnFirstFrameAt = 0;
let chatConnHistoryMetaAt = 0;
let chatConnUiReadyLogged = false;
// 🎯T143: soft reconnect — keep DOM, suppress history firehose until meta.
let chatEverReady = false;
let softReconnectActive = false;
// 🎯T138: degraded cockpit (overseer down) — banner + long reconnect backoff.
const degradedBannerEl = document.getElementById('degraded-banner');
function setDegraded(on, reason) {
  if (transport && typeof transport.setDegradedHold === 'function') {
    transport.setDegradedHold(!!on);
  }
  if (!degradedBannerEl) return;
  if (on) {
    degradedBannerEl.textContent = reason
      ? ('Cockpit degraded: ' + reason + ' — history stays; send blocked until overseer is back.')
      : 'Cockpit degraded: overseer is not running.';
    degradedBannerEl.classList.add('visible');
  } else {
    degradedBannerEl.textContent = '';
    degradedBannerEl.classList.remove('visible');
  }
}
function chatConnMs() {
  return chatConnOpenedAt ? Math.round(performance.now() - chatConnOpenedAt) : 0;
}
function logChatConn(decision, extra) {
  if (typeof jLog !== 'function' || typeof DecisionLog === 'undefined' || !DecisionLog.formatConnectDecision) return;
  const o = Object.assign({
    conn_id: chatConnId || undefined,
    ms: chatConnMs(),
    generation: transport && transport.generation,
    corr: pageCorr,
  }, extra || {});
  jLog('info', DecisionLog.decisionMsg('chat_conn'), DecisionLog.formatConnectDecision(decision, o));
}

// Wire transport callbacks.
transport.onOpen = () => {
  const v = input.value;
  chatConnId = null;
  chatConnOpenedAt = performance.now();
  chatConnFirstFrameAt = 0;
  chatConnHistoryMetaAt = 0;
  chatConnUiReadyLogged = false;
  const msgCount = msgs ? msgs.querySelectorAll('.msg').length : 0;
  softReconnectActive = (typeof ChatReconnect !== 'undefined' && ChatReconnect.shouldSoftReconnect)
    ? ChatReconnect.shouldSoftReconnect({ msgCount: msgCount, everReady: chatEverReady })
    : false;

  if (softReconnectActive) {
    // 🎯T143: keep transcript DOM; cancel progressive hydrate thrash only.
    progressiveHistoryRunning = false;
    loadingEarlier = false;
    dot.className = 'dot on';
    sTxt.textContent = 'reconnecting';
    sendBtn.disabled = false;
    input.value = v;
    logChatConn('soft_reconnect', { ms: 0, msgCount: msgCount });
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('info', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision('reconnect', {
        corr: pageCorr,
        conn_id: chatConnId,
        ms: 0,
      }));
    }
    return;
  }

  // Hard reconnect / first paint — wipe and full replay.

function handle(m) {
  const typ = m.type;

  // 🎯T140: server conn hello — attach conn_id before history firehose.
  if (typ === 'conn') {
    chatConnId = m.conn_id || m.connId || null;
    logChatConn(softReconnectActive ? 'soft_reconnect' : 'open', {
      concurrent: m.concurrent,
      ms: chatConnMs(),
      soft: !!softReconnectActive,
    });
    return;
  }

  // 🎯T138: overseer-down / degraded — banner; do not thrash reconnect.
  if (typ === 'error') {
    const errText = m.error || m.message || '';
    if (typeof ChatReconnect !== 'undefined' && ChatReconnect.isOverseerDownError &&
        ChatReconnect.isOverseerDownError(errText)) {
      setDegraded(true, errText);
      logChatConn('degraded', { ms: chatConnMs() });
    }
    // Fall through so existing error UI (if any) still runs.
  }
  // 🎯T204 / T94: cockpit ready — clear degraded banner AND working chrome so
  // plain Enter is send again (not permanent enqueue while workingEl stuck).
  // 🎯T260: bare state=idle must NOT clear chrome mid-owner-turn (tools-only
  // ACP end_turn + note re-prompt still busy). Only recovery / cancel / chrome
  // policy after visible reply settles idle.
  // 🎯T272: status is also a level sample — thinking re-arms; idle still
  // gated by T260 chrome flags (not edge-only kickoff).
  if (typ === 'status') {
    const stText = m.text != null ? String(m.text) : '';
    if (/overseer is back/i.test(stText)) {
      setDegraded(false);
      if (workingEl) setWorking(false);
      if (typeof ownerWorkingChrome !== 'undefined' && ownerWorkingChrome) {
        ownerWorkingChrome.open = false;
      }
    } else if (m.state === 'thinking' || m.state === 'working' || m.state === 'busy') {
      applyWorkingLevelSample({ state: m.state, working: true });
    } else if (m.state === 'idle' && workingEl && !/thinking/i.test(stText)) {
      const chrome = (typeof ownerWorkingChrome !== 'undefined') ? ownerWorkingChrome : null;
      const canIdle = !chrome || !chrome.open || chrome.hadVisible ||
        /cancel|recovered|stuck|settled/i.test(stText);
      if (canIdle) {
        setWorking(false);
        if (chrome) chrome.open = false;
      }
    }
  }

  // 🎯T143: soft reconnect — drop history firehose; keep control frames.
  if (softReconnectActive && typeof ChatReconnect !== 'undefined' &&
      ChatReconnect.shouldSuppressFrame && ChatReconnect.shouldSuppressFrame(true, m)) {
    return;
  }

  // 🎯T140: first non-hello frame (start of history firehose or live).
  if (!chatConnFirstFrameAt && chatConnOpenedAt) {
    chatConnFirstFrameAt = performance.now();
    logChatConn('first_frame', {
      ms: chatConnMs(),
      type: typ || (m.message && m.message.role) || 'unknown',
      soft: !!softReconnectActive,
    });
  }

  // Recent turns were replayed via WS (🎯T57). Remaining durable history is
  // progressively fetched into client memory (🎯T119) — full data resident;
  // infinite scroll is not a data throttle. Optional top sentinel remains
  // while pages are outstanding (does not gate the progressive fetch).
  if (typ === 'history_meta') {
    const wasSoft = softReconnectActive;
    softReconnectActive = false;
    oldestIndex = m.start || 0;
    chatConnHistoryMetaAt = performance.now();
    // End chronological WS replay burst — one pin, then optional progressive hydrate.
    if (!wasSoft) endHistoryReplayAndPin('history_meta');
    else if (historyReplayActive) endHistoryReplayAndPin('history_meta');
    sTxt.textContent = 'connected';
    sendBtn.disabled = false;
    chatEverReady = true;
    logChatConn('history_meta', {
      ms: chatConnMs(),
      frames: m.replay_frames,
      bytes: m.replay_bytes,
      replay_ms: m.replay_ms,
      concurrent: m.concurrent,
      soft: wasSoft,
      working: !!m.working,
    });
    // 🎯T272: level-sample in-flight after hydrate/reconnect — re-arm or stay idle.
    // Must run for both hard and soft reconnect (not edge memory of send).
    applyWorkingLevelSample(m);
    // 🎯T239: re-queue unacked pending against restored chatlog (no dupes).
    if (typeof reconcilePendingSends === 'function') {
      try { reconcilePendingSends(); } catch (_) {}
    }
    // 🎯T228: wire reopened idle — drain offline-enqueued follow-ups.
    if (typeof drainSendQueueIfIdle === 'function') {
      try { drainSendQueueIfIdle(); } catch (_) {}
    }
    // Soft reconnect: DOM already has transcript — skip full progressive re-hydrate.
    // 🎯T209: re-subscribe inspect so sealed history + live resume on this socket.
    if (wasSoft) {
      if (typeof resubscribeAgentInspect === 'function') resubscribeAgentInspect();
      if (!chatConnUiReadyLogged) {
        chatConnUiReadyLogged = true;

      }
      return;
    }
    // 🎯T120.4: progressive hydrate start (corr-linked).
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('info', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision('hydrate_start', {
        oldestIndex: oldestIndex,
        older: m.older || 0,
        corr: pageCorr,
        conn_id: chatConnId,
        ms: chatConnMs(),
      }));
    }
    if ((m.older || 0) > 0) startProgressiveHistoryLoad();
    else {
      if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
        jLog('info', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision('hydrate_done', {
          oldestIndex: 0,
          corr: pageCorr,
          conn_id: chatConnId,
          ms: chatConnMs(),
        }));
      }
      if (!chatConnUiReadyLogged) {
        chatConnUiReadyLogged = true;
        logChatConn('ui_ready', { ms: chatConnMs() });
      }
    }
    // 🎯T209: after main history_meta, re-bind inspect multiplex on this conn.
    if (typeof resubscribeAgentInspect === 'function') resubscribeAgentInspect();
    return;
  }
  // During WS replay burst, keep extending idle-end until frames stop.
  if (historyReplayActive) armHistoryReplayIdleEnd();

  // 🎯T82: registry file changed — refresh RHS fleet immediately (poll is fallback).
  // 🎯T198: also re-merge frontier engagement (target_id overlay).
  if (typ === 'agents_changed') {
    refreshAgents();
    if (typeof loadFrontier === 'function') loadFrontier({ quiet: true });
    return;
  }

  // 🎯T131: bullseye ledger changed — refresh frontier table (poll is fallback).
  if (typ === 'frontier_changed') {
    if (typeof loadFrontier === 'function') loadFrontier({ quiet: true });
    return;
  }

  // 🎯T209: fleet inspect multiplex on /ws/chat (same wire class as main chat).
  // Never paint into #messages — RHS pane only (T124 residual).
  if (typ === 'agent_transcript') {
    handleAgentTranscriptWire(m);
    return;
  }

  // Server rewound the conversation N user turns — trim the view to
  // match: remove the Nth-from-last user message and everything after it.
  // The resent (edited) message then re-arrives as a fresh turn.
  if (typ === 'rewound') {
    const users = [...msgs.querySelectorAll('.msg.user')];
    const n = m.turns || 0;
    if (n > 0 && users.length >= n) {
      closeTurn();
      let node = users[users.length - n];
      while (node) { const next = node.nextSibling; node.remove(); node = next; }
      msgHistory = msgHistory.slice(0, Math.max(0, msgHistory.length - n));
      setEditingHighlight(null);
    }
    return;
  }

  const msgTs = m.timestamp ? new Date(m.timestamp).getTime() : Date.now();

  if (typ==='agent_note') {
    // Injected agent/system notification (worker reply, budget alert). The
    // owner never sees these as chat bubbles — the overseer decides what to
    // relay. Fold into the turn's activity strip only (🎯T63).
    // 🎯T260: note re-prompt often follows tools-only end_turn — keep/re-arm
    // working chrome while the owner turn is still open.
    addTurnItem('agent-note', formatAgentNote(m.text || ''));
    if (ownerWorkingChrome && ownerWorkingChrome.open) {
      if (!workingEl) setWorking(true);
      else if (typeof armWorkingWatch === 'function') armWorkingWatch();
    }
    return;
  }

  if (typ==='user') {
    const content = m.message?.content;
    if (typeof content === 'string') {
      // Server synthesises a user echo on send; Grok ACP may also
      // publish user_message_chunk for the same prompt. Drop the dupe.
      if (content && msgHistory[msgHistory.length - 1]?.text === content) return;
      // 🎯T239: user echo = durable ack of a staged wire send (including asides).
      if (content && typeof ackPendingFromContent === 'function') ackPendingFromContent(content);
      // 🎯T250/T264: aside wire turns never paint on main #messages — sidebar only.
      // Flash-class: gate before any addMsg (self-clear after paint still fails acceptance).
      if (typeof isMainAsideWireUserText === 'function'
          ? isMainAsideWireUserText(content)
          : (typeof AttentionThreads !== 'undefined' &&

        return;

      // Join identity is stream_id (and legacy openStreamEl until terminal).

      closeTurn();
      const uEl = addMsg('user', content, msgTs);
      if (content) msgHistory.push({ text: content, el: uEl });
      // 🎯T135: opt-in "Continue in: «title»" when auto-match suggested a thread.
      // Match is suggestion only — default wire already went to main.
      if (lastRouteSuggestion) {
        attachRouteSwitch(uEl, lastRouteSuggestion);
        lastRouteSuggestion = null;
      }
      startTurn();
    } else if (Array.isArray(content)) {
      content.forEach(c => {
        if (c.type==='tool_result') {

          if (typeof inner === 'string') addTurnItem('tool-result', truncate(inner, 120));

    // 🎯T161: single ordered walk. Non-text (tool_use) marks a segment edge

    // between them. Continuous single-block frames bare-concat (tokens).

    content.forEach(c => {

    // (tools-only empty end_turn keeps "Jevons is working…").

// Skip non-message chrome at the tail of #messages (working indicator,
// follow-scroll end sentinel, turn markers) when locating the latest
// .msg. Not used as the stream-merge key — intervening .msg.status /
// .msg.worker would break coalesce (🎯T159).
function lastMessageish() {
  let el = msgs.lastElementChild;
  while (el && !(el.classList && el.classList.contains('msg'))) {
    el = el.previousElementSibling;
  }
  return el;
}

// 🎯T159 / 🎯T223: open-stream handles. Bubble boundary = terminal
// stop_reason (not user interleave). Join key is stream_id when present;
// legacy openStreamEl for unlabeled frames. Never rediscover via
// lastMessageish — tool chrome and worker notes can insert .msg nodes.
let openStreamEl = null;
// stream_id → open jevons element (🎯T223).
const openStreamById = Object.create(null);
// 🎯T245: stream_id → true once this open stream is pure-silent (drop body).
const openStreamSilentById = Object.create(null);
// 🎯T161: next assistant text after tool_use/tool_result is a new segment
// (structural edge — not content sniffing). Cleared on seal / new bubble.
let streamSegmentEdge = false;

function clearOpenStreamHandle(streamId) {
  if (streamId) {
    const el = openStreamById[streamId];
    delete openStreamById[streamId];
    delete openStreamSilentById[streamId];
    if (openStreamEl === el) openStreamEl = null;
  } else {
    openStreamEl = null;
    for (const k of Object.keys(openStreamById)) delete openStreamById[k];
    for (const k of Object.keys(openStreamSilentById)) delete openStreamSilentById[k];
  }
  streamSegmentEdge = false;
}

// resolveOpenStreamEl finds the single open bubble for a stream (🎯T249).
// Prefer stream_id map; re-home disconnected nodes instead of minting a
// second bubble; adopt unlabeled openStreamEl when wire id arrives mid-turn;
// DOM-scan fallback if handles were lost. Never open a second bubble for
// the same still-open stream_id (owner repro: paragraph-ish multi-bubble
// that later self-healed after coalesce/reconnect).
function resolveOpenStreamEl(streamId) {
  const sid = streamId ? String(streamId) : '';
  function rehome(el) {
    if (!el || typeof el._streamRaw !== 'string') return null;
    if (!el.isConnected && msgs) {
      try { msgs.appendChild(el); } catch (_) { /* ignore */ }
    }
    return el.isConnected ? el : null;
  }
  if (sid && openStreamById[sid]) {
    const el = rehome(openStreamById[sid]);
    if (el) return el;
    delete openStreamById[sid];
  }
  if (openStreamEl && typeof openStreamEl._streamRaw === 'string') {
    const unlabeled = !openStreamEl._streamId;
    const sameId = sid && openStreamEl._streamId === sid;
    if (!sid || unlabeled || sameId) {
      const el = rehome(openStreamEl);
      if (el) {
        if (sid) {
          el._streamId = sid;
          openStreamById[sid] = el;
        }
        return el;
      }
      openStreamEl = null;
    }
  }
  // Handle lost: any still-open .msg.jevons with this stream_id.
  if (sid && msgs) {
    const nodes = msgs.querySelectorAll('.msg.jevons');
    for (let i = 0; i < nodes.length; i++) {
      const el = nodes[i];
      if (el && el._streamId === sid && typeof el._streamRaw === 'string') {
        openStreamById[sid] = el;
        openStreamEl = el;
        return el;
      }
    }
  }
  return null;
}

// appendOrAddJevons merges streaming assistant chunks into the open
// jevons bubble. Merge is keyed on stream_id (🎯T223 / T249) or openStreamEl +
// _streamRaw — not lastMessageish / workingEl. Seal only on terminal stop
// so tool rounds and mid-stream user lines never split one logical reply.
// opts.segmentEdge: known protocol segment boundary → joinAssistantSegments;
// opts.streamId: wire stream_id for join-by-identity.
// otherwise bare appendAssistantStream (intra-segment tokens).
function appendOrAddJevons(text, ts, opts) {
  const segmentEdge = !!(opts && opts.segmentEdge);
  const streamId = opts && opts.streamId ? String(opts.streamId) : '';
  let target = resolveOpenStreamEl(streamId);
  if (target) {
    // 🎯T161: structural segment join vs bare token append — never sniff text.
    target._streamRaw = segmentEdge
      ? ChatEvents.joinAssistantSegments(target._streamRaw, text)
      : ChatEvents.appendAssistantStream(target._streamRaw, text);
    scheduleJevonsRender(target);   // rAF-debounced: coalesce burst chunks into ONE parse (🎯T57)
    return;
  }
  // 🎯T150: open stream flag before first paint so progressive markdown
  // applies from frame 0 (not a marked flash then smd restart).
  const el = addMsg('jevons', text, ts, { streamOpen: true });
  // _streamRaw already set in buildMsg when streamOpen; keep assign for clarity.
  el._streamRaw = typeof el._streamRaw === 'string' ? el._streamRaw : text;
  if (streamId) {
    el._streamId = streamId;
    openStreamById[streamId] = el;
  }
  openStreamEl = el;
  streamSegmentEdge = false;
}

// scheduleJevonsRender coalesces streamed chunks: instead of re-parsing
// the growing markdown on every delta (O(n²) on replay of a turn that
// streamed as many frames), it re-renders at most once per animation
// frame from the accumulated _streamRaw (🎯T57).
function scheduleJevonsRender(el) {
  if (el._renderRaf) return;
  el._renderRaf = requestAnimationFrame(() => {
    el._renderRaf = 0;
    el._layoutText = el._streamRaw;
    el._layoutRole = 'jevons';
    renderBody(el, 'jevons', el._streamRaw);
    // 🎯T164: live stream only — paintBody no longer auto-closes (history-safe).
    if (!historyReplayActive && typeof el._streamRaw === 'string') {
      maybeCloseTargetAside(el._streamRaw);
    }
    // Streaming text is real progress — reset T94 idle stuck clock.
    if (workingEl) armWorkingWatch();
    // T66: stream may start short then measure tall while still latest —
    // re-evaluate auto-expand so the sealed reply is not stuck collapsed.
    scheduleLatestExpansion();
    // Force layout then pin immediately (not only coalesced rAF) so each
    // incremental paint's true scrollHeight is what stick-to-bottom uses.
    if (isTracking()) {
      void (el._body && el._body.offsetHeight);
      scrollDown();
    }
  });
}

// sealAssistantStream closes an open coalesced bubble so the next
// turn starts a new one — flushing any pending debounced render first.
// 🎯T159 / 🎯T223: only terminal stop_reason / system call this — never
// tool_use progress, and never owner user interleave (join by stream_id).
// streamId: seal that labeled stream only; omit to seal the legacy handle
// (and all labeled opens on hard wipe paths).
function sealAssistantStream(streamId) {
  let el = null;
  if (streamId && openStreamById[streamId] &&
      typeof openStreamById[streamId]._streamRaw === 'string') {
    el = openStreamById[streamId];
  } else if (!streamId && openStreamEl && typeof openStreamEl._streamRaw === 'string') {
    el = openStreamEl;
  }
  // Fallback: scan for a still-open stream if the handle was lost (e.g.
  // soft reconnect residual) — still never invent continuity without _streamRaw.
  if (!el && !streamId) {
    const tail = lastMessageish();
    if (tail && tail.classList.contains('jevons') && typeof tail._streamRaw === 'string') {
      el = tail;
    }
  }
  if (el && typeof el._streamRaw === 'string') {
    if (el._renderRaf) { cancelAnimationFrame(el._renderRaf); el._renderRaf = 0; }
    const raw = el._streamRaw;
    delete el._streamRaw;                       // clear first so the sealed
    el._layoutText = raw;                       // render draws mermaid (🎯T59)
    el._layoutRole = 'jevons';
    // 🎯T150: end progressive session before full marked seal paint.
    if (el._smdSession) {
      try { el._smdSession.end(); } catch (_) { /* ignore */ }
    }
    destroyStreamSession(el);
    // Stay expanded through seal so measure/paint never flashes a preview
    // into the live latest bubble (would freeze follow at a mid offset).
    el._expanded = true;
    el._autoExpanded = true;
    renderBody(el, 'jevons', raw);
    // 🎯T164: terminal seal of a live turn — run filed-marker close once more
    // (stream path may have already closed; idempotent when no open file-target).
    if (!historyReplayActive) {
      maybeCloseTargetAside(raw);
      // 🎯T267: seal path focuses target-ask (PO select + frontier highlight).
      // Mid-stream intentionally skipped — thrash residual (loadFrontier + select).
      if (typeof maybeFocusTargetAsk === 'function') maybeFocusTargetAsk(raw);
    }
    unwatchStreamBubble(el);
    scheduleLatestExpansion();

// Shells for older pages are lazy (unmeasured) until near-viewport materialize.
let oldestIndex = 0;
let loadingEarlier = false;
let progressiveHistoryRunning = false;
let historySentinel = null;
let historyObserver = null;
let historyLoadingEl = null;

function startProgressiveHistoryLoad() {
  if (oldestIndex <= 0) { teardownHistorySentinel(); return; }
  // Optional sentinel while pages remain (does not gate progressive fetch).
  setupHistorySentinel();
  progressiveLoadRemainingHistory();
}

function setupHistorySentinel() {
  if (oldestIndex <= 0) { teardownHistorySentinel(); return; }
  if (!historySentinel) {
    historySentinel = document.createElement('div');
    historySentinel.className = 'history-sentinel';
    historySentinel.setAttribute('aria-hidden', 'true');
  }
  if (msgs.firstChild !== historySentinel) msgs.insertBefore(historySentinel, msgs.firstChild);
  if (!historyObserver) {
    historyObserver = new IntersectionObserver((entries) => {
      // Residual: if progressive lag and owner is near top, nudge a page.
      if (entries.some(e => e.isIntersecting)) loadEarlier();
    }, { root: msgs, rootMargin: '400px 0px 0px 0px', threshold: 0 });
    historyObserver.observe(historySentinel);
  }
}

// Back-compat name for hermetic UI tests that still call setupInfiniteScroll.
function setupInfiniteScroll() { startProgressiveHistoryLoad(); }

function teardownHistorySentinel() {
  if (historyObserver) { historyObserver.disconnect(); historyObserver = null; }
  if (historySentinel) { historySentinel.remove(); historySentinel = null; }
}
function teardownInfiniteScroll() { teardownHistorySentinel(); }

// 🎯T259: min gap between progressive /api/history pages so large chatlogs
// cannot peg a core with back-to-back full-file ReadRange (~every rAF).
const HISTORY_PAGE_GAP_MS = 400;
// Sample hydrate_page decision logs (start/done stay Info).
const HISTORY_PAGE_LOG_EVERY = 25;
let hydratePageSeq = 0;

async function progressiveLoadRemainingHistory() {
  if (progressiveHistoryRunning) return;
  progressiveHistoryRunning = true;
  hydratePageSeq = 0;
  try {
    while (oldestIndex > 0) {
      const before = oldestIndex;
      await loadEarlier();
      // Stall guard: if a page did not advance, stop to avoid tight loop.
      if (oldestIndex >= before) break;
      // 🎯T259: yield + rate-limit — rAF alone was ~180ms and still burned CPU.
      await new Promise(function (r) { requestAnimationFrame(r); });
      await new Promise(function (r) { setTimeout(r, HISTORY_PAGE_GAP_MS); });
    }
  } finally {
    progressiveHistoryRunning = false;
    // 🎯T227: progressive hydrate paints user bubbles without msgHistory push.
    // Resync so empty Alt+Enter / history-nav see the full painted transcript.
    if (typeof rebuildMsgHistoryFromDomIfNeeded === 'function') {
      rebuildMsgHistoryFromDomIfNeeded();
    }
    // 🎯T120.4: hydrate finished (or stalled at residual oldestIndex).
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('info', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision(
        oldestIndex <= 0 ? 'hydrate_done' : 'hydrate_error',
        {
          oldestIndex: oldestIndex,
          err: oldestIndex > 0 ? 'stall: oldestIndex did not advance' : undefined,
          corr: pageCorr,
          conn_id: chatConnId,
          ms: typeof chatConnMs === 'function' ? chatConnMs() : undefined,
        }
      ));
    }
    // 🎯T140: connect span complete when hydrate done (or stalled).
    if (!chatConnUiReadyLogged && typeof logChatConn === 'function') {
      chatConnUiReadyLogged = true;
      logChatConn(oldestIndex <= 0 ? 'ui_ready' : 'ui_ready_partial', {
        ms: chatConnMs(),
        oldestIndex: oldestIndex,
      });
    }
  }
}

async function loadEarlier() {
  if (loadingEarlier || oldestIndex <= 0) return;
  loadingEarlier = true;
  showHistoryLoading(true);
  const before = oldestIndex;
  beginScrollBookkeeping();
  try {
    const data = await fetch('/api/history?end=' + before + '&limit=200').then(r => r.json());
    const prevH = msgs.scrollHeight, prevTop = msgs.scrollTop;
    // Lazy shells: full chunk data on the node; no paint until materialize.
    const lines = data.lines || [];
    const { frag, nodes } = renderFrames(lines, { lazy: true });
    const anchor = historySentinel ? historySentinel.nextSibling : msgs.firstChild;
    msgs.insertBefore(frag, anchor);
    layoutMsgList(nodes);   // no-op for unmeasured lazy shells
    oldestIndex = (data.start != null) ? data.start : 0;
    // Content added ABOVE the viewport — shift scrollTop by the height
    // gained so the position doesn't jump. Mode unchanged (not a user leave).
    msgs.scrollTop = prevTop + (msgs.scrollHeight - prevH);
    noteScrollMetrics();
    // Materialize only shells that entered the anticipation band.
    scheduleVirtualize();
    // 🎯T259 / T120.4: sample hydrate_page (not every page at info — large
    // journals were multi-hundred INFO lines and still burned log path).
    hydratePageSeq++;
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      const sample = hydratePageSeq === 1 ||
        hydratePageSeq % HISTORY_PAGE_LOG_EVERY === 0 ||
        oldestIndex <= 0;
      jLog(sample ? 'info' : 'debug', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision('hydrate_page', {
        before: before,
        after: oldestIndex,
        lines: lines.length,
        corr: pageCorr,
      }));
    }
    // 🎯T21: progressive hydrate may reveal older turns used in context window.
    refreshWisprContext();
  } catch (e) {
    console.error('load earlier failed', e);
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('warn', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision('hydrate_error', {
        before: before,
        oldestIndex: oldestIndex,
        err: e && e.message ? e.message : String(e || 'unknown'),
        corr: pageCorr,
      }));
    }
  } finally {
    endScrollBookkeeping();
  }
  showHistoryLoading(false);
  loadingEarlier = false;
  if (oldestIndex <= 0) teardownHistorySentinel();
}

// Out-of-flow loading overlay (anchored to #chat-pane) so it doesn't
// perturb the prepend scroll-position math.
function showHistoryLoading(on) {
  const pane = msgs.parentElement;
  if (on) {
    if (!historyLoadingEl) {
      historyLoadingEl = document.createElement('div');
      historyLoadingEl.className = 'history-loading';
      historyLoadingEl.textContent = 'Loading earlier…';
    }
    if (historyLoadingEl.parentNode !== pane) pane.appendChild(historyLoadingEl);
  } else if (historyLoadingEl && historyLoadingEl.parentNode) {
    historyLoadingEl.remove();
  }
}

// renderFrames builds .msg nodes from raw wire frames into a fragment
// (no #messages insert, no scroll) for prepend. Whole chunks only (🎯T119):
// consecutive assistant text frames coalesce into one bubble via
// VirtualList.coalesceTranscriptFrames. opts.lazy → unmeasured shells.
// Returns { frag, nodes } so the caller can layoutMsgList after attach.
function renderFrames(lines, opts) {
  const lazy = !!(opts && opts.lazy);
  const frag = document.createDocumentFragment();
  const nodes = [];
  // 🎯T250: harvest aside wires for sidebar before main coalesce drops them.
  if (typeof ingestAsideWiresFromHistoryLines === 'function') {
    try { ingestAsideWiresFromHistoryLines(lines); } catch (_) {}
  }
  const chunks = (typeof VirtualList !== 'undefined' && VirtualList.coalesceTranscriptFrames)
    ? VirtualList.coalesceTranscriptFrames(lines)
    : null;
  if (chunks) {
    for (const c of chunks) {
      if (typeof VirtualList !== 'undefined' && VirtualList.isWholeChunk && !VirtualList.isWholeChunk(c)) {
        continue;
      }
      // 🎯T250/T264: never paint aside wire as a main user bubble (history flash).
      if (c.role === 'user' && typeof isMainAsideWireUserText === 'function' &&
          isMainAsideWireUserText(c.text)) {
        continue;
      }
      const el = buildMsg(c.role, c.text, c.timestamp, { lazy: lazy });
      nodes.push(el);
      frag.appendChild(el);
    }
    return { frag, nodes };
  }
  // Fallback if VirtualList missing (should not happen in product).
  let pending = null;
  for (const line of lines) {
    let m;
    try { m = (typeof line === 'string') ? JSON.parse(line) : line; } catch { continue; }
    const ts = m.timestamp ? new Date(m.timestamp).getTime() : Date.now();
    if (m.type === 'user') {
      const c = m.message && m.message.content;
      if (typeof c === 'string' && c) {
        // 🎯T250/T264
        if (typeof isMainAsideWireUserText === 'function' && isMainAsideWireUserText(c)) {
          pending = null;
          continue;
        }
        pending = null;
        const el = buildMsg('user', c, ts, { lazy: lazy });
        nodes.push(el);
        frag.appendChild(el);
      }
    } else if (m.type === 'assistant') {
      let txt = '';
      // 🎯T161: multi-block = segment list; consecutive assistant frames in
      // this fallback are treated as segment edges (sealed history / multi-part).
      try {
        txt = ChatEvents.joinAssistantTexts(
          ChatEvents.assistantTextBlocks(m).map(b => b.text),
        );
      } catch { txt = ''; }
      if (txt) {
        if (pending) {
          pending.raw = ChatEvents.joinAssistantSegments(pending.raw, txt);
          pending.el._layoutText = pending.raw;
          if (!lazy) paintBody(pending.el, 'jevons', pending.raw);
        } else {
          const el = buildMsg('jevons', txt, ts, { lazy: lazy });
          pending = { el, raw: txt };
          nodes.push(el);
          frag.appendChild(el);
        }
      }
    }
  }
  return { frag, nodes };
}

// Render a transient status note (centred, dim italic) — used for
// inline conditions like "didn't catch that" when a turn fails to
// transcribe. Distinct from worker notes (no header, no collapse).
function addStatusMsg(text) {
  const d = document.createElement('div');
  d.className = 'msg status';
  d.textContent = text;
  msgs.appendChild(d);
  scrollDown();
  return d;
}

// Render an out-of-band worker note (system-role entry). Collapsible
// <details> with a header showing the agent name + status + task id.
// Long results are scrollable inside a max-height body. 🎯T23.
function addWorkerMsg(msg) {
  const det = document.createElement('details');
  det.className = 'msg worker';
  const failed = msg.kind === 'task_failed';
  if (failed) det.classList.add('worker-failed');
  // Short notes (one-line) auto-expand; long results stay collapsed.
  const content = String(msg.content || '');
  det.open = content.length < 120;

  const sum = document.createElement('summary');
  const agentEl = document.createElement('span');
  agentEl.className = 'worker-agent';
  agentEl.textContent = msg.agent || 'worker';
  const kindEl = document.createElement('span');
  kindEl.className = 'worker-kind';
  kindEl.textContent = failed ? 'failed' : 'replied';
  const taskEl = document.createElement('span');
  taskEl.className = 'worker-task';
  taskEl.textContent = msg.task_id || '';
  sum.append(agentEl, kindEl, taskEl);
  det.appendChild(sum);

  const body = document.createElement('div');
  body.className = 'worker-body';
  body.textContent = content;
  det.appendChild(body);

  msgs.appendChild(det);
  scrollDown();
  return det;
}

// Agent tree
let lastFleetAgents = []; // for 🎯T124 auto-select on new aside
// Declared early: updateComposerPlaceholder / renderAttention / refreshAgents
// touch this before the terminal block further down. A late `let` left it in
// the TDZ, threw on boot (T136 path), skipped applyTheme + connect → dark
// FOUC stuck + empty transcript.
let selectedAgent = null;
// 🎯T252: ordered queue of asides needing owner attention (user's turn).
// Auto-select when sidebar draft empty; sticky while non-empty draft.
let asideAttentionQueue = [];
// 🎯T267: Frontier row highlight for the active target-ask (🎯 id, normalized).
let frontierHighlightId = null;

/**
 * 🎯T252: is the sidebar composer draft empty?
 * Prefer live #agent-inspect-input; else per-agent draft map for current selection.
 * Empty/whitespace ⇒ allow auto-activate. Non-empty ⇒ sticky (no mid-compose steal).
 */
function isSidebarComposerDraftEmpty() {
  const emptyFn = (typeof AgentTranscript !== 'undefined')
    ? (AgentTranscript.sidebarDraftIsEmpty || AgentTranscript.isSidebarDraftEmpty)
    : null;
  const isEmpty = function (v) {
    return emptyFn ? emptyFn(v) : !String(v == null ? '' : v).trim();
  };
  const el = document.getElementById('agent-inspect-input');
  if (el && typeof el.value === 'string') {
    // Live field is source of truth while mounted (even if bound to another agent).
    if (el.dataset && el.dataset.boundAgent && selectedAgent &&
        el.dataset.boundAgent === selectedAgent) {
      return isEmpty(el.value);
    }
    if (el.dataset && el.dataset.boundAgent && selectedAgent &&
        el.dataset.boundAgent !== selectedAgent) {
      // Switching mid-flight: check the draft of the *current* selection in the map.
      if (typeof sidebarDraftByAgent !== 'undefined' && sidebarDraftByAgent &&
          Object.prototype.hasOwnProperty.call(sidebarDraftByAgent, selectedAgent)) {
        return isEmpty(sidebarDraftByAgent[selectedAgent]);
      }
      // No saved draft for current selection — live field belongs to another agent.
      return true;
    }
    return isEmpty(el.value);
  }
  if (selectedAgent && typeof sidebarDraftByAgent !== 'undefined' && sidebarDraftByAgent &&
      Object.prototype.hasOwnProperty.call(sidebarDraftByAgent, selectedAgent)) {
    return isEmpty(sidebarDraftByAgent[selectedAgent]);
  }
  return true;
}

/**
 * 🎯T252: apply attention auto-select when draft allows.
 * reason: new-attention | after-send | draft-cleared | poll
 * Returns true when selection changed.
 */
function maybeAutoActivateAttention(reason, newName) {
  if (typeof AgentTranscript === 'undefined' || !AgentTranscript.pickAttentionAsideSelection) {
    return false;
  }
  const draftEmpty = isSidebarComposerDraftEmpty();
  const next = AgentTranscript.pickAttentionAsideSelection({
    attentionNames: asideAttentionQueue,
    currentSelection: selectedAgent,
    draftEmpty: draftEmpty,
    reason: reason || 'poll',
    newName: newName || undefined,
  });
  if (!next || next === selectedAgent) return false;
  if (typeof selectAgent === 'function') {
    selectAgent(next);
  } else {
    selectedAgent = next;
  }
  return true;
}

/**
 * 🎯T252: mark aside as needing owner; auto-select if draft empty.
 * Call when assistant turn ends on an aside (live terminal or busy→idle).
 */
function markAsideNeedsAttention(name) {
  if (!name || typeof AgentTranscript === 'undefined') return;
  if (!AgentTranscript.enqueueAttention) return;
  const row = (lastFleetAgents || []).find(function (a) { return a && a.name === name; });
  if (row && AgentTranscript.isAsideAgent && !AgentTranscript.isAsideAgent(row)) return;
  if (row && AgentTranscript.isOverseer && AgentTranscript.isOverseer(row.name, row.purpose)) return;
  asideAttentionQueue = AgentTranscript.enqueueAttention(asideAttentionQueue, name);
  maybeAutoActivateAttention('new-attention', name);
}

/**
 * 🎯T252: after successful sidebar send — dequeue served aside, pick next attention.
 * Draft is already cleared by sendSidebarComposer before this runs.
 */
function onSidebarComposerSent(name) {
  const served = name || selectedAgent;
  if (typeof AgentTranscript !== 'undefined' && AgentTranscript.dequeueAttention) {
    asideAttentionQueue = AgentTranscript.dequeueAttention(asideAttentionQueue, served);
  }
  maybeAutoActivateAttention('after-send');
}

// 🎯T250: main-chat aside wire user turns (attention/target-aside markers)
// are recorded here for the RHS Transcript tab — never painted on #messages.
// Keyed by aside/agent id → [{ role:'user', text }].
let asideWireTurnsCache = Object.create(null);

// 🎯T264: never-paint gate for main #messages (live echo + history + flash).
// Local prefix fallback so a missing AttentionThreads module cannot flash raw
// [attention:]/[target-aside:] headers as owner bubbles (self-clear is still fail).
function isMainAsideWireUserText(text) {
  if (typeof AttentionThreads !== 'undefined') {
    if (typeof AttentionThreads.shouldPaintMainUserText === 'function') {
      return !AttentionThreads.shouldPaintMainUserText(text);
    }
    if (typeof AttentionThreads.isAsideWireUserText === 'function') {
      return !!AttentionThreads.isAsideWireUserText(text);
    }
    if (typeof AttentionThreads.looksLikeAsideWireMarker === 'function') {
      return !!AttentionThreads.looksLikeAsideWireMarker(text);
    }
  }
  const t = String(text == null ? '' : text).replace(/^\s*(?:\[image:\s*[^\]]*\]\s*)+/i, '');
  if (/^\s*\[attention\s*:/i.test(t)) return true;
  if (/^\s*\[target-aside\s*:/i.test(t)) return true;
  return false;
}

function noteAsideWireFromMain(content) {
  if (typeof AttentionThreads === 'undefined' ||
      typeof AttentionThreads.recordAsideWireUserTurn !== 'function') {
    return;
  }
  if (!asideWireTurnsCache || typeof asideWireTurnsCache !== 'object') {
    asideWireTurnsCache = Object.create(null);
  }
  const r = AttentionThreads.recordAsideWireUserTurn(asideWireTurnsCache, content);
  if (!r || !r.parsed || !r.parsed.id) return;
  // Live refresh when this aside is the inspect selection.
  if (selectedAgent && selectedAgent === r.parsed.id && r.added) {
    refreshAgentInspectAsideWireMerge();
  }
}

function asideWireLinesFor(name) {
  if (!name || !asideWireTurnsCache) return [];
  const list = asideWireTurnsCache[name];
  return Array.isArray(list) ? list.slice() : [];
}

// Merge main-wire aside turns into the current inspect model (process empty OK).
// 🎯T265: preserve working (and other microcosm fields) — must not drop in-flight chrome.
function mergeModelWithAsideWire(model, name) {
  const wire = asideWireLinesFor(name || selectedAgent);
  if (!wire.length || typeof AttentionThreads === 'undefined' ||
      typeof AttentionThreads.mergeInspectLinesWithAsideWire !== 'function') {
    return model;
  }
  const lines = AttentionThreads.mergeInspectLinesWithAsideWire(model.lines || [], wire);
  if (typeof AgentTranscript !== 'undefined' && AgentTranscript.mergePaneModelWithLines) {
    return AgentTranscript.mergePaneModelWithLines(model, lines);
  }
  return {
    title: model.title,
    empty: lines.length === 0,
    error: model.error || '',
    lines: lines,
    sessionId: model.sessionId || '',
    working: !!(model && model.working),
  };
}

function refreshAgentInspectAsideWireMerge() {
  if (!selectedAgent || !agentInspectBody) return;
  const wire = asideWireLinesFor(selectedAgent);
  if (!wire.length) return;
  // Prefer re-merge of current inspect lines + wire.
  const cur = (_agentInspectLines || []).map(function (l) {
    return { role: l.role, text: l.text };
  });
  const merged = (typeof AttentionThreads !== 'undefined' &&
      AttentionThreads.mergeInspectLinesWithAsideWire)
    ? AttentionThreads.mergeInspectLinesWithAsideWire(cur, wire)
    : wire.concat(cur);
  _agentInspectLines = merged;
  // Force re-paint (fingerprint will change when wire added).
  _agentInspectFp = '';
  renderAgentInspect({
    title: selectedAgent,
    empty: merged.length === 0,
    error: '',
    lines: merged,
  });
}

function ingestAsideWiresFromHistoryLines(lines) {
  if (typeof AttentionThreads === 'undefined' ||
      typeof AttentionThreads.extractAsideWireTurnsFromFrames !== 'function') {
    return;
  }
  const extracted = AttentionThreads.extractAsideWireTurnsFromFrames(lines || []);
  const ids = Object.keys(extracted);
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    const turns = extracted[id] || [];
    for (let j = 0; j < turns.length; j++) {
      const t = turns[j];
      if (!t || t.role !== 'user') continue;
      // Rebuild wire-shaped text is unnecessary — store display lines directly.
      if (!asideWireTurnsCache[id]) asideWireTurnsCache[id] = [];
      const list = asideWireTurnsCache[id];
      const text = t.text == null ? '' : String(t.text);
      if (list.length && list[list.length - 1].role === 'user' &&
          list[list.length - 1].text === text) {
        continue;
      }
      list.push({ role: 'user', text: text });
    }
  }
}
function refreshAgents() {
  // 🎯T200: portfolios woven into fleet tree under overseer (not a separate panel).
  Promise.all([
    fetch('/api/agents').then(r => r.json()),
    fetch('/api/portfolios').then(r => r.ok ? r.json() : { portfolios: [] }).catch(function () { return { portfolios: [] }; }),
  ]).then(function (pair) {
    const agents = Array.isArray(pair[0]) ? pair[0] : [];
    const portfolioPayload = pair[1];
    agentsEl.innerHTML = '';
    // Display-only weave: virtual portfolio parents under overseer; lineage_parent kept.
    let byParent = {};
    let treeNodes = agents;
    if (typeof PortfolioGroup !== 'undefined' && PortfolioGroup.weaveFleetTree) {
      const woven = PortfolioGroup.weaveFleetTree(agents, portfolioPayload);
      treeNodes = woven.nodes || agents;
      byParent = woven.byParent || {};
    } else {
      agents.forEach(a => {
        const p = (a && a.parent) || '';
        (byParent[p] = byParent[p] || []).push(a);
      });
    }
    const agentsByName = {};
    treeNodes.forEach(a => {
      if (a && a.name) agentsByName[a.name] = a;
    });
    // 🎯T124: new purpose=aside → auto-select and show transcript pane.
    // Use registry agents (not virtual portfolio nodes) for auto-select.
    // 🎯T252: attention queue may override when draft empty (sticky when not).
    let autoSelected = false;
    let wantSelect = null;
    const prevSelected = selectedAgent;
    if (typeof AgentTranscript !== 'undefined') {
      const auto = AgentTranscript.pickAutoSelect(lastFleetAgents, agents, selectedAgent);
      if (auto && auto !== selectedAgent) {
        wantSelect = auto;
        autoSelected = true;
      }
      // 🎯T252: busy→idle / needs_owner asides → attention queue; auto if draft empty.
      const prevFleet = lastFleetAgents;
      if (AgentTranscript.detectNewAttentionAsides) {
        const news = AgentTranscript.detectNewAttentionAsides(prevFleet, agents);
        news.forEach(function (n) {
          asideAttentionQueue = AgentTranscript.enqueueAttention(asideAttentionQueue, n);
        });
        if (AgentTranscript.pruneAttentionQueue) {
          asideAttentionQueue = AgentTranscript.pruneAttentionQueue(asideAttentionQueue, agents);
        }
        const attReason = news.length ? 'new-attention' : 'poll';
        const attNew = news.length ? news[news.length - 1] : undefined;
        const nextAtt = AgentTranscript.pickAttentionAsideSelection({
          attentionNames: asideAttentionQueue,
          currentSelection: wantSelect || selectedAgent,
          draftEmpty: isSidebarComposerDraftEmpty(),
          reason: attReason,
          newName: attNew,
        });
        if (nextAtt && nextAtt !== (wantSelect || selectedAgent)) {
          wantSelect = nextAtt;
          autoSelected = true;
        } else if (nextAtt && nextAtt !== selectedAgent && !wantSelect) {
          wantSelect = nextAtt;
          autoSelected = true;
        }
      }
    }
    lastFleetAgents = agents.slice();
    renderTree(byParent, '', agentsEl, agentsByName);
    // 🎯T89 thin: multi-agent rollup in structured chrome (not chat flood).
    updateFleetProgress(agents);
    // 🎯T209: inspect updates arrive on /ws/chat — no HTTP re-fetch on fleet refresh.
    // Apply auto-select via selectAgent so draft stash + Transcript tab + composer sync.
    if (autoSelected && wantSelect && wantSelect !== prevSelected &&
        typeof selectAgent === 'function') {
      selectAgent(wantSelect);
    } else if (autoSelected && selectedAgent && typeof subscribeAgentInspect === 'function') {
      subscribeAgentInspect(selectedAgent);
    }
  }).catch((err)=>{
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('warn', DecisionLog.decisionMsg('fleet'), DecisionLog.formatFleetDecision('refresh_error', {
        err: err && err.message ? err.message : String(err || 'unknown'),
        corr: pageCorr,
      }));
    }
  });
}
function updateFleetProgress(agents) {
  if (!Array.isArray(agents)) return;
  const running = agents.filter(a => a.status === 'running').length;
  const stopped = agents.length - running;
  // Surface on working indicator when a multi-agent job is mid-turn.
  // 🎯T202: replace a single fleet rollup segment — never append thrash.
  if (workingEl && agents.length > 1) {
    const WP = typeof WorkingProgress !== 'undefined' ? WorkingProgress : null;
    const next = WP
      ? WP.mergeFleetProgress(workingProgress, running, stopped)
      : ('fleet ' + running + ' running · ' + stopped + ' stopped');
    updateWorkingProgress(next);
  }
}
function renderTree(byParent, parent, container, agentsByName) {
  // 🎯T68: sibling order is deliberate — name-sorted under each parent,
  // independent of Go map iteration or poll order of the parent group.
  // 🎯T200: portfolio virtual nodes sort with agents; folder lead not status dot.
  agentsByName = agentsByName || {};
  const children = (byParent[parent] || []).slice().sort((a, b) =>
    String(a.name || '').localeCompare(String(b.name || '')));
  children.forEach(a => {
    const isPortfolio = (typeof PortfolioGroup !== 'undefined' && PortfolioGroup.isPortfolioNode)
