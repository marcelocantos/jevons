    // Soft reconnect: DOM already has transcript — skip full progressive re-hydrate.
    // 🎯T279: user-echo frames were suppressed during soft; re-paint any
    // unacked main-paintable pending still missing from the transcript.
    if (wasSoft) {
      if (typeof retainPendingOwnerTurnsVisible === 'function') {
        try { retainPendingOwnerTurnsVisible(); } catch (_) {}
      }
      // 🎯T209: re-subscribe inspect so sealed history + live resume on this socket.
      if (typeof resubscribeAgentInspect === 'function') resubscribeAgentInspect();
      if (!chatConnUiReadyLogged) {
        chatConnUiReadyLogged = true;
        logChatConn('ui_ready', { ms: chatConnMs(), soft: true });
      }
      return;
    }
    // 🎯T120.4: progressive hydrate start (corr-linked).
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('info', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision('hydrate_start', {
        oldestIndex: oldestIndex,
        older: m.older || 0,
        corr: pageCorr,
        conn_id: chatConnId,
        ms: chatConnMs(),
      }));
    }
    // 🎯T300: a fresh connect (or reconnect replay) is machinery, never an
    // owner request — clear any chrome state so hydrate pages stay silent.
    historyLoadingEvent({ type: 'reset', older: m.older || 0 });
    if ((m.older || 0) > 0) startProgressiveHistoryLoad();
    else {
      if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
        jLog('info', DecisionLog.decisionMsg('history'), DecisionLog.formatHistoryDecision('hydrate_done', {
          oldestIndex: 0,
          corr: pageCorr,
          conn_id: chatConnId,
          ms: chatConnMs(),
        }));
      }
      if (!chatConnUiReadyLogged) {
        chatConnUiReadyLogged = true;
        logChatConn('ui_ready', { ms: chatConnMs() });
      }
    }
    // 🎯T209: after main history_meta, re-bind inspect multiplex on this conn.
    if (typeof resubscribeAgentInspect === 'function') resubscribeAgentInspect();
    return;
  }
  // 🎯T347: pre-history_meta frames must never pin per message. If the idle
  // fallback ended suppression mid-burst (a network gap, one heavy frame),
  // re-enter replay before this frame is processed — otherwise every frame
  // from here stick-to-bottom pins: the upward scroll parade.
  if (!historyReplayActive && _awaitingHistoryMeta &&
      typeof VirtualList !== 'undefined' && VirtualList.shouldReenterReplay &&
      VirtualList.shouldReenterReplay({
        awaitingHistoryMeta: _awaitingHistoryMeta,
        historyReplayActive: historyReplayActive,
        msSinceConnect: chatConnOpenedAt ? (performance.now() - chatConnOpenedAt) : 0,
      })) {
    beginHistoryReplay();
  }
  // During WS replay burst, keep extending idle-end until frames stop.
  if (historyReplayActive) armHistoryReplayIdleEnd();

  // 🎯T82: registry file changed — refresh RHS fleet immediately (poll is fallback).
  // 🎯T198: also re-merge frontier engagement (target_id overlay).
  // 🎯T289: coalesced — a busy fleet pushes agents_changed per progress
  // change, and answering each with a fetch+repaint was the main stutter.
  if (typ === 'agents_changed') {
    if (typeof scheduleRefreshAgents === 'function') scheduleRefreshAgents();
    else refreshAgents();
    if (typeof scheduleLoadFrontier === 'function') scheduleLoadFrontier();
    else if (typeof loadFrontier === 'function') loadFrontier({ quiet: true });
    return;
  }

  // 🎯T131: bullseye ledger changed — refresh frontier table (poll is fallback).
  if (typ === 'frontier_changed') {
    if (typeof loadFrontier === 'function') loadFrontier({ quiet: true });
    return;
  }

  // 🎯T209: fleet inspect multiplex on /ws/chat (same wire class as main chat).
  // Never paint into #messages — RHS pane only (T124 residual).
  if (typ === 'agent_transcript') {
    handleAgentTranscriptWire(m);
    return;
  }

  // Server rewound the conversation N user turns — trim the view to
  // match: remove the Nth-from-last user message and everything after it.
  // The resent (edited) message then re-arrives as a fresh turn.
  if (typ === 'rewound') {
    const userIdx = [];
    for (let i = 0; i < transcriptRows.length; i++) {
      if (transcriptRows[i] && transcriptRows[i].role === 'user') userIdx.push(i);
    }
    const n = m.turns || 0;
    if (n > 0 && userIdx.length >= n) {
      closeTurn();
      truncateTranscriptFrom(userIdx[userIdx.length - n]);
      msgHistory = msgHistory.slice(0, Math.max(0, msgHistory.length - n));
      setEditingHighlight(null);
    }
    return;
  }

  const msgTs = m.timestamp ? new Date(m.timestamp).getTime() : Date.now();

  if (typ==='agent_note') {
    // Injected agent/system notification (worker reply, budget alert). The
    // owner never sees these as chat bubbles — the overseer decides what to
    // relay. Fold into the turn's activity strip only (🎯T63).
    // 🎯T260: note re-prompt often follows tools-only end_turn — keep/re-arm
    // working chrome while the owner turn is still open.
    addTurnItem('agent-note', formatAgentNote(m.text || ''));
    if (ownerWorkingChrome && ownerWorkingChrome.open) {
      if (!workingEl) setWorking(true);
      else if (typeof armWorkingWatch === 'function') armWorkingWatch();
    }
    return;
  }

  if (typ==='user') {
    const rawContent = m.message?.content;
    // 🎯T384: owner turns now arrive as typed blocks — the same shape every
    // assistant turn has always used — while journals written before the fix
    // still carry a bare string. Read both. The tool_result walk below still
    // owns structured content that carries no owner prose, so a block list of
    // pure tool_result falls through to it exactly as it used to.
    const content = (typeof ChatEvents !== 'undefined' && ChatEvents.userContentText)
      ? ChatEvents.userContentText(m)
      : (typeof rawContent === 'string' ? rawContent : '');
    if (content || typeof rawContent === 'string') {
      // Server synthesises a user echo on send; Grok ACP may also
      // publish user_message_chunk for the same prompt. Drop the dupe
      // (including 🎯T279 optimistic main paint before echo).
      const lastHist = msgHistory[msgHistory.length - 1]?.text;
      const isDupe = (typeof ChatEvents !== 'undefined' && ChatEvents.isDuplicateUserEcho)
        ? ChatEvents.isDuplicateUserEcho(lastHist, content)
        : (content && lastHist === content);
      if (content && isDupe) {
        // 🎯T239: still ack pending — optimistic bubble already painted.
        if (typeof ackPendingFromContent === 'function') ackPendingFromContent(content);
        return;
      }
      // 🎯T239: user echo = durable ack of a staged wire send (including asides).
      if (content && typeof ackPendingFromContent === 'function') ackPendingFromContent(content);
      // 🎯T250/T264: aside wire turns never paint on main #messages — sidebar only.
      // Flash-class: gate before any addMsg (self-clear after paint still fails acceptance).
      if (typeof isMainAsideWireUserText === 'function'
          ? isMainAsideWireUserText(content)
          : (typeof AttentionThreads !== 'undefined' &&
              AttentionThreads.shouldPaintMainUserText &&
              !AttentionThreads.shouldPaintMainUserText(content))) {
        noteAsideWireFromMain(content);
        // 🎯T327: server echo of aside wire — main must not bind mid-turn chrome.
        if (workingEl) setWorking(false, undefined, { skipDrain: true });
        if (ownerWorkingChrome) ownerWorkingChrome.open = false;
        mainWorkingSuppressed = true; // re-assert after setWorking(false) clear
        // Still settle activity chrome as a user boundary (no main bubble).
        closeTurn();
        return;
      }
      // 🎯T223: do NOT seal open assistant streams on user interleave.
      // Join identity is stream_id (widget open handle until terminal).
      // Premature seal was the journal/hydrate split of one answer into two.
      closeTurn();
      // 🎯T381: carry the wire's provenance into the bubble so paintBody can
      // tell an agent's report from the owner's own words.
      const turnOrigin = (typeof ChatEvents !== 'undefined' && ChatEvents.turnOriginOf)
        ? ChatEvents.turnOriginOf(m) : 'owner';
      const uEl = addMsg('user', content, msgTs, { turnOrigin: turnOrigin });
      // Recall (up-arrow) is the owner's OWN outbox — an agent report is not
      // something he typed, so it never enters the recall ring.
      if (content && turnOrigin !== 'agent') msgHistory.push({ text: content, el: uEl });
      // 🎯T135: opt-in "Continue in: «title»" when auto-match suggested a thread.
      // Match is suggestion only — default wire already went to main.
      if (lastRouteSuggestion) {
        attachRouteSwitch(uEl, lastRouteSuggestion);
        lastRouteSuggestion = null;
      }
      startTurn();
    } else if (Array.isArray(rawContent)) {
      rawContent.forEach(c => {
        if (c.type==='tool_result') {
          const inner = c.content;
          if (typeof inner === 'string') addTurnItem('tool-result', truncate(inner, 120));
          else if (Array.isArray(inner)) inner.forEach(ic => {
            if (ic.type==='text' && ic.text) addTurnItem('tool-result', truncate(ic.text, 120));
          });
        }
      });
    }
  } else if (typ==='assistant') {
    const content = m.message?.content;
    if (!Array.isArray(content)) return;
    // 🎯T161: single ordered walk. Non-text (tool_use) marks a segment edge
    // for the *following* text only; multi-block text parts are segment edges
    // between them. Continuous single-block frames bare-concat (tokens).
    // 🎯T223: stream_id joins fragments into one bubble across interleave.
    const streamId = (typeof ChatEvents !== 'undefined' && ChatEvents.streamIdOf)
      ? ChatEvents.streamIdOf(m)
      : (m.stream_id || m.streamId || '');
    let emittedText = false;
    const anyText = ChatEvents.hasAssistantText(m);
    if (anyText) closeTurn();
    // 🎯T245: client defense — never paint pure [silent] body even if a
    // fragment slipped past server suppress (or history carried raw body).
    content.forEach(c => {
      if (c.type==='tool_use') {
        streamSegmentEdge = true;
        addTurnItem('tool-use', c.name + (c.input ? ': ' + ToolSummary.summariseInput(c.input) : ''));
        // 🎯T260: tool activity is mid-turn signal — re-arm chrome if open.
        if (ownerWorkingChrome) {
          ownerWorkingChrome.hadTool = true;
          if (ownerWorkingChrome.open && !workingEl && !historyReplayActive) {
            setWorking(true);
          } else if (workingEl && typeof armWorkingWatch === 'function') {
            armWorkingWatch();
          }
        }
      } else if (c.type==='text' && c.text) {
        const alreadySilent = !!(streamId && openStreamSilentById[streamId]);
        const thisSilent = typeof ChatEvents !== 'undefined' && ChatEvents.isSilentAssistantText
          && ChatEvents.isSilentAssistantText(c.text);
        if (alreadySilent || thisSilent) {
          if (streamId) openStreamSilentById[streamId] = true;
          if (ownerWorkingChrome) ownerWorkingChrome.silent = true;
          // Pure silent: no owner bubble (still process terminal below).
          return;
        }
        const edge = streamSegmentEdge || emittedText;
        appendOrAddJevons(c.text, msgTs, { segmentEdge: edge, streamId: streamId });
        streamSegmentEdge = false;
        emittedText = true;
        if (ownerWorkingChrome) {
          ownerWorkingChrome.hadVisible = true;
          if (ownerWorkingChrome.open && !workingEl && !historyReplayActive) {
            setWorking(true);
          }
        }
      }
    });
    if (emittedText) focusComposer();
    // Seal on terminal stop; clear working chrome only per T260 policy
    // (tools-only empty end_turn keeps "Jevons is working…").
    if (ChatEvents.shouldClearWorking(m)) {
      sealAssistantStream(streamId);
      const chrome = ownerWorkingChrome || { hadVisible: false, hadTool: false, silent: false };
      if (streamId && openStreamSilentById[streamId]) chrome.silent = true;
      const clearChrome = (typeof ChatEvents.shouldClearWorkingChrome === 'function')
        ? ChatEvents.shouldClearWorkingChrome(chrome, m)
        : true;
      if (clearChrome) {
        setWorking(false);
        if (ownerWorkingChrome) ownerWorkingChrome.open = false;
      }
    }
  } else if (typ==='tool_result' || typ==='result') {
    // 🎯T161: tool result is a protocol segment boundary for next text.
    streamSegmentEdge = true;
    const content = m.content || m.message?.content;
    if (Array.isArray(content)) {
      content.forEach(c => {
        if (c.type==='text' && c.text) addTurnItem('tool-result', truncate(c.text, 120));
      });
    } else if (typeof content === 'string') {
      addTurnItem('tool-result', truncate(content, 120));
    }
  } else if (typ==='system') {
    closeTurn();
    if (ChatEvents.shouldClearWorking(m)) {
      sealAssistantStream();
      setWorking(false);
      if (ownerWorkingChrome) ownerWorkingChrome.open = false;
    }
  }
}

// Skip non-message chrome at the tail of #messages (working indicator,
// follow-scroll end sentinel, turn markers) when locating the latest
// .msg. Not used as the stream-merge key — intervening .msg.status /
// .msg.worker would break coalesce (🎯T159).
function lastMessageish() {
  for (let i = transcriptRows.length - 1; i >= 0; i--) {
    const row = transcriptRows[i];
    if (row && row.role !== 'turn-marker' && (row.el || row.role === 'user' || row.role === 'jevons'
        || row.role === 'worker' || row.role === 'status')) {
      if (row.el && row.el.isConnected) return row.el;
      return attachTranscriptRow(i, { lazy: false });
    }
  }
  let el = msgsCanvas ? msgsCanvas.lastElementChild : msgs.lastElementChild;
  while (el && !(el.classList && el.classList.contains('msg'))) {
    el = el.previousElementSibling;
  }
  return el;
}

// 🎯T372: grow-one-bubble lives in ConversationWidget. These names stay as
// call-site delegates so handleChat / wipe / tests keep a stable entry.
// Join identity (open handle, stream_id map, _streamRaw merge) is NOT here.
// 🎯T245: stream_id → true once this open stream is pure-silent (drop body).
const openStreamSilentById = Object.create(null);
// 🎯T161: next assistant text after tool_use/tool_result is a new segment
// (structural edge — not content sniffing). Cleared on seal / new bubble.
let streamSegmentEdge = false;

function clearOpenStreamHandle(streamId) {
  if (streamId) delete openStreamSilentById[streamId];
  else {
    for (const k of Object.keys(openStreamSilentById)) delete openStreamSilentById[k];
  }
  streamSegmentEdge = false;
  if (mainConversation && typeof mainConversation.clearStreamHandles === 'function') {
    mainConversation.clearStreamHandles(streamId);
  }
}

// 🎯T372 / T159 / T223 / T249: widget owns the open-stream handle.
function appendOrAddJevons(text, ts, opts) {
  if (!mainConversation || typeof mainConversation.appendAssistant !== 'function') return;
  return mainConversation.appendAssistant(text, ts, opts);
}

// scheduleJevonsRender coalesces streamed chunks: instead of re-parsing
// the growing markdown on every delta (O(n²) on replay of a turn that
// streamed as many frames), it re-renders at most once per animation
// frame from the accumulated _streamRaw (🎯T57).
function scheduleJevonsRender(el) {
  if (el._renderRaf) return;
  el._renderRaf = requestAnimationFrame(() => {
    el._renderRaf = 0;
    // 🎯T347: a replay-lazy shell accumulates raw text without parsing —
    // only its estimated height tracks the growing content. The post-pin
    // band materialize (or virtualize's _streamRaw fast path once live)
    // does the one real paint.
    if (el.classList && el.classList.contains('virt-shell') &&
        typeof el._streamRaw === 'string' && !el._smdSession) {
      el._layoutText = el._streamRaw;
      el._layoutRole = 'jevons';
      if (typeof VirtualList !== 'undefined' && VirtualList.estimateHeightFromText) {
        el.style.minHeight = VirtualList.estimateHeightFromText(el._streamRaw) + 'px';
      }
      if (!historyReplayActive) scheduleVirtualize();
      return;
    }
    el._layoutText = el._streamRaw;
    el._layoutRole = 'jevons';
    renderBody(el, 'jevons', el._streamRaw);
    // 🎯T164: live stream only — paintBody no longer auto-closes (history-safe).
    if (!historyReplayActive && typeof el._streamRaw === 'string') {
      maybeCloseTargetAside(el._streamRaw);
    }
    // Streaming text is real progress — reset T94 idle stuck clock.
    if (workingEl) armWorkingWatch();
    // T66: stream may start short then measure tall while still latest —
    // re-evaluate auto-expand so the sealed reply is not stuck collapsed.
    scheduleLatestExpansion();
    // Force layout then pin immediately (not only coalesced rAF) so each
    // incremental paint's true scrollHeight is what stick-to-bottom uses.
    if (isTracking()) {
      void (el._body && el._body.offsetHeight);
      scrollDown();
    }
  });
}

// Host seal paint (VirtualList shells, mermaid, target-aside). The widget
// already cleared _streamRaw and the open handle (🎯T372).
function paintSealedJevons(el, raw, streamId) {
  if (!el) return;
  el._layoutText = raw;
  el._layoutRole = 'jevons';
  // 🎯T347: sealing a replay-lazy shell keeps it a shell — final estimated
  // height only, no parse. The history_meta pin paints the end band.
  if (historyReplayActive && el.classList && el.classList.contains('virt-shell') &&
      !el._smdSession) {
    if (typeof VirtualList !== 'undefined' && VirtualList.estimateHeightFromText) {
      el.style.minHeight = VirtualList.estimateHeightFromText(raw) + 'px';
    }
    return;
  }
  // 🎯T150: end progressive session before full marked seal paint.
  if (el._smdSession) {
    try { el._smdSession.end(); } catch (_) { /* ignore */ }
  }
  destroyStreamSession(el);
  // Stay expanded through seal so measure/paint never flashes a preview
  // into the live latest bubble (would freeze follow at a mid offset).
  el._expanded = true;
  el._autoExpanded = true;
  renderBody(el, 'jevons', raw);
  // 🎯T164: terminal seal of a live turn — run filed-marker close once more
  // (stream path may have already closed; idempotent when no open file-target).
  if (!historyReplayActive) {
    maybeCloseTargetAside(raw);
    // 🎯T267: seal path focuses target-ask (PO select + frontier highlight).
    // Mid-stream intentionally skipped — thrash residual (loadFrontier + select).
    if (typeof maybeFocusTargetAsk === 'function') maybeFocusTargetAsk(raw);
  }
  unwatchStreamBubble(el);
  scheduleLatestExpansion();
  // Final layout (markdown / mermaid / highlight) often grows after the
  // last stream pin — re-follow so the user never needs a manual nudge.
  if (isTracking()) {
    void msgs.offsetHeight;
    scrollDown();
  }
  // 🎯T21: sealed assistant text is durable context for Wispr document mode.
  refreshWisprContext();
}

// 🎯T372: seal is the widget's. Host only paints (paintSealedJevons via onSeal).
function sealAssistantStream(streamId) {
  if (mainConversation && typeof mainConversation.sealAssistant === 'function') {
    mainConversation.sealAssistant(streamId);
  }
}

function startTurn() {
  // A compact, non-expanding marker: a one-line label whose tool detail
  // lives in a .turn-tip that only appears on hover.
  turnDetails = document.createElement('div');
  turnDetails.className = 'turn-marker';
  const label = document.createElement('span');
  turnDetails.appendChild(label);
  turnItems = document.createElement('div');
  turnItems.className = 'turn-tip';
  turnDetails.appendChild(turnItems);
  turnDetails._label = label;
  const row = registerTranscriptRow('turn-marker', '', Date.now(), {});
  row.el = turnDetails;
  turnDetails._vIndex = transcriptRows.length - 1;
  if (typeof VirtualList !== 'undefined' && VirtualList.layoutTop) {
    turnDetails.style.position = 'absolute';
    turnDetails.style.top = VirtualList.layoutTop(transcriptLayout, turnDetails._vIndex) + 'px';
    turnDetails.style.left = '0';
    turnDetails.style.right = '0';
  }
  msgsCanvas.appendChild(turnDetails);
  applyRowHeight(turnDetails._vIndex, Math.max(16, turnDetails.offsetHeight || 16));
  turnCount++;
  scrollDownThrottled();
}

function closeTurn() {
  if (!turnDetails) return;
  const n = turnItems ? turnItems.children.length : 0;
  if (n === 0) {
    const idx = turnDetails._vIndex;
    try { turnDetails.remove(); } catch (_) { /* isolated */ }
    // Unused slot — no tools fired. Delete the row. Leaving it in the
    // list made attach rebuild it as .msg.turn-marker + a clock ("now").
    if (idx != null) removeTranscriptRow(idx);
  }
  // else: leave the compact marker in place; hover reveals the detail.
  turnDetails = null;
  turnItems = null;
}

// formatAgentNote renders an injected notification as a compact activity
// line: "[Agent jevons-po responded]\nPONG" → "jevons-po → PONG". Falls
// back to a trimmed one-liner for other notes (e.g. budget alerts).
function formatAgentNote(text) {
  const m = text.match(/^\[Agent (.+?) responded\]\s*([\s\S]*)$/);
  if (m) return m[1] + ' → ' + truncate(m[2].replace(/\s+/g, ' ').trim(), 80);
  return truncate(text.replace(/\s+/g, ' ').trim(), 100);
}

function addTurnItem(cls, text) {
  if (!turnItems) startTurn();
  const d = document.createElement('div');
  d.className = 'turn-item ' + cls;
  d.textContent = text;
  turnItems.appendChild(d);
  const n = turnItems.children.length;
  turnDetails._label.textContent = '⋯ ' + n + (n === 1 ? ' step' : ' steps');
  if (turnDetails._vIndex != null && transcriptRows[turnDetails._vIndex]) {
    transcriptRows[turnDetails._vIndex].text = turnDetails._label.textContent;
  }
  if (typeof noteRowHeightChange === 'function') noteRowHeightChange(turnDetails);
  // 🎯T71: mid-turn tool activity is the best ACP-available progress signal.
  if (cls === 'tool-use' || cls === 'tool-result') {
    const short = truncate(String(text || '').replace(/\s+/g, ' ').trim(), 48);
    updateWorkingProgress(n + (n === 1 ? ' step' : ' steps') + (short ? ' · ' + short : ''));
  }
  scrollDownThrottled();
}

// buildMsg constructs a .msg element (body + timestamp) WITHOUT inserting
// it, so it can be appended live or batched into a fragment for history
// prepend (🎯T57/T119). Height-based collapse requires the node in the
// document — call layoutMsg after attach (offsetHeight is 0 detached).
// opts.lazy (🎯T119): shell-only unmeasured placeholder — no markdown paint
// until first materialization near the viewport (lazy measure).
//
// 🎯T308: this is THE bubble constructor — main #messages AND the RHS
// #agent-inspect-body both build their turns here. Callers vary only by
// input and two opts:
//   opts.paint(d, role, text)  — body-policy override (inspect classifies
//                                user turns differently; assistant still
//                                lands on the shared paintBody).
//   opts.timeIfKnown           — omit .msg-time when the turn carries no
//                                timestamp, instead of stamping "now" on a
//                                sealed historical turn.
// Anything that hand-rolls a second `className = 'msg …'` shell is the bug
// this target exists to kill (T157/T205/T209/T217/T221/T233/T265 each shared
// a little more paint and left two shells standing).
function buildMsg(role, text, when, opts) {
  const lazy = !!(opts && opts.lazy);
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const body = document.createElement('div');
  body.className = 'msg-body';
  d.appendChild(body);
  d._body = body;
  d._layoutRole = role;
  d._layoutText = text == null ? '' : text;
  // 🎯T381: provenance is fixed at build time and read by every later paint.
  // Unmarked is the owner — verbatim is the safe default, so a history line
  // written before the field existed can never turn the owner's own asterisks
  // into formatting.
  d._turnOrigin = (typeof ChatEvents !== 'undefined' && ChatEvents.turnOriginOf)
    ? ChatEvents.turnOriginOf({ turn_origin: opts && opts.turnOrigin })
    : (((opts && opts.turnOrigin) === 'agent') ? 'agent' : 'owner');
  if (role === 'user' && d._turnOrigin === 'agent') d.classList.add('agent-report');
  // 🎯T150: live stream bubbles paint progressive MD from the first frame.
  if (opts && opts.streamOpen) {
    d._streamRaw = d._layoutText;
  }
  if (lazy) {
    // Unmeasured shell: estimated height freezes geometry until enter-band.
    d.classList.add('virt-shell');
    d._shellState = (typeof VirtualList !== 'undefined')
      ? VirtualList.SHELL_UNMEASURED
      : 'unmeasured';
    const est = (typeof VirtualList !== 'undefined')
      ? VirtualList.estimateHeightFromText(d._layoutText)
      : 72;
    d.style.minHeight = est + 'px';
    d._virtSize = null;
  } else {
    // Provisional full paint (no collapse gate) so something shows if layout
    // is deferred; layoutMsg remeasures once connected.
    if (opts && typeof opts.paint === 'function') {
      opts.paint(d, role, d._layoutText); // 🎯T308 caller body policy
    } else {
      paintBody(d, role, d._layoutText);
    }
    d._shellState = (typeof VirtualList !== 'undefined')
      ? VirtualList.SHELL_MATERIAL
      : 'material';
  }
  // 🎯T308: timeIfKnown callers (inspect) show chrome only for turns that
  // actually carry a timestamp; live main bubbles keep defaulting to now.
  const known = (typeof AgentTranscript !== 'undefined' && AgentTranscript.normalizeWhen)
    ? AgentTranscript.normalizeWhen(when)
    : (when || undefined);
  const ms = known !== undefined ? known : ((opts && opts.timeIfKnown) ? null : Date.now());
  if (ms !== null) {
    const ts = document.createElement('div');
    ts.className = 'msg-time';

// renderFrames builds .msg nodes from raw wire frames into a fragment
// (no #messages insert, no scroll) for prepend. Whole chunks only (🎯T119):
// consecutive assistant text frames coalesce into one bubble via
// VirtualList.coalesceTranscriptFrames. opts.lazy → unmeasured shells.
// Returns { frag, nodes } so the caller can layoutMsgList after attach.
function renderFrames(lines, opts) {
  const lazy = !!(opts && opts.lazy);
  const frag = document.createDocumentFragment();
  const nodes = [];
  // 🎯T250: harvest aside wires for sidebar before main coalesce drops them.
  if (typeof ingestAsideWiresFromHistoryLines === 'function') {
    try { ingestAsideWiresFromHistoryLines(lines); } catch (_) {}
  }
  const chunks = (typeof VirtualList !== 'undefined' && VirtualList.coalesceTranscriptFrames)
    ? VirtualList.coalesceTranscriptFrames(lines)
    : null;
  if (chunks) {
    for (const c of chunks) {
      if (typeof VirtualList !== 'undefined' && VirtualList.isWholeChunk && !VirtualList.isWholeChunk(c)) {
        continue;
      }
      // 🎯T250/T264: never paint aside wire as a main user bubble (history flash).
      if (c.role === 'user' && typeof isMainAsideWireUserText === 'function' &&
          isMainAsideWireUserText(c.text)) {
        continue;
      }
      // 🎯T381: history hydrate paints from the same provenance the live wire
      // carried, so a reload does not re-raw an agent report.
      const el = buildMsg(c.role, c.text, c.timestamp, { lazy: lazy, turnOrigin: c.origin });
      nodes.push(el);
      frag.appendChild(el);
    }
    return { frag, nodes };
  }
  // Fallback if VirtualList missing (should not happen in product).
  let pending = null;
  for (const line of lines) {
    let m;
    try { m = (typeof line === 'string') ? JSON.parse(line) : line; } catch { continue; }
    const ts = m.timestamp ? new Date(m.timestamp).getTime() : Date.now();
    if (m.type === 'user') {
      const c = ChatEvents.userContentText(m); // 🎯T384: either content shape
      if (c) {
        // 🎯T250/T264
        if (typeof isMainAsideWireUserText === 'function' && isMainAsideWireUserText(c)) {
          pending = null;
          continue;
        }
        pending = null;
        const el = buildMsg('user', c, ts, {
          lazy: lazy,
          turnOrigin: ChatEvents.turnOriginOf(m), // 🎯T381
        });
        nodes.push(el);
        frag.appendChild(el);
      }
    } else if (m.type === 'assistant') {
      let txt = '';
      // 🎯T161: multi-block = segment list; consecutive assistant frames in
      // this fallback are treated as segment edges (sealed history / multi-part).
      try {
        txt = ChatEvents.joinAssistantTexts(
          ChatEvents.assistantTextBlocks(m).map(b => b.text),
        );
      } catch { txt = ''; }
      if (txt) {
        if (pending) {
          pending.raw = ChatEvents.joinAssistantSegments(pending.raw, txt);
          pending.el._layoutText = pending.raw;
          if (!lazy) paintBody(pending.el, 'jevons', pending.raw);
        } else {
          const el = buildMsg('jevons', txt, ts, { lazy: lazy });
          pending = { el, raw: txt };
          nodes.push(el);
          frag.appendChild(el);
        }
      }
    }
  }
  return { frag, nodes };
}

    sendQueueState = {
      items: [{ id: r.item.id, text: r.item.text }].concat(sendQueueState.items || []),
      nextId: sendQueueState.nextId || 1,
    };
    persistSendQueue();
    renderSendQueue();
  }
}

function clearComposerAfterQueueOrSend() {
  input.value = '';
  pendingImages.forEach(img => { if (img.objectUrl) try { URL.revokeObjectURL(img.objectUrl); } catch (_) {} });
  pendingImages.length = 0;
  renderComposerImages();
  histIdx = null; histDraft = ''; setEditingHighlight(null);
  navFocus = { zone: 'live' };
  liveDraftBackup = '';
  // 🎯T239: intentional clear after accept/enqueue — drop durable draft.
  clearComposerDraft();
  autoGrow();
  // 🎯T21: empty composer again — re-seed for next dictation (stripped on send).
  ensureWisprSeed();
  // 🎯T153: send/enqueue returns focus to composer (composer-first Tab path).
  focusComposer();
}

// opts.interrupt: true when Control+Enter (Grok-class interject).
function send(opts) {
  const interruptChord = !!(opts && opts.interrupt);
  // If Alt-nav is focused on a queue row, Enter commits edits back into
  // that row (does not re-enqueue a duplicate).
  if (navFocus.zone === 'queue' && typeof SendQueue !== 'undefined' && !interruptChord) {
    const qi = navFocus.index | 0;
    const it = sendQueueState.items[qi];
    if (it) {
      // Queue row text is owner draft — strip any accidental seed prefix.
      const rowText = (typeof WisprContext !== 'undefined')
        ? WisprContext.prepareWireText(input.value)
        : input.value;
      sendQueueState = SendQueue.updateItem(sendQueueState, it.id, rowText);
      persistSendQueue();
      navFocus = { zone: 'live' };
      input.value = liveDraftBackup;
      liveDraftBackup = '';
      histIdx = null; histDraft = ''; setEditingHighlight(null);
      renderSendQueue();
      autoGrow();
      ensureWisprSeed();
      focusComposer();
      return;
    }
  }
  // 🎯T21: strip empty-composer seed before wire; never invent grammar/`?`.
  // 🎯T372: widget.send may pass the draft as opts.text (composer already read).
  const rawDraft = (opts && opts.text != null) ? String(opts.text) : input.value;
  let t = (typeof WisprContext !== 'undefined')
    ? WisprContext.prepareWireText(rawDraft).trim()
    : rawDraft.trim();
  // 🎯T76: allow send with only images attached.
  if (!t && !pendingImages.length) return;
  // Prepend image markers so the overseer receives durable references.
  if (pendingImages.length) {
    const markers = pendingImages.map(img => img.marker || ('[image: ' + img.id + ']')).join(' ');
    t = t ? (markers + '\n' + t) : markers;
  }
  // 🎯T65/T95 prefix-first: aside:/capture:/park:/main:/pursue:/target:
  // 🎯T247: when an explicit open prefix already spawns/routes the aside, do not
  // fall through to T135 "Continue in" / create-affordance after send.
  let explicitAsideOpened = false;
  if (attentionState && typeof AttentionThreads !== 'undefined') {
    if (!AttentionThreads.isMainFocus(attentionState)) {
      // Don't clobber side-thread body with a command-prefixed draft.
      const p = AttentionThreads.parsePrefix(t);
      if (!p.command) {
        // Persist seed-stripped draft only (🎯T21).
        attentionState = AttentionThreads.updateActiveBody(attentionState, t);
      }
    }
    const ownerDraftForLog = t;
    const parsedCmd = AttentionThreads.parsePrefix(t);
    const r = AttentionThreads.handleComposer(attentionState, t);
    attentionState = r.state;
    persistAttention();
    // Decision log: composer outcome (kind/command/purpose/threadId) — audit §3.2.
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('info', DecisionLog.decisionMsg('attention'), DecisionLog.formatComposerDecision(r, {
        command: parsedCmd && parsedCmd.command,
        draft: ownerDraftForLog,
        corr: pageCorr,
      }));
      // Local focus transitions from prefixes (main/pursue/park/capture/…).
      if (r.kind === 'local' && parsedCmd && parsedCmd.command) {
        const focusAct = parsedCmd.command === 'capture' ? 'capture'
          : (parsedCmd.command === 'target' ? 'target' : parsedCmd.command);
        if (focusAct === 'main' || focusAct === 'pursue' || focusAct === 'park' ||
            focusAct === 'capture') {
          jLog('info', DecisionLog.decisionMsg('attention'), DecisionLog.formatFocusDecision(focusAct, {
            threadId: r.threadId,
            draft: ownerDraftForLog,
            corr: pageCorr,
          }));
        }
      }
    }
    // 🎯T136: any create that yields an aside id dual-writes to fleet registry
    // so RHS tree shows 💡 + auto-select/inspect (not top chip chrome).
    // 🎯T263: freeform aside: also pass opening body so server starts + delivers
    // in the same turn (not registry-only empty transcript).
    if (r.threadId && (parsedCmd && (parsedCmd.command === 'aside' ||
        parsedCmd.command === 'capture' || parsedCmd.command === 'target'))) {
      const th = AttentionThreads.findThread(attentionState, r.threadId);
      let title = th && th.title ? th.title : '';
      if (!title && typeof AttentionThreads.titleFromBody === 'function') {
        title = AttentionThreads.titleFromBody((th && th.body) || '');
      }
      const openingBody = (th && th.body) || (parsedCmd.body) || '';
      const createOpts = (typeof AgentTranscript !== 'undefined' &&
          AgentTranscript.freeformAsideCreateOpts)
        ? AgentTranscript.freeformAsideCreateOpts(parsedCmd.command, openingBody)
        : (parsedCmd.command === 'aside' && String(openingBody).trim()
          ? { text: String(openingBody).trim(), expectDeliver: true }
          : {});
      // 🎯T270: persist type on create so closed history delineates filing vs side-chat.
      if (typeof AsideHistory !== 'undefined' && AsideHistory.kindFromCommand) {
        createOpts.kind = AsideHistory.kindFromCommand(parsedCmd.command);
      } else if (parsedCmd.command === 'target') {
        createOpts.kind = 'target';
      } else if (parsedCmd.command === 'capture') {
        createOpts.kind = 'capture';
      } else {
        createOpts.kind = createOpts.kind || 'side';
      }
      createOpts.command = parsedCmd.command;
      // 🎯T279: paint owner opening on RHS immediately (target:/aside:/capture:)
      // so the request never vanishes from UI while register/deliver is in flight.
      // Freeform aside: still also deliver via ensureFleetAside when text set.
      if (openingBody && typeof showAsideOpeningWorking === 'function') {
        try {
          showAsideOpeningWorking(r.threadId, String(openingBody).trim());
        } catch (_) { /* inspect may not be mounted */ }
      }
      ensureFleetAside(r.threadId, title || 'aside', createOpts).catch(function () {
        // ensureFleetAside already surfaces loud UI for freeform deliver fail.
      });
      // 🎯T247: explicit open prefix already spawned — no post-send route chip.
      explicitAsideOpened = true;
    } else if (r.routed) {
      // Already delivered onto an aside wire (pursue focus / aside: body).
      explicitAsideOpened = true;
    }
    // 🎯T325.3: durable idea ledger dual-write (capture: / idea:) — not scrollback-only.
    if (typeof IdeaCapture !== 'undefined' && IdeaCapture.shouldCaptureIdea && IdeaCapture.shouldCaptureIdea(r)) {
      const ideaBody = IdeaCapture.ideaCaptureFromComposer(r);
      if (ideaBody && ideaBody.text) {
        fetch('/api/ideas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ideaBody),
        }).catch(function () {
          // Loud residual: idea POST failure is non-fatal for capture UX;
          // capture: still has fleet aside as durable fallback.
        });
      }
    }
    if (r.kind === 'local' || r.kind === 'empty') {
      if (r.clearComposer) {
        input.value = r.composerBody != null ? r.composerBody : '';
        // 🎯T368: markers were consumed into the capture/idea body — drop the
        // chips too, or the next send re-attaches the same images.
        if (pendingImages.length) {
          pendingImages.forEach(img => {
            if (img.objectUrl) try { URL.revokeObjectURL(img.objectUrl); } catch (_) {}
          });
          pendingImages.length = 0;
          renderComposerImages();
        }
      }
      if (AttentionThreads.isMainFocus(attentionState)) {
        mainDraftBackup = (typeof WisprContext !== 'undefined')
          ? WisprContext.prepareWireText(input.value)
          : input.value;
      }
      histIdx = null; histDraft = ''; setEditingHighlight(null);
      ensureWisprSeed();
      autoGrow();
      renderAttention();
      // 🎯T153: local attention cmds (main/park/pursue/…) keep composer focused.
      focusComposer();
      return; // no wire send for local commands
    }
    t = r.text;
    if (!t) return;
    if (AttentionThreads.isMainFocus(attentionState)) mainDraftBackup = '';
    renderAttention();
  }
  // 🎯T99: cheap continuation routing when on main with no explicit prefix.
  // 🎯T134: routeCandidates = open only — never done/archive ghosts.
  // 🎯T135: match is suggestion only; no silent steal — NEVER pursue or
  // rewrite `t` / wire via formatAsideWire on auto-match. Main draft stays main.
  // 🎯T247: skip entirely when target:/aside:/capture: (or other routed
  // composer path) already opened the aside — no intermediate create/continue chip.
  // ALWAYS log the route hit (T99 opacity / T120 DecisionLog) when we do plan.
  let pendingRouteSuggestion = null;
  if (!explicitAsideOpened && typeof ThreadRoute !== 'undefined' && attentionState &&
      typeof AttentionThreads !== 'undefined' && AttentionThreads.isMainFocus(attentionState)) {
    // Route on seed-stripped draft (🎯T21) so EMPTY_SEED never influences match.
    const ownerDraft = t;
    const threads = (typeof AttentionThreads.routeCandidates === 'function')
      ? AttentionThreads.routeCandidates(attentionState)
      : (attentionState.threads || []).filter(function (th) {
          return th && th.status === 'open';
        }).map(function (th) {
          return { id: th.id, title: th.title, digest: th.body, body: th.body, status: th.status };
        });
    const hit = ThreadRoute.route(ownerDraft || t, threads);
    // ALWAYS log full hit even when we do not rewrite wire (🎯T135).
    if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
      jLog('info', DecisionLog.decisionMsg('thread_route'), DecisionLog.formatRouteDecision(hit, pageCorr));
    }
    // 🎯T135: plan only — steal always false; suggestion for opt-in affordance.
    if (typeof RouteSuggest !== 'undefined' && typeof RouteSuggest.planAutoRouteAction === 'function') {
      const act = RouteSuggest.planAutoRouteAction(hit, {
        threads: threads,
        body: ownerDraft || t,
      });
      // act.steal is always false by contract; never pursue / formatAsideWire here.
      pendingRouteSuggestion = act.suggestion;
    } else if (hit && hit.threadId && hit.reason === 'match') {
      const matched = AttentionThreads.findThread(attentionState, hit.threadId);
      if (matched && matched.status === 'open') {
        pendingRouteSuggestion = {
          threadId: String(hit.threadId),
          title: matched.title || '',
          score: typeof hit.score === 'number' ? hit.score : 0,
          body: ownerDraft || t,
        };
      }
    }
    // Intentionally NO AttentionThreads.pursue / formatAsideWire on match (🎯T135).
  }
  // 🎯T113: while busy, plain Enter enqueues; only Control+Enter interjects.
  // 🎯T228: offline / wire-down also enqueues visibly (never clear-and-drop).
  const wireOpen = isChatWireOpen();
  const decision = (typeof SendQueue !== 'undefined')
    ? SendQueue.decideSend({
        busy: !!workingEl,
        interrupt: interruptChord,
        text: t,
        hasImages: pendingImages.length > 0,
        wireOpen: wireOpen,
      })
    : (!wireOpen || (workingEl && !interruptChord)
      ? { action: 'enqueue', text: t, reason: !wireOpen ? 'offline' : 'busy' }
      : { action: 'send', text: t, interrupt: !!(workingEl && interruptChord) });
  if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
    jLog('info', DecisionLog.decisionMsg('send_queue'), DecisionLog.formatSendDecision(decision, pageCorr));
  }
  if (decision.action === 'noop') return; // seed-only / empty residual — no clear
  if (decision.action === 'enqueue') {
    if (typeof SendQueue !== 'undefined') {
      sendQueueState = SendQueue.enqueue(sendQueueState, decision.text);
      persistSendQueue();
      clearComposerAfterQueueOrSend();
      renderSendQueue();
      // Owner-visible: queue strip. Offline reason also flashes status briefly.
      if (decision.reason === 'offline' && sTxt && sTxt.textContent !== 'connected') {
        /* status already reconnecting/connecting — strip is the evidence */
      } else if (decision.reason === 'offline' && sTxt) {
        sTxt.textContent = 'queued (offline)';
      }
      return;
    }
    // No SendQueue module — keep draft and surface error (never silent drop).
    if (sTxt) sTxt.textContent = 'send failed — not connected';
    return;
  }
  // Wire send stays on main; stash suggestion for the user-bubble affordance.
  // 🎯T228: clear composer ONLY after transport accepts the payload.
  lastRouteSuggestion = pendingRouteSuggestion;
  const sent = submitWireText(decision.text, { interrupt: !!decision.interrupt });
  if (sent) {
    clearComposerAfterQueueOrSend();
    return;
  }
  // Race: wire closed between decide and send — fall back to visible queue.
  if (typeof SendQueue !== 'undefined') {
    sendQueueState = SendQueue.enqueue(sendQueueState, decision.text);
    persistSendQueue();
    clearComposerAfterQueueOrSend();
    renderSendQueue();
    if (sTxt) sTxt.textContent = 'queued (offline)';
    return;
  }
  if (sTxt) sTxt.textContent = 'send failed — not connected';
}

// 🎯T135: attach opt-in "Continue in: «title»" under a user bubble.
function attachRouteSwitch(msgEl, suggestion) {
  if (!msgEl || !suggestion || typeof RouteSuggest === 'undefined') return;
  if (!RouteSuggest.shouldShowSwitch({ reason: 'match', threadId: suggestion.threadId })) return;
  if (msgEl.querySelector && msgEl.querySelector('.route-switch')) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'route-switch';
  // 🎯T153: route-switch is pointer-only chrome — not a Tab stop.
  btn.tabIndex = -1;
  btn.textContent = RouteSuggest.formatSwitchLabel(suggestion);
  btn.title = 'Deliver this message to the suggested aside and interrupt main';
  btn.setAttribute('aria-label', btn.textContent);
  btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (btn.disabled) return;
    btn.disabled = true;
    optInRouteSwitch(suggestion);
    // 🎯T153: return focus to main composer after opt-in route click.
    focusComposer();
  });
  msgEl.appendChild(btn);
}

// 🎯T135 opt-in only: interrupt main + deliver body to suggested thread.
// Default auto-match never calls this — only the owner click does.
function optInRouteSwitch(suggestion) {
  if (typeof RouteSuggest === 'undefined' || typeof AttentionThreads === 'undefined') return;
  const plan = RouteSuggest.planOptInSwitch(suggestion);
  if (!plan.ok) return;
  if (typeof jLog === 'function' && typeof DecisionLog !== 'undefined') {
    jLog('info', DecisionLog.decisionMsg('thread_route'), {
      decision: 'opt_in_route_switch',
      threadId: plan.deliverTo,
      title: plan.title || '',
      corr: pageCorr,
    });
  }
  // Cancel in-flight main turn for the stolen-then-redirected prompt.
  if (workingEl) {
    try { transport.send('{"type":"interrupt"}'); } catch (_) {}
  }
  const th = attentionState
    ? AttentionThreads.findThread(attentionState, plan.deliverTo)
    : null;
  const title = plan.title || (th && th.title) || '';
  // Local chrome focus follows opt-in delivery (not silent auto-match).
  if (attentionState && typeof AttentionThreads.pursue === 'function') {
    attentionState = AttentionThreads.pursue(attentionState, plan.deliverTo);
    persistAttention();
    renderAttention();
  }
  const wire = (typeof AttentionThreads.formatAsideWire === 'function')
    ? AttentionThreads.formatAsideWire(plan.deliverTo, title, plan.body)
    : plan.body;
  // Already interrupted above when busy.
  submitWireText(wire, { interrupt: false });
}

// rewindAndResend performs the destructive "edit an earlier message"
// path: roll the conversation back to the highlighted recalled message
// and resend the edited text. Backed by claudia's session rewind (kill
// process, truncate transcript at a turn boundary, --resume). Only valid
// when a recalled message is highlighted.
function rewindAndResend() {
  const text = (typeof WisprContext !== 'undefined')
    ? WisprContext.prepareWireText(input.value).trim()
    : input.value.trim();
  if (!text || !editingEl) return;
  const users = [];
  for (let i = 0; i < transcriptRows.length; i++) {
    const row = transcriptRows[i];
    if (row && row.role === 'user' && row.el) users.push(row.el);
  }
  const idx = users.indexOf(editingEl);
  if (idx < 0) { send(); return; } // out of sync — fall back to append
  const n = users.length - idx;    // turns to roll back: the edited msg + everything after
  transport.send(JSON.stringify({ type: 'rewind', turns: n }));
  transport.send(text);
  input.value = '';
  histIdx = null; histDraft = ''; setEditingHighlight(null);
  autoGrow();
  ensureWisprSeed();
  enterTrackBottom(); setWorking(true);
  requestAnimationFrame(() => { scrollDown(); });
}

// 🎯T227 / 🎯T235: owner bubbles in #messages (WS + progressive hydrate).
// Progressive hydrate paints via renderFrames without pushing msgHistory —
// DOM is the durable product view when memory desyncs.
function collectDomOwnerEntries() {
  const nodes = [];
  for (let i = 0; i < transcriptRows.length; i++) {
    const row = transcriptRows[i];
    if (!row || row.role !== 'user') continue;
    if (row.el) nodes.push(row.el);
    else {
      const fake = { _layoutText: row.text, _body: null, classList: { contains: function (c) { return c === 'user'; } } };
      nodes.push(row.el || fake);
    }
  }
  if (typeof ComposerKeys !== 'undefined' && ComposerKeys.ownerEntriesFromUserNodes) {
    const fromEl = nodes.filter(function (n) { return n && n.isConnected; });
    if (fromEl.length) return ComposerKeys.ownerEntriesFromUserNodes(fromEl);
  }
  const out = [];
  for (const el of nodes) {
    // Prefer non-empty _layoutText; fall back to body (not outer textContent —
    // timestamp chrome lives outside .msg-body).
    let text = '';
    if (el._layoutText != null && String(el._layoutText).length) {
      text = String(el._layoutText);
    } else if (el._body && el._body.textContent) {
      text = String(el._body.textContent);
    }
    if (text && String(text).trim()) out.push({ text: text, el: el });
  }
  return out;
}

// Rebuild msgHistory from DOM when empty/desynced so Alt+Enter and Alt+Up
// share one source of truth after progressive hydrate (🎯T227).
function rebuildMsgHistoryFromDomIfNeeded() {
  const domEntries = collectDomOwnerEntries();
  if (!domEntries.length) return;
  // Prefer full DOM rebuild when memory is empty or shorter than painted users
  // (progressive prepend adds older bubbles msgHistory never saw).
  if (!msgHistory.length || msgHistory.length < domEntries.length) {
    msgHistory = domEntries.map(function (e) { return { text: e.text, el: e.el }; });
  }
}

// 🎯T132 / 🎯T227 / 🎯T235: Alt+Enter on an empty/seed-only composer seeds the
// box with the most recent owner message as an interjection/edit draft.
// Product path uses ComposerKeys.planPopLastOwner (resolve + resync without
// clobbering DOM text with empty hist tail). Fail loud when owner bubbles
// exist but pop cannot load (silent no-op is not acceptable — 🎯T235).
// Returns true when a message was loaded.
function popLastOwnerAsInterjection() {
  const domEntries = collectDomOwnerEntries();
  let plan = null;
  if (typeof ComposerKeys !== 'undefined' && ComposerKeys.planPopLastOwner) {
    plan = ComposerKeys.planPopLastOwner(msgHistory, domEntries);
  } else {
    // Legacy fallback if planPopLastOwner missing (older script cache).
    let entry = null;
    if (typeof ComposerKeys !== 'undefined' && ComposerKeys.resolveLastOwnerEntry) {
      entry = ComposerKeys.resolveLastOwnerEntry(msgHistory, domEntries);
    } else if (msgHistory.length) {
      entry = {
        text: msgHistory[msgHistory.length - 1].text,
        index: msgHistory.length - 1,
        el: msgHistory[msgHistory.length - 1].el,
      };
    } else if (domEntries.length) {
      entry = {
        text: domEntries[domEntries.length - 1].text,
        index: domEntries.length - 1,
        el: domEntries[domEntries.length - 1].el,
      };
    }
    if (entry && entry.text) {
      plan = {
        ok: true,
        text: entry.text,
        el: entry.el,
        index: entry.index,
        history: null,
        failLoud: false,
      };
    } else {
      plan = {
        ok: false,
        failLoud: !!(domEntries.length || msgHistory.length),
        reason: 'resolve_miss',
      };
    }
  }
  if (!plan || !plan.ok || !plan.text) {
    // 🎯T235: fail loud when owner bubbles exist — never silent miss.
    if (plan && plan.failLoud && typeof addStatusMsg === 'function') {
      addStatusMsg('Could not load last owner message into composer.');
    }
    return false;
  }
  // Apply resynced history when the plan rebuilt it (DOM longer / DOM source).
  if (plan.history && plan.history.length) {
    msgHistory = plan.history;
  } else if (!msgHistory.length && domEntries.length) {
    rebuildMsgHistoryFromDomIfNeeded();
  }
  liveDraftBackup = '';
  histDraft = '';
  histIdx = typeof plan.index === 'number' ? plan.index : (msgHistory.length - 1);
  navFocus = { zone: 'history', index: histIdx };
  input.value = plan.text || '';
  setEditingHighlight(plan.el || null);
  if (typeof syncComposerSeedClass === 'function') syncComposerSeedClass();
  autoGrow();
  try {
    input.selectionStart = input.selectionEnd = input.value.length;
  } catch (_) {}
  focusComposer();
  return true;
}

// 🎯T113 + 🎯T88: Alt+Up/Down cycles queued follow-ups first, then
// previously submitted request history (queue before history).
// dir = -1 (older / Up) or +1 (newer / Down). Returns true if handled.
function recallHistory(dir) {
  if (typeof SendQueue === 'undefined') {
    // Legacy path if module missing.
    if (msgHistory.length === 0) return false;
    if (histIdx === null) {
      if (dir > 0) return false;
      histDraft = input.value;
      histIdx = msgHistory.length;
    }
    histIdx += dir;
    if (histIdx >= msgHistory.length) {
      histIdx = null;
      input.value = histDraft;
      setEditingHighlight(null);
    } else {
      if (histIdx < 0) histIdx = 0;
      const entry = msgHistory[histIdx];
      input.value = entry.text;
      setEditingHighlight(entry.el);
    }
    if (typeof syncComposerSeedClass === 'function') syncComposerSeedClass();
    autoGrow();
    input.selectionStart = input.selectionEnd = input.value.length;
    return true;
  }

  // Persist in-place edits to the focused queue row before leaving it.
  if (navFocus.zone === 'queue' && sendQueueState.items[navFocus.index | 0]) {
    const cur = sendQueueState.items[navFocus.index | 0];
    sendQueueState = SendQueue.updateItem(sendQueueState, cur.id, input.value);
    persistSendQueue();
  } else if (navFocus.zone === 'live') {
    liveDraftBackup = input.value;
    histDraft = input.value;
  }

  const qLen = sendQueueState.items.length;
  const hLen = msgHistory.length;
  if (qLen === 0 && hLen === 0) return false;

  const stepped = SendQueue.cycleNav(navFocus, dir, qLen, hLen);
  if (!stepped.handled) return false;
  navFocus = stepped.focus;

  if (navFocus.zone === 'live') {
    histIdx = null;
    input.value = liveDraftBackup || histDraft || '';
    setEditingHighlight(null);
  } else if (navFocus.zone === 'queue') {
    histIdx = null;
    setEditingHighlight(null);
    const it = sendQueueState.items[navFocus.index | 0];
    input.value = it ? it.text : '';
  } else if (navFocus.zone === 'history') {
    histIdx = navFocus.index | 0;
    if (histIdx < 0) histIdx = 0;
    if (histIdx >= msgHistory.length) histIdx = msgHistory.length - 1;
    const entry = msgHistory[histIdx];
    input.value = entry ? entry.text : '';
    setEditingHighlight(entry ? entry.el : null);
  }
  // 🎯T183: any programmatic draft swap must re-sync seed-only visibility.
  if (typeof syncComposerSeedClass === 'function') syncComposerSeedClass();
  renderSendQueue();
  autoGrow();
  input.selectionStart = input.selectionEnd = input.value.length;
  return true;
}

// "Working" indicator: reflects whether an owner-visible turn is *currently*
// in flight (🎯T272 level-trigger). Send still opens chrome, but reload/
// reconnect re-derives from server history_meta.working / status samples —
// not from remembering the send edge. Sealed history hydrate never leaves
// stuck working. T260 clear policy still owns mid-turn tools-only seals.
