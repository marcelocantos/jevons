<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jevons — Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F916;</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  /* Red theme — tuned for in-car visibility. Backgrounds are lifted
     from near-black so panels are distinguishable; text is brighter
     for contrast at arm's length in daylight. Accent is a saturated
     red, with red-tinted surfaces and borders to carry the theme. */
  --bg: #1a0e0e;
  --surface: #261515;
  --surface-raised: #311c1c;
  --surface-high: #3d2424;
  --border: rgba(255,180,180,0.12);
  --border-focus: rgba(248,113,113,0.45);
  --text: #f0e8e8;
  --text-dim: #b4a0a0;
  --text-muted: #806868;
  --accent: #ef4444;
  --accent-dim: rgba(239,68,68,0.18);
  --user-bg: rgba(239,68,68,0.16);
  --user-border: rgba(239,68,68,0.4);
  --user-bg-editing: rgba(239,68,68,0.30);
  --green: #4ade80;
  --red: #ef4444;
  --amber: #fbbf24;
  --heading: #fff5f5;
  --strong: #ffffff;
  --dot-on-glow: rgba(74,222,128,0.5);
  --dot-off-glow: rgba(239,68,68,0.5);
  --agent-dot-glow: rgba(74,222,128,0.4);
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 10px;
}

[data-theme="light"] {
  --bg: #f8f8fa;
  --surface: #ffffff;
  --surface-raised: #f0f0f4;
  --surface-high: #e4e4ea;
  --border: rgba(0,0,0,0.08);
  --border-focus: rgba(0,0,0,0.18);
  --text: #2c2c34;
  --text-dim: #6e6e7a;
  --text-muted: #a0a0aa;
  --accent: #6d5dd3;
  --accent-dim: rgba(109,93,211,0.1);
  --user-bg: rgba(109,93,211,0.08);
  --user-border: rgba(109,93,211,0.2);
  --user-bg-editing: rgba(109,93,211,0.18);
  --green: #10b981;
  --red: #ef4444;
  --amber: #d97706;
  --heading: #1a1a22;
  --strong: #1a1a22;
  --dot-on-glow: rgba(16,185,129,0.3);
  --dot-off-glow: rgba(239,68,68,0.2);
  --agent-dot-glow: rgba(16,185,129,0.25);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; font-size: 14px; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }

/* Status bar */
#status { padding: 6px 20px; font-size: 11px; font-weight: 500; color: var(--text-dim); background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; gap: 8px; letter-spacing: 0.02em; text-transform: uppercase; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.on { background: var(--green); box-shadow: 0 0 6px var(--dot-on-glow); }
.dot.off { background: var(--red); box-shadow: 0 0 6px var(--dot-off-glow); }

#main { flex: 1; display: flex; overflow: hidden; }

/* Chat pane — messages flex:1 min-height:0 so composer growth shrinks the
   transcript instead of covering the latest reply (🎯T70 / T70.1). */
#chat-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
/* overflow-anchor:none — browser scroll-anchoring fights follow-scroll when
   a long markdown bubble is re-parsed every stream frame (🎯T30.2).
   flex-shrink:0 on children — default flex-shrink:1 lets tall .msg items
   compress inside the scroller so scrollHeight under-reports and stick-to-
   bottom pins to a false mid-bubble "bottom" while tokens still arrive. */
#messages { flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; padding: 24px 20px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: var(--surface-high) transparent; }
#messages > * { flex-shrink: 0; }
/* 🎯T56: browser skips layout/paint for off-screen shells; JS dematerialises bodies. */
#messages > .msg { content-visibility: auto; contain-intrinsic-size: auto 72px; }
#messages > .msg.virt-shell { content-visibility: visible; }
#messages > .msg.virt-shell > * { display: none !important; }
.composer-images { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px 6px; }
.composer-images:empty { display: none; }
.composer-images .img-chip { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.composer-images .img-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.composer-images .img-chip button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border: 0; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; font-size: 11px; line-height: 18px; cursor: pointer; padding: 0; }
.msg.user .chat-img { max-width: min(100%, 320px); max-height: 240px; border-radius: 8px; display: block; margin: 6px 0; border: 1px solid var(--user-border); }
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(--surface-high); border-radius: 3px; }

.msg { max-width: 85%; padding: 10px 16px; border-radius: var(--radius); line-height: 1.6; font-size: 14px; }
.msg.user { align-self: flex-end; background: var(--user-bg); color: var(--text); border: 1px solid var(--user-border); white-space: normal; word-wrap: break-word; }
.msg.user .msg-body { white-space: pre-wrap; }
.msg.user .msg-body blockquote { border-left: 2px solid var(--accent); padding-left: 12px; margin: 0.4em 0; color: var(--text-dim); white-space: pre-wrap; }
.msg.user .msg-body p { margin: 0.35em 0; }
.msg.user .msg-body p:first-child { margin-top: 0; }
.msg.user .msg-body p:last-child { margin-bottom: 0; }
/* The message currently being edited via up/down recall. Brighter bg +
   full-accent border (same 1px width → no reflow) + a box-shadow ring
   to "thicken" the border without shifting geometry. */
.msg.user.editing { background: var(--user-bg-editing); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.msg.jevons { align-self: flex-start; background: transparent; color: var(--text); white-space: normal; padding: 10px 4px; }

/* Markdown in agent responses */
.msg.jevons p { margin: 0.5em 0; }
.msg.jevons p:first-child { margin-top: 0; }
.msg.jevons p:last-child { margin-bottom: 0; }
.msg.jevons code { background: var(--surface-raised); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 0.88em; color: var(--accent); }
.msg.jevons pre { background: var(--surface); border: 1px solid var(--border); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0.6em 0; }
.msg.jevons pre code { background: none; padding: 0; color: var(--text); }
.msg.jevons .mermaid-diagram { margin: 0.6em 0; overflow-x: auto; text-align: center; }
.msg.jevons .mermaid-diagram svg { max-width: 100%; height: auto; }
.msg.jevons ul, .msg.jevons ol { padding-left: 1.5em; margin: 0.5em 0; }
.msg.jevons li { margin: 0.2em 0; }
.msg.jevons h1, .msg.jevons h2, .msg.jevons h3 { margin: 0.8em 0 0.3em; font-weight: 600; color: var(--heading); }
.msg.jevons h1 { font-size: 1.1em; }
.msg.jevons h2 { font-size: 1.05em; }
.msg.jevons h3 { font-size: 1em; }
.msg.jevons blockquote { border-left: 2px solid var(--accent); padding-left: 12px; margin: 0.5em 0; color: var(--text-dim); }
.msg.jevons table { border-collapse: collapse; margin: 0.5em 0; font-size: 0.9em; }
.msg.jevons th, .msg.jevons td { border: 1px solid var(--border); padding: 6px 10px; }
.msg.jevons th { background: var(--surface); font-weight: 500; }
.msg.jevons strong { color: var(--strong); font-weight: 600; }
.msg.jevons a { color: var(--accent); text-decoration: none; }
.msg.jevons a:hover { text-decoration: underline; }

/* Oversized content (🎯T57): large turns render only a bounded PREVIEW
   up front (marked.parse + DOM built on ~14 lines, not the whole thing);
   the full content is parsed lazily on Show more. Bounds the browser's
   work, not just what's visible. .msg-expand is the toggle. */
.msg-expand { display: block; margin-top: 4px; padding: 2px 0; background: none; border: none;
  color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; opacity: 0.9; }
.msg-expand:hover { opacity: 1; text-decoration: underline; }
.msg.user .msg-expand { margin-left: auto; text-align: right; }

/* Infinite scroll (🎯T57): recent turns replay on connect; a zero-height
   top sentinel drives an IntersectionObserver that auto-pages older
   history from the durable log as the user nears the top. A dim overlay
   shows while a window loads (it's out of flow, so it doesn't perturb
   scroll-position preservation). */
.history-sentinel { height: 1px; margin: 0; flex: 0 0 auto; }
.history-loading { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 3px 12px; font-size: 11px; color: var(--text-dim); z-index: 5; pointer-events: none; }

/* Worker notes — out-of-band system messages from a delegated agent.
   Centred, dim, collapsible. Distinct from both user (right) and
   jevons (left) so the user can't mistake them for either side of
   the conversation. 🎯T23. */
.msg.worker { align-self: center; max-width: 78%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--text-dim); margin: 6px auto; }
.msg.worker[open] { padding-bottom: 10px; }
.msg.worker summary { cursor: pointer; list-style: none; font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
.msg.worker summary::-webkit-details-marker { display: none; }
.msg.worker summary::before { content: '▸'; color: var(--text-muted); font-size: 10px; transition: transform 0.15s; }
.msg.worker[open] summary::before { transform: rotate(90deg); }
.msg.worker .worker-agent { color: var(--accent); }
.msg.worker .worker-kind { color: var(--text-muted); font-size: 11px; }
.msg.worker .worker-task { color: var(--text-muted); font-family: var(--mono); font-size: 10px; margin-left: auto; }
.msg.worker .worker-body { white-space: pre-wrap; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--text); max-height: 40vh; overflow-y: auto; }
.msg.worker.worker-failed { border-color: var(--red); }
.msg.worker.worker-failed .worker-kind { color: var(--red); }

/* Transient status notice — e.g., "didn't catch that" when an
   utterance fails to transcribe. Quieter than worker notes and
   doesn't carry a header/badge. */
.msg.status { align-self: center; max-width: 70%; background: transparent; border: none; padding: 4px 12px; font-size: 11px; color: var(--text-muted); font-style: italic; text-align: center; margin: 4px auto; }

/* Visually hidden but accessible to screen readers and STT tools
   that read surrounding context to infer dictation style. */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* 🎯T65 quiet attention stack — prefix-first; no command buttons / focus chrome */
#attention-bar { display: none; flex-direction: row; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 20px 0 20px; background: var(--surface); border-top: 1px solid var(--border); }
#attention-bar.visible { display: flex; }
#attention-stack { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 0; flex: 1; }
.attn-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-raised); color: var(--text-dim); font-size: 11px; font-weight: 500; cursor: pointer; line-height: 1.3; }
.attn-chip:hover { border-color: var(--border-focus); color: var(--text); }
.attn-chip.active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.attn-chip.parked { opacity: 0.72; font-style: italic; }
.attn-chip.main-chip { border-style: dashed; }
.attn-chip .attn-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14rem; }
.attn-chip .attn-status { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }

/* 🎯T113 send queue strip — Grok-like, just above the composer */
#send-queue { display: none; flex-direction: column; gap: 4px; padding: 8px 20px 0 20px; background: var(--surface); border-top: 1px solid var(--border); }
#send-queue.visible { display: flex; }
.send-queue-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-raised); font-size: 12px; line-height: 1.35; color: var(--text-dim); }
.send-queue-item.focused { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
.send-queue-item .sq-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.send-queue-item .sq-actions { display: flex; gap: 4px; flex-shrink: 0; margin-left: auto; }
.send-queue-item .sq-actions button { border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); font-size: 11px; font-family: var(--sans); padding: 2px 8px; border-radius: 5px; cursor: pointer; line-height: 1.3; }
.send-queue-item .sq-actions button:hover { border-color: var(--border-focus); color: var(--text); }
.send-queue-item .sq-actions button.sq-send-now { color: var(--accent); border-color: rgba(239,68,68,0.35); }
.send-queue-item .sq-actions button.sq-send-now:hover { background: var(--accent-dim); }

/* Input bar */
#input-bar { display: flex; gap: 10px; align-items: flex-end; padding: 16px 20px calc(16px + env(safe-area-inset-bottom)) 20px; background: var(--surface); border-top: 1px solid var(--border);
  /* One-line control height, derived from the input's own metrics
     (1 line at line-height 1.45 × its 14px font, + 11px×2 padding +
     1px×2 border). The input and the send button both pin to this, so
     they are the same height by construction and can't drift apart. */
  --control-h: calc(1.45 * 14px + 24px); }
/* Textarea (not <input>) so Wispr Flow and other STT tools detect a
   document-style input and produce full punctuated sentences. */
/* 🎯T69: multi-line min height so ordinary typing does not flicker a
   one-line scrollbar; overflow hidden until near max (then internal scroll).
   Cap 28vh so growth does not eat the latest assistant reply (🎯T70.1). */
#input { flex: 1; padding: 11px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; font-family: var(--sans); outline: none; transition: border-color 0.15s; resize: none; line-height: 1.45; min-height: calc(2.9 * 1.45 * 14px + 24px); max-height: 28vh; overflow-y: hidden; }
#input.composer-scroll { overflow-y: auto; }
/* Fade the placeholder well below entered text so it's obviously a
   prompt, not typed content. Lower opacity blends it toward the input
   background — darker in dark mode, lighter in light mode. */
#input::placeholder { color: var(--text-muted); opacity: 0.45; }
#input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
#send { min-height: var(--control-h); padding: 11px 22px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; font-family: var(--sans); cursor: pointer; letter-spacing: 0.02em; transition: opacity 0.15s; }
#send:hover { opacity: 0.85; }
#send:disabled { opacity: 0.3; cursor: not-allowed; }
#voice-btn { padding: 11px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); font-size: 16px; cursor: pointer; transition: all 0.15s; line-height: 1; position: relative; }
#voice-btn:hover { border-color: var(--accent); color: var(--accent); }
#voice-btn.active { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 0 12px rgba(248,113,113,0.5); animation: pulse 1.5s ease-in-out infinite; }
#voice-btn.connecting { background: var(--amber); color: #fff; border-color: var(--amber); animation: pulse 1.5s ease-in-out infinite; cursor: wait; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 4px 0 rgba(248,113,113,0.4); } 50% { box-shadow: 0 0 12px 4px rgba(248,113,113,0.15); } }
#voice-status { display: none; align-items: center; gap: 5px; margin-left: 8px; font-size: 11px; }
#voice-status.on { display: flex; color: var(--red); }
#voice-status .voice-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: voice-blink 1s ease-in-out infinite; }
@keyframes voice-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.voice-indicator { font-size: 11px; color: var(--text-muted); padding: 4px 4px; align-self: center; font-style: italic; }
/* "Working" indicator — order:1000 keeps it visually pinned below all
   messages regardless of DOM insertion order while a turn is in flight.
   messages-end (follow sentinel) uses order:1001 so true bottom stays last. */
.working-indicator { order: 1000; align-self: flex-start; display: flex; align-items: center; gap: 7px; padding: 8px 4px; color: var(--text-muted); font-size: 13px; font-style: italic; }
#messages-end { order: 1001; }
.working-indicator .work-dots { display: inline-flex; gap: 4px; }
.working-indicator .work-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: work-bounce 1.2s ease-in-out infinite; }
.working-indicator .work-dots span:nth-child(2) { animation-delay: 0.16s; }
.working-indicator .work-dots span:nth-child(3) { animation-delay: 0.32s; }
@keyframes work-bounce { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

/* Collapsible turn details */
/* Compact tool-activity marker — it does NOT expand; its detail is shown
   as a hover tooltip. One small line, so it takes minimal vertical space. */
.turn-marker { align-self: flex-start; position: relative; font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: -0.02em; user-select: none; cursor: default; line-height: 1.2; margin: 0; }
.turn-marker:hover { color: var(--text-dim); }
.turn-tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 0; z-index: 30; min-width: 200px; max-width: 460px; max-height: 50vh; overflow-y: auto; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.35); }
.turn-marker:hover .turn-tip { display: flex; flex-direction: column; gap: 1px; }
.msg-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; padding-top: 2px; font-family: var(--mono); letter-spacing: -0.02em; user-select: none; line-height: 1; cursor: default; }
.msg.user .msg-time { text-align: right; }
/* 🎯T84: GitHub mark for compacted github.com workdirs */
.agent-dir .gh-icon { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; margin-right: 3px; opacity: 0.85; }
.agent-node .agent-dir { display: inline-flex; align-items: center; gap: 2px; }
.turn-item { font-family: var(--mono); font-size: 11px; padding: 1px 0; letter-spacing: -0.02em; white-space: pre-wrap; word-break: break-word; }
.turn-item.tool-use { color: var(--amber); }
.turn-item.tool-result { color: var(--text-dim); }

/* Right pane: agents */
#activity-pane { width: 420px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); }
#activity-header { padding: 10px 16px; font-size: 10px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.08em; }
#cost-ticker { display: none; padding: 6px 16px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); letter-spacing: -0.02em; cursor: help; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cost-ticker.cost-warn { color: var(--amber); }
#cost-ticker.cost-kill { color: #fff; background: #b3261e; font-weight: 600; }

/* Theme toggle */
#theme-toggle { margin-left: auto; display: flex; gap: 2px; background: var(--surface-raised); border-radius: 5px; padding: 2px; }
#theme-toggle button { border: none; background: none; color: var(--text-muted); font-size: 11px; padding: 2px 6px; border-radius: 3px; cursor: pointer; line-height: 1; }
#theme-toggle button:hover { color: var(--text-dim); }
#theme-toggle button.active { background: var(--accent-dim); color: var(--accent); }
#agents { flex: 1; overflow-y: auto; padding: 8px 12px; }
.agent-node { padding: 6px 8px; border-radius: 6px; margin-bottom: 1px; display: flex; align-items: center; gap: 8px; transition: background 0.1s; }
.agent-node:hover { background: var(--surface-raised); }
.agent-node .agent-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.agent-node .agent-dot.running { background: var(--green); box-shadow: 0 0 4px var(--agent-dot-glow); }
.agent-node .agent-dot.stopped { background: var(--text-muted); }
.agent-node .agent-name { color: var(--text); font-size: 13px; font-weight: 500; }
.agent-node .agent-dir { color: var(--text-muted); font-size: 10px; margin-left: auto; font-family: var(--mono); letter-spacing: -0.02em; }

   Keep nodes selectable for future use without opening black chrome. */

<body>
<div id="status"><span class="dot off" id="dot"></span><span id="status-text">connecting</span><span id="voice-status"><span class="voice-dot"></span><span id="voice-status-text">listening</span></span><div id="theme-toggle"><button data-t="light" title="Light">&#9788;</button><button data-t="system" title="System" class="active">&#9680;</button><button data-t="dark" title="Dark">&#9790;</button></div></div>
<div id="main">
  <div id="chat-pane">
    <div id="messages"></div>
    <div id="attention-bar" aria-label="Attention threads">
      <div id="attention-stack" role="list"></div>
    </div>

      <textarea id="input" name="prompt" rows="1"
                placeholder="Write a message to Jevons. Enter to send, Ctrl+Enter to interject, Shift+Enter for a new line."
                aria-label="Compose a message for Jevons"
                aria-multiline="true"
                aria-describedby="input-hint"
                autocomplete="off"
                spellcheck="true"
                autocapitalize="sentences"></textarea>
      <span id="input-hint" class="sr-only">Type a prompt for the Jevons assistant. Use full sentences with punctuation.</span>

    </div>
  </div>

    <div id="activity-header">Agents</div>
    <div id="agents"></div>

  </div>
</div>

<script>
// 🎯T110.1 layout probe — packs grade via window.JevonsProbe.snapshot().
if (typeof LayoutProbe !== 'undefined') LayoutProbe.bind(window);
</script>
<script>
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dot = document.getElementById('dot');
const sTxt = document.getElementById('status-text');
const agentsEl = document.getElementById('agents');
const attentionBar = document.getElementById('attention-bar');
const attentionStackEl = document.getElementById('attention-stack');
const MAIN_PLACEHOLDER = 'Write a message to Jevons. Enter to send, Ctrl+Enter to interject, Shift+Enter for a new line.';

// 🎯T65 attention threads — prefix-first (docs/design/attention-threads.md).
// Commands: aside: | capture: | park: | main: | pursue:  (case-insensitive)
// Focus chrome is the composer placeholder when on a side thread — no "Focus:" label.
let attentionState = (typeof AttentionThreads !== 'undefined')
  ? AttentionThreads.load(window.localStorage)
  : null;
let mainDraftBackup = '';

function persistAttention() {
  if (!attentionState || typeof AttentionThreads === 'undefined') return;
  AttentionThreads.save(window.localStorage, attentionState);
}

function updateComposerPlaceholder() {
  if (!input) return;
  if (typeof AttentionThreads === 'undefined' || !attentionState) {
    input.placeholder = MAIN_PLACEHOLDER;
    return;
  }
  // Side: "[aside: short-title] Write a message to Jevons"; main: clean (no [main]).
  input.placeholder = AttentionThreads.composerPlaceholder(attentionState, MAIN_PLACEHOLDER);
}

function renderAttention() {
  if (!attentionState || typeof AttentionThreads === 'undefined') return;
  const stack = AttentionThreads.stack(attentionState);
  const onMain = AttentionThreads.isMainFocus(attentionState);
  // Quiet: only show when there is something to show (stack or non-main focus).
  const show = stack.length > 0 || !onMain;
  attentionBar.classList.toggle('visible', show);
  updateComposerPlaceholder();

  attentionStackEl.innerHTML = '';
  if (!show) return;

  // Main chip when not on main — click returns focus (same as main:).
  if (!onMain) {
    const mainChip = document.createElement('div');
    mainChip.className = 'attn-chip main-chip';
    mainChip.setAttribute('role', 'listitem');
    mainChip.title = 'Return to main thread (or type main:)';
    const mt = document.createElement('span');
    mt.className = 'attn-title';
    mt.textContent = 'Main';
    mainChip.appendChild(mt);
    mainChip.addEventListener('click', () => {
      attentionState = AttentionThreads.updateActiveBody(attentionState, input.value);
      attentionState = AttentionThreads.focusMain(attentionState);
      input.value = mainDraftBackup || '';
      autoGrow();
      persistAttention();
      renderAttention();
      input.focus();
    });
    attentionStackEl.appendChild(mainChip);
  }

  for (const t of stack) {
    const chip = document.createElement('div');
    chip.className = 'attn-chip' +
      (t.status === 'parked' ? ' parked' : '') +
      (attentionState.focusId === t.id ? ' active' : '');
    chip.setAttribute('role', 'listitem');
    chip.title = t.body || t.title;
    const title = document.createElement('span');
    title.className = 'attn-title';
    title.textContent = t.title;
    chip.appendChild(title);
    const st = document.createElement('span');
    st.className = 'attn-status';
    st.textContent = t.status;
    chip.appendChild(st);
    chip.addEventListener('click', () => {
      if (AttentionThreads.isMainFocus(attentionState)) mainDraftBackup = input.value;
      else attentionState = AttentionThreads.updateActiveBody(attentionState, input.value);
      attentionState = AttentionThreads.pursue(attentionState, t.id);
      const th = AttentionThreads.findThread(attentionState, t.id);
      if (th) { input.value = th.body || ''; autoGrow(); }
      persistAttention();
      renderAttention();
      input.focus();
    });
    attentionStackEl.appendChild(chip);
  }
}

let turnDetails = null;
let turnItems = null;
let turnCount = 0;

// Wire transport callbacks.
transport.onOpen = () => {
  const v = input.value;
  dot.className = 'dot on'; sTxt.textContent = 'connected'; sendBtn.disabled = false;
  msgs.innerHTML = ''; turnDetails = null; turnItems = null; turnCount = 0; workingEl = null;
  msgHistory = []; histIdx = null; histDraft = ''; editingEl = null;
  input.value = v;
};
transport.onClose = () => {
  // Transport handles reconnect (backoff + version check) internally.
  dot.className = 'dot off'; sTxt.textContent = 'reconnecting'; sendBtn.disabled = true;
  // Clear chrome only — do not auto-drain the send queue while offline (🎯T113).
  setWorking(false, undefined, { skipDrain: true });
};
transport.onMessage = m => handle(m);
transport.onError = msg => console.error('transport error:', msg);

function connect() { transport.connect(); }

function handle(m) {
  const typ = m.type;

  // Recent turns were replayed; older history stays in the durable log.
  // Show a "Load earlier" affordance that pages it in on demand (🎯T57).
  if (typ === 'history_meta') {
    oldestIndex = m.start || 0;
    if ((m.older || 0) > 0) setupInfiniteScroll();
    return;
  }

  // 🎯T82: registry file changed — refresh RHS fleet immediately (poll is fallback).
  if (typ === 'agents_changed') {
    refreshAgents();
    return;
  }

  // Server rewound the conversation N user turns — trim the view to
  // match: remove the Nth-from-last user message and everything after it.
  // The resent (edited) message then re-arrives as a fresh turn.
  if (typ === 'rewound') {
    const users = [...msgs.querySelectorAll('.msg.user')];
    const n = m.turns || 0;
    if (n > 0 && users.length >= n) {
      closeTurn();
      let node = users[users.length - n];
      while (node) { const next = node.nextSibling; node.remove(); node = next; }
      msgHistory = msgHistory.slice(0, Math.max(0, msgHistory.length - n));
      setEditingHighlight(null);
    }
    return;
  }

  const msgTs = m.timestamp ? new Date(m.timestamp).getTime() : Date.now();

  if (typ==='agent_note') {
    // Injected agent/system notification (worker reply, budget alert). The
    // owner never sees these as chat bubbles — the overseer decides what to
    // relay. Fold into the turn's activity strip only (🎯T63).
    addTurnItem('agent-note', formatAgentNote(m.text || ''));
    return;
  }

  if (typ==='user') {
    const content = m.message?.content;
    if (typeof content === 'string') {
      // Server synthesises a user echo on send; Grok ACP may also
      // publish user_message_chunk for the same prompt. Drop the dupe.
      if (content && msgHistory[msgHistory.length - 1]?.text === content) return;
      closeTurn();
      const uEl = addMsg('user', content, msgTs);
      if (content) msgHistory.push({ text: content, el: uEl });
      startTurn();
    } else if (Array.isArray(content)) {
      content.forEach(c => {
        if (c.type==='tool_result') {
          const inner = c.content;
          if (typeof inner === 'string') addTurnItem('tool-result', truncate(inner, 120));
          else if (Array.isArray(inner)) inner.forEach(ic => {
            if (ic.type==='text' && ic.text) addTurnItem('tool-result', truncate(ic.text, 120));
          });
        }
      });
    }
  } else if (typ==='assistant') {
    const content = m.message?.content;
    if (!Array.isArray(content)) return;
    const hasText = ChatEvents.hasAssistantText(m);
    content.forEach(c => {
      if (c.type==='tool_use') {
        addTurnItem('tool-use', c.name + (c.input ? ': ' + summariseInput(c.input) : ''));
      }
    });
    if (hasText) {
      closeTurn();
      ChatEvents.assistantTextBlocks(m).forEach(c => appendOrAddJevons(c.text, msgTs));
      input.focus();
    }
    // Only terminal stops clear working (not mid-stream text). Clearing
    // early used to force one bubble per token.
    if (ChatEvents.shouldClearWorking(m)) {
      sealAssistantStream();
      setWorking(false);
    }
  } else if (typ==='tool_result' || typ==='result') {
    const content = m.content || m.message?.content;
    if (Array.isArray(content)) {
      content.forEach(c => {
        if (c.type==='text' && c.text) addTurnItem('tool-result', truncate(c.text, 120));
      });
    } else if (typeof content === 'string') {
      addTurnItem('tool-result', truncate(content, 120));
    }
  } else if (typ==='system') {
    closeTurn();
    if (ChatEvents.shouldClearWorking(m)) {
      sealAssistantStream();
      setWorking(false);
    }
  }
}

// Skip non-message chrome at the tail of #messages (working indicator,
// follow-scroll end sentinel, turn markers) when locating the open stream.
function lastMessageish() {
  let el = msgs.lastElementChild;
  while (el && !(el.classList && el.classList.contains('msg'))) {
    el = el.previousElementSibling;
  }
  return el;
}

// appendOrAddJevons merges streaming assistant chunks into the open
// jevons bubble. Merge is keyed on _streamRaw (not workingEl): sealing
// happens only on terminal stop so a mistaken early clear cannot split
// the turn into one bubble per token.
function appendOrAddJevons(text, ts) {
  const target = lastMessageish();
  if (target && target.classList.contains('jevons') && typeof target._streamRaw === 'string') {
    target._streamRaw += text;
    scheduleJevonsRender(target);   // rAF-debounced: coalesce burst chunks into ONE parse (🎯T57)
    return;
  }
  const el = addMsg('jevons', text, ts);
  el._streamRaw = text;
}

// scheduleJevonsRender coalesces streamed chunks: instead of re-parsing
// the growing markdown on every delta (O(n²) on replay of a turn that
// streamed as many frames), it re-renders at most once per animation
// frame from the accumulated _streamRaw (🎯T57).
function scheduleJevonsRender(el) {
  if (el._renderRaf) return;
  el._renderRaf = requestAnimationFrame(() => {
    el._renderRaf = 0;
    el._layoutText = el._streamRaw;
    el._layoutRole = 'jevons';
    renderBody(el, 'jevons', el._streamRaw);
    // Streaming text is real progress — reset T94 idle stuck clock.
    if (workingEl) armWorkingWatch();
    // T66: stream may start short then measure tall while still latest —
    // re-evaluate auto-expand so the sealed reply is not stuck collapsed.
    scheduleLatestExpansion();
    // Force layout then pin immediately (not only coalesced rAF) so each
    // incremental paint's true scrollHeight is what stick-to-bottom uses.
    if (isTracking()) {
      void (el._body && el._body.offsetHeight);
      scrollDown();
    }
  });
}

// sealAssistantStream closes the open coalesced bubble so the next
// turn starts a new one — flushing any pending debounced render first.
function sealAssistantStream() {
  const el = lastMessageish();
  if (el && typeof el._streamRaw === 'string') {
    if (el._renderRaf) { cancelAnimationFrame(el._renderRaf); el._renderRaf = 0; }
    const raw = el._streamRaw;
    delete el._streamRaw;                       // clear first so the sealed
    el._layoutText = raw;                       // render draws mermaid (🎯T59)
    el._layoutRole = 'jevons';
    // Stay expanded through seal so measure/paint never flashes a preview
    // into the live latest bubble (would freeze follow at a mid offset).
    el._expanded = true;
    el._autoExpanded = true;
    renderBody(el, 'jevons', raw);
    unwatchStreamBubble(el);
    scheduleLatestExpansion();
  }
  // Final layout (markdown / mermaid / highlight) often grows after the
  // last stream pin — re-follow so the user never needs a manual nudge.
  if (isTracking()) {
    void msgs.offsetHeight;
    scrollDown();
  }
}

function startTurn() {
  // A compact, non-expanding marker: a one-line label whose tool detail
  // lives in a .turn-tip that only appears on hover.
  turnDetails = document.createElement('div');
  turnDetails.className = 'turn-marker';
  const label = document.createElement('span');
  turnDetails.appendChild(label);
  turnItems = document.createElement('div');
  turnItems.className = 'turn-tip';
  turnDetails.appendChild(turnItems);
  turnDetails._label = label;
  msgs.appendChild(turnDetails);
  turnCount++;
  scrollDownThrottled();
}

function closeTurn() {
  if (!turnDetails) return;
  const n = turnItems ? turnItems.children.length : 0;
  if (n === 0) turnDetails.remove(); // no tool activity → nothing to show
  // else: leave the compact marker in place; hover reveals the detail.
  turnDetails = null;
  turnItems = null;
}

// formatAgentNote renders an injected notification as a compact activity
// line: "[Agent jevons-po responded]\nPONG" → "jevons-po → PONG". Falls
// back to a trimmed one-liner for other notes (e.g. budget alerts).
function formatAgentNote(text) {
  const m = text.match(/^\[Agent (.+?) responded\]\s*([\s\S]*)$/);
  if (m) return m[1] + ' → ' + truncate(m[2].replace(/\s+/g, ' ').trim(), 80);
  return truncate(text.replace(/\s+/g, ' ').trim(), 100);
}

function addTurnItem(cls, text) {
  if (!turnItems) startTurn();
  const d = document.createElement('div');
  d.className = 'turn-item ' + cls;
  d.textContent = text;
  turnItems.appendChild(d);
  const n = turnItems.children.length;
  turnDetails._label.textContent = '⋯ ' + n + (n === 1 ? ' step' : ' steps');
  // 🎯T71: mid-turn tool activity is the best ACP-available progress signal.
  if (cls === 'tool-use' || cls === 'tool-result') {
    const short = truncate(String(text || '').replace(/\s+/g, ' ').trim(), 48);
    updateWorkingProgress(n + (n === 1 ? ' step' : ' steps') + (short ? ' · ' + short : ''));
  }
  scrollDownThrottled();
}

// buildMsg constructs a .msg element (body + timestamp) WITHOUT inserting
// it, so it can be appended live or batched into a fragment for "load
// earlier" prepend (🎯T57). Height-based collapse requires the node to be
// in the document — call layoutMsg after attach (offsetHeight is 0 in a
// detached fragment).
function buildMsg(role, text, when) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const body = document.createElement('div');
  body.className = 'msg-body';
  d.appendChild(body);
  d._body = body;
  d._layoutRole = role;
  d._layoutText = text == null ? '' : text;
  // Provisional full paint (no collapse gate) so something shows if layout
  // is deferred; layoutMsg remeasures once connected.
  paintBody(d, role, d._layoutText);
  const ms = when || Date.now();
  const ts = document.createElement('div');
  ts.className = 'msg-time';
  ts.dataset.ts = String(ms);
  ts.textContent = relTime(ms);
  // 🎯T91: absolute local time on hover; relative label stays in chrome.
  ts.title = absTimeTitle(ms);
  d.appendChild(ts);
  return d;
}
function absTimeTitle(ms) {
  try {
    return new Date(ms).toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
  } catch (_) {
    return String(ms);
  }
}

// layoutMsg runs height-ratio collapse once the message is in #messages.
function layoutMsg(d) {
  if (!d || !d.isConnected || d._layoutText == null) return;
  renderBody(d, d._layoutRole || 'jevons', d._layoutText);
}

function layoutMsgList(nodes) {
  for (const d of nodes) layoutMsg(d);
}

function addMsg(role, text, when) {
  const d = buildMsg(role, text, when);
  msgs.appendChild(d);
  layoutMsg(d);
  scheduleLatestExpansion();
  scrollDownThrottled();
  return d;
}

// Bounded rendering (🎯T57): tall content gets a PREVIEW + Show more;
// short content renders in full with no toggle. "Tall" is measured after
// layout: full rendered height must be more than COLLAPSE_HEIGHT_RATIO
// times the collapsed-preview height (not char/line proxies — tables
// and markdown can look huge with few characters).
// T66: the latest user request and latest assistant reply stay expanded
// even when tall; T77 collapses prior auto-expanded messages when they
// cease to be latest (unless the user toggled manually).
// Request (user) previews use fewer lines — context to glance at.
const PREVIEW_LINES = 14;
const USER_PREVIEW_LINES = 7;
// Collapse when full height > collapsed height × this ratio (50% taller).
const COLLAPSE_HEIGHT_RATIO = 1.5;
// Cap for preview text when building the collapsed sample (not the
// tallness gate — that is pure rendered height).
const PREVIEW_CHAR_CAP = 4000;

function previewOf(text, maxLines) {
  const lines = text.split('\n');
  let out = lines.length > maxLines ? lines.slice(0, maxLines).join('\n') : text;
  if (out.length > PREVIEW_CHAR_CAP) out = out.slice(0, PREVIEW_CHAR_CAP);
  return out;
}

// Measure whether full render is tall enough to warrant collapse.
// Full height is measured on an off-DOM-width probe so we never paint
// preview into the live body as an intermediate step (that thrash was the
// root of stick-to-bottom freezing mid-stream / mid-seal — 🎯T30.2).
// Returns { tall, fullH, collapsedH, preview }. Does NOT leave d painted.
function measureCollapse(d, role, text) {
  const maxLines = (role === 'user') ? USER_PREVIEW_LINES : PREVIEW_LINES;
  const preview = previewOf(text, maxLines);
  if (preview === text) {
    return { tall: false, fullH: 0, collapsedH: 0, preview };
  }
  const width = (d._body && d._body.clientWidth) || d.clientWidth || 0;
  // Probe shares .msg / role classes so markdown CSS applies; absolute so
  // it cannot change #messages.scrollHeight while we measure.
  const probe = document.createElement('div');
  probe.className = d.className;
  probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;left:0;top:0;width:' +
    (width > 0 ? width + 'px' : '100%') + ';max-width:85%;';
  const probeBody = document.createElement('div');
  probeBody.className = 'msg-body';
  probe.appendChild(probeBody);
  // Attach under #messages so CSS variables / inheritance match live bubbles.
  msgs.appendChild(probe);
  // Inline the paint for probe (avoid mutating d._body).
  if (role === 'jevons') {
    probeBody.innerHTML = marked.parse(text);
  } else if (role === 'user') {
    probeBody.innerHTML = renderUserText(text);
  } else {
    probeBody.textContent = text;
  }
  const fullH = probeBody.offsetHeight || 0;
  if (role === 'jevons') {
    probeBody.innerHTML = marked.parse(preview);
  } else if (role === 'user') {
    probeBody.innerHTML = renderUserText(preview);
  } else {
    probeBody.textContent = preview;
  }
  const collapsedH = probeBody.offsetHeight || 0;
  probe.remove();
  // Avoid divide-by-zero / zero-layout (hidden tab): treat as not tall.
  if (collapsedH <= 0 || fullH <= 0) {
    return { tall: false, fullH, collapsedH, preview };
  }
  const tall = fullH > collapsedH * COLLAPSE_HEIGHT_RATIO;
  return { tall, fullH, collapsedH, preview };
}
// Mermaid diagrams (🎯T59): assistant markdown may carry ```mermaid
// fences, which marked emits as <pre><code class="language-mermaid">. We
// swap each rendered SVG in place. Gated by paintBody to sealed content
// (see the _streamRaw check) so a half-streamed diagram never flashes a
// parse error. Invalid source is left as its original code block. Mermaid
// is initialized lazily so its theme matches the UI theme at first use.
let mermaidReady = false;
let mermaidSeq = 0;
function ensureMermaid() {
  if (!window.mermaid) return null;
  if (!mermaidReady) {
    const dark = document.documentElement.getAttribute('data-theme') !== 'light';
    // suppressErrorRendering keeps mermaid from injecting its "Syntax error"
    // bomb graphic into the page when an agent emits an invalid diagram — we
    // degrade to the raw code block instead (🎯T59).
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', suppressErrorRendering: true, theme: dark ? 'dark' : 'default' });
    mermaidReady = true;
  }
  return window.mermaid;
}
function renderMermaidIn(container) {
  if (!container || !ensureMermaid()) return;
  container.querySelectorAll('code.language-mermaid').forEach(code => {
    const host = code.closest('pre') || code;
    const src = code.textContent;
    const id = 'mmd-' + (++mermaidSeq);
    Promise.resolve().then(() => mermaid.render(id, src)).then(({ svg }) => {
      const wrap = document.createElement('div');
      wrap.className = 'mermaid-diagram';
      wrap.innerHTML = svg;
      if (host.parentNode) host.replaceWith(wrap);
      scrollDownThrottled(); // async SVG height growth (🎯T30.2 / 🎯T59)
    }).catch(() => {
      // Invalid diagram — leave the code block; sweep any temp render node
      // mermaid may have appended to <body> (id or 'd'+id).
      [id, 'd' + id].forEach(x => { const n = document.getElementById(x); if (n) n.remove(); });
    });
  });
}
function paintBody(d, role, t) {
  if (role === 'jevons') {
    d._body.innerHTML = marked.parse(t);
    if (!d._streamRaw) {
      renderMermaidIn(d._body);   // sealed content only
      highlightCodeIn(d._body);   // 🎯T74
    }
    // 🎯T95: auto-close target: filing aside when overseer confirms 🎯 id.
    maybeCloseTargetAside(t);
  } else if (role === 'user') {
    // 🎯T75: quote notation as blockquotes; 🎯T76: [image: id] → <img>.
    d._body.innerHTML = renderUserText(t);
  } else {
    d._body.textContent = t;
  }
}
function maybeCloseTargetAside(text) {
  if (typeof AttentionThreads === 'undefined' || !attentionState) return;
  const id = AttentionThreads.detectTargetFiled(text);
  if (!id) return;
  attentionState = AttentionThreads.closeTargetAside(attentionState);
  persistAttention();
  if (typeof renderAttention === 'function') renderAttention();
}
// User bubbles: preserve plain text, promote lines of `> quote` to <blockquote>,
// and render 🎯T76 [image: <id>] markers as inline images.
function renderUserText(t) {
  const s = String(t == null ? '' : t);
  if (/\[image:\s*[a-f0-9]+\]/i.test(s)) return renderUserTextWithImages(s);
  return renderUserTextQuotes(s);
}
function renderUserTextWithImages(s) {
  const re = /\[image:\s*([a-f0-9]+)\]/gi;
  let html = '';

function renderComposerImages() {
  if (!composerImagesEl) return;
  composerImagesEl.innerHTML = '';
  pendingImages.forEach((img, idx) => {
    const chip = document.createElement('div');
    chip.className = 'img-chip';
    const el = document.createElement('img');
    el.src = img.objectUrl || img.url;
    el.alt = 'attachment ' + img.id;
    chip.appendChild(el);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '×';
    btn.title = 'Remove';
    btn.addEventListener('click', () => {
      if (img.objectUrl) try { URL.revokeObjectURL(img.objectUrl); } catch (_) {}
      pendingImages.splice(idx, 1);
      renderComposerImages();
    });
    chip.appendChild(btn);
    composerImagesEl.appendChild(chip);
  });
}
async function uploadPastedImage(file) {
  const fd = new FormData();
  fd.append('file', file, file.name || 'paste.png');
  const res = await fetch('/api/images', { method: 'POST', body: fd });
  if (!res.ok) throw new Error('upload ' + res.status);
  return res.json();
}
input.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (items) {
    const images = [];
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        const f = items[i].getAsFile();
        if (f) images.push(f);
      }
    }
    if (images.length) {
      e.preventDefault();
      images.forEach(async (file) => {
        try {
          const objectUrl = URL.createObjectURL(file);
          const meta = await uploadPastedImage(file);
          pendingImages.push({ id: meta.id, url: meta.url, objectUrl: objectUrl, marker: meta.marker });
          renderComposerImages();
        } catch (err) {
          console.error('image paste upload failed', err);
          if (typeof addStatusMsg === 'function') addStatusMsg('Image paste failed');
        }
      });
      return;
    }
  }
  const clip = (e.clipboardData && e.clipboardData.getData('text')) || '';
  if (!clip) return;
  // Only tidy when replacing empty/all or inserting into empty field.
  const start = input.selectionStart, end = input.selectionEnd;
  const cur = input.value;
  const isBulkEmpty = cur.length === 0 || (start === 0 && end === cur.length);
  if (!isBulkEmpty) return;
  const tidy = tidyDictationInsert(clip);
  if (tidy === clip) return;
  e.preventDefault();
  input.value = tidy;
  input.selectionStart = input.selectionEnd = tidy.length;
  autoGrow();
  input.dispatchEvent(new Event('input', { bubbles: true }));
});
function tidyDictationInsert(s) {
  let t = String(s).replace(/^\s+|\s+$/g, '');
  if (!t) return t;
  // Already multi-sentence / punctuated — leave alone.
  if (/[.?!]/.test(t) && t !== t.toLowerCase()) return t;
  if (/^[a-z]/.test(t)) t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.?!]$/.test(t)) t += '.';
  return t;
}
sendBtn.addEventListener('click', send);
if (typeof renderAttention === 'function') renderAttention();
// Keep focus in the textarea when clicking toolbar buttons: preventing
// the mousedown default blocks the focus shift while still firing click.
sendBtn.addEventListener('mousedown', e => e.preventDefault());

autoGrow();
input.focus();
connect();

// On first load the server replays history as a burst of messages and
// layout settles asynchronously, which can leave the view slightly above
// the true bottom — so a freshly-typed message wouldn't scroll into view.
// Stay in Track and pin over the first second so we start at the latest.
enterTrackBottom();
[0, 100, 250, 500, 1000].forEach(d => setTimeout(() => {
  if (isTracking()) scrollDown();
}, d));

document.addEventListener('keydown', e => {
  if (e.key === 'PageUp') {
    e.preventDefault();
    leaveTrackBottom();
    msgs.scrollBy(0, -msgs.clientHeight * 0.8);
    return;
  }
  if (e.key === 'PageDown') {
    e.preventDefault();
    msgs.scrollBy(0, msgs.clientHeight * 0.8);
    requestAnimationFrame(() => { tryEnterFromGeometry(); });
    return;
  }
  // Esc interrupts Jevons's current turn (like the Claude Code TUI).
  if (e.key === 'Escape') {
    // 🎯T88: clear history-edit mode so next Enter is safe append.
    if (editingEl) { setEditingHighlight(null); histIdx = null; histDraft = ''; }
    transport.send('{"type":"interrupt"}');
    setWorking(false);
  }
});

// Theme toggle.
function applyTheme(pref) {
  const html = document.documentElement;
  if (pref === 'system') {
    html.removeAttribute('data-theme');
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    html.setAttribute('data-theme', mq.matches ? 'light' : 'dark');
    mq.onchange = e => { if (localStorage.getItem('theme')==='system') html.setAttribute('data-theme', e.matches?'light':'dark'); };
  } else {
    html.setAttribute('data-theme', pref);
  }
  document.querySelectorAll('#theme-toggle button').forEach(b => b.classList.toggle('active', b.dataset.t===pref));
}
document.getElementById('theme-toggle').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.cookie = 'theme='+btn.dataset.t+';path=/;max-age=31536000';
  applyTheme(btn.dataset.t);
});
// Don't let the theme buttons steal focus from the textarea.
document.getElementById('theme-toggle').addEventListener('mousedown', e => e.preventDefault());
applyTheme((document.cookie.match(/(?:^|; )theme=([^;]*)/)||[])[1] || 'system');

// Terminal viewer.
const termHeader = document.getElementById('terminal-header');
const termContainer = document.getElementById('terminal-container');
let term = null;
let termWs = null;
let termFit = null;
let selectedAgent = null;

// 🎯T73: selection only — do not open the obsolete black TMUX/detail panel.
function selectAgent(name) {
  if (selectedAgent === name) {
    selectedAgent = null;
    document.querySelectorAll('.agent-node').forEach(n => n.classList.remove('selected'));
    return;
  }
  selectedAgent = name;
  document.querySelectorAll('.agent-node').forEach(n => n.classList.toggle('selected', n.dataset.agent === name));
}

function openTerminal(name) {
  closeTerminal();
  termHeader.textContent = name;
  termHeader.style.display = 'block';
  termContainer.style.display = 'block';

  term = new Terminal({
    fontFamily: 'JetBrains Mono, SF Mono, Menlo, monospace',
    fontSize: 12,
    theme: {
      background: '#0c0c0f',
      foreground: '#d4d4dc',
      cursor: '#8b7cf6',
      selectionBackground: 'rgba(139,124,246,0.3)',
    },
    scrollback: 10000,
    convertEol: true,
  });
  termFit = new FitAddon.FitAddon();
  term.loadAddon(termFit);
  term.open(termContainer);
  termFit.fit();

  const h = location.hostname === 'localhost' ? '127.0.0.1:'+location.port : location.host;
  const cols = term.cols;
  const rows = term.rows;
  termWs = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+h+'/ws/agent-terminal?name='+encodeURIComponent(name)+'&cols='+cols+'&rows='+rows);
  termWs.binaryType = 'arraybuffer';
  termWs.onmessage = e => {
    if (e.data instanceof ArrayBuffer) {
      term.write(new Uint8Array(e.data));
    } else {
      term.write(e.data);
    }
  };
  termWs.onclose = () => { /* terminal closed */ };

  // Handle resize.
  const ro = new ResizeObserver(() => {
    if (termFit) {
      termFit.fit();
      if (termWs && termWs.readyState === 1) {
        termWs.send(JSON.stringify({type:'resize', cols:term.cols, rows:term.rows}));
      }
    }
  });
  ro.observe(termContainer);
  termContainer._ro = ro;
}

function closeTerminal() {
  selectedAgent = null;
  if (termWs) { termWs.close(); termWs = null; }
  if (term) { term.dispose(); term = null; }
  if (termContainer._ro) { termContainer._ro.disconnect(); termContainer._ro = null; }
  termHeader.style.display = 'none';
  termContainer.style.display = 'none';
  termContainer.innerHTML = '';
  document.querySelectorAll('.agent-node').forEach(n => n.classList.remove('selected'));
}

// Preserve input across hot reloads.
const savedInput = sessionStorage.getItem('jevons-input');
if (savedInput) { input.value = savedInput; sessionStorage.removeItem('jevons-input'); }

// Voice UI — uses transport abstraction for both browser and native modes.
const voiceBtn = document.getElementById('voice-btn');
const voiceStatus = document.getElementById('voice-status');
const voiceStatusText = document.getElementById('voice-status-text');
let voiceActive = false;

// Built-in voice/mic removed from the web UI — dictation is done via
// Wispr Flow into the text field. The voice machinery below is left
// dormant (never engaged) rather than ripped out. Guard the (now
// absent) button so the rest of the script still loads.
voiceBtn?.addEventListener('click', () => {
  if (voiceActive) stopVoice(); else startVoice();
});

// Push-to-talk via Ctrl. Hold Control to engage voice, release to stop.
// If any other key is pressed while Ctrl is down, treat it as a Ctrl+X
// shortcut and cancel voice (so Ctrl+C / Ctrl+R / etc. still work).
// PTT model: voiceActive means "the WS to the server is open". pttActive
// means "Ctrl is currently held — actively recording". The WS persists
// across press/release cycles so the Grok session can stay alive between
// utterances (commit on release, response streams back over the same WS).
//
// Ctrl is the engagement key, but the user has system hotkeys that
// include Ctrl as a modifier (screenshots, etc.). To avoid engaging the
// mic the moment Ctrl goes down during one of those chords, we arm a
// short timer on Ctrl keydown and only engage when Ctrl has been held
// ALONE for pttArmDelayMs. Any other key arriving in that window
// cancels the arm, so Ctrl-Shift-3 etc. never fires the mic.
// 250ms is long enough to cover most multi-key system hotkeys
// (Ctrl→Shift→key chord sequences) without feeling sluggish for
// deliberate PTT presses, where the user is naturally holding the
// key down for >>250ms.
const pttArmDelayMs = 250;
let pttActive = false;
let pttArmTimer = null;

// Track every non-Ctrl key currently held so we can detect chords where
// some other key was pressed BEFORE Ctrl (simultaneous chord presses
// can land in any order; the previous logic only handled Ctrl-first).
const pttHeldKeys = new Set();

function pttArm() {
  return; // Ctrl push-to-talk disabled — using Wispr Flow, not the built-in mic.
  if (pttArmTimer || pttActive) return;
  pttArmTimer = setTimeout(() => {
    pttArmTimer = null;
    pttEngage();
  }, pttArmDelayMs);
}

function pttCancelArm() {
  if (pttArmTimer) {
    clearTimeout(pttArmTimer);
    pttArmTimer = null;
  }
}

function pttEngage() {
  if (!voiceActive) startVoice(); // lazy-open on first engage
  pttActive = true;
  transport.startMic();
  vadReset();
  voiceBtn.classList.add('active');
  voiceBtn.style.boxShadow = '0 0 4px rgba(248,113,113,0.3)';
  voiceStatusText.textContent = 'listening';
  jLog('info', 'ptt engage', {
    voiceActive,
    audioCtxState: transport._audioCtx?.state,
    mediaStreamActive: transport._mediaStream?.active,
    voiceWsState: transport.voiceWs?.readyState,
  });
}

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key !== 'Control') pttHeldKeys.add(e.code);

  if (e.key === 'Control') {
    // Refuse to arm if anything else is already held — chord, not PTT.
    // Covers BOTH orderings: Ctrl-after-X (pttHeldKeys non-empty) and
    // Ctrl-with-modifier (e.shiftKey/altKey/metaKey already set, which
    // can happen even if the modifier keydown wasn't observed yet on
    // this listener — the underlying state is current).
    if (pttHeldKeys.size > 0 || e.shiftKey || e.altKey || e.metaKey) {
      console.debug('[ptt] arm suppressed — other key/modifier held');
      return;
    }
    pttArm();
  } else {
    // Any other keydown while we are armed or active → chord.
    pttCancelArm();
    if (pttActive && (e.ctrlKey || e.metaKey)) pttRelease();
  }
});
window.addEventListener('keyup', e => {
  if (e.key !== 'Control') pttHeldKeys.delete(e.code);
  if (e.key === 'Control') {
    pttCancelArm(); // brief Ctrl tap (< arm delay) → never engaged
    if (pttActive) pttRelease();
  }
});
// Window-blur, tab-switch, visibility loss: stop recording even if we
// missed the keyup (focus changes can swallow it). Force-kill the mic
// regardless of pttActive's state so the OS indicator can never hang
// stale. Also clear the held-keys Set — a key whose keyup we missed
// during a focus shift would otherwise stay "held" forever.
window.addEventListener('blur', () => {
  pttHeldKeys.clear();
  if (pttActive) pttRelease();
  transport.stopMic();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    pttHeldKeys.clear();
    if (pttActive) pttRelease();
    transport.stopMic();
  }
});

function pttRelease() {
  pttActive = false;
  voiceBtn.classList.remove('active');
  voiceBtn.style.boxShadow = '';
  const audioCtxState = transport._audioCtx?.state;
  const voiceWsState = transport.voiceWs?.readyState;
  const stats = {
    framesSeen: vad.framesSeen,
    framesSent: vad.framesSent,
    peakRms:    vad.peakRms,
    noiseFloor: vad.noiseFloor,
    audioCtxState, voiceWsState,
  };
  if (vad.heardSpeech) {
    voiceStatusText.textContent = 'processing';
    transport.commitVoice();
    jLog('info', 'ptt release / commit', stats);
  } else {
    voiceStatusText.textContent = 'listening';
    transport.clearVoice();
    jLog('info', 'ptt release / clear (no speech)', stats);
  }
}

function startVoice() {
  voiceBtn.classList.add('connecting');
  voiceActive = true;
  transport.startVoice();
}

function stopVoice() {
  voiceActive = false;
  pttActive = false;
  voiceBtn.classList.remove('active', 'connecting');
  voiceStatus.classList.remove('on');
  voiceBtn.style.boxShadow = '';
  transport.stopVoice();
}

// Transport's voice WS closed unexpectedly (most commonly: server-side
// 30 s idle timeout). Reset the page-level state so the next PTT press
// triggers a fresh startVoice() — without this, voiceActive stays true,
// startVoice is skipped, and the next utterance's audio + commit are
// silently dropped over a dead WS.
transport.onVoiceClose = () => {
  jLog?.('info', 'voice WS closed — resetting page state');
  // Don't call pttRelease — its commitVoice() would no-op against a
  // dead WS and the UI state would land in 'processing' instead of
  // back at 'idle'. Just inline the cleanup.
  pttCancelArm();
  pttActive = false;
  voiceActive = false;
  voiceBtn.classList.remove('active', 'connecting');
  voiceBtn.style.boxShadow = '';
  voiceStatus.classList.remove('on');
  voiceStatusText.textContent = 'listening';
};

// Local VAD — gate the audio stream to Grok so silence between turns
// or mid-pause "I changed my mind" releases don't deliver an empty
// buffer that Grok dutifully responds to.
//
// Design constraints (learned the hard way):
//   - holdMs must be long enough to span a normal mid-sentence pause
//     (~2-3 seconds), or VAD chops mid-utterance and Grok hears two
//     fragments instead of one. We pick 2500ms.
//   - preBuffer captures the few frames before VAD onset, otherwise
//     soft openings ("uh, can you...") lose their leading consonants.
//   - onset/offset use hysteresis (different ratios) so a single
//     loud blip doesn't briefly start/stop the stream.
//
// State is per-engagement: reset in pttEngage so VAD's noise floor
// learns from the current room rather than yesterday's session.
const vad = {
  noiseFloor:   0.005, // running estimate of background level
  noiseAlpha:   0.02,  // EMA weight for noise-floor adaptation
  onsetRatio:   2.5,   // RMS > noiseFloor * onsetRatio triggers speech
  offsetRatio:  1.5,   // RMS < noiseFloor * offsetRatio counts as silence
  holdMs:       2500,  // continue sending for this long after silence
  preBufferMax: 8,     // ~340ms of pre-roll at ~43ms/frame
  speaking:     false,
  holdUntil:    0,
  preBuffer:    [],
  heardSpeech:  false, // any onset during the current PTT cycle?
  // Per-engagement counters (for jLog diagnostics).
  framesSeen:   0,
  framesSent:   0,
  peakRms:      0,
};

function vadReset() {
  vad.speaking = false;
  vad.holdUntil = 0;
  vad.preBuffer = [];
  vad.heardSpeech = false;
  vad.framesSeen = 0;
  vad.framesSent = 0;
  vad.peakRms = 0;
  // Don't reset noiseFloor — let it stay adapted across PTT cycles.
}

transport.onMicFrame = ({handle, rms}) => {
  if (!pttActive) {
    return;
  }
  vad.framesSeen++;
  if (rms > vad.peakRms) vad.peakRms = rms;

  const now = Date.now();

  if (!vad.speaking) {
    vad.noiseFloor += vad.noiseAlpha * (rms - vad.noiseFloor);
    vad.preBuffer.push(handle);
    if (vad.preBuffer.length > vad.preBufferMax) vad.preBuffer.shift();

    if (rms > vad.noiseFloor * vad.onsetRatio && rms > 0.005) {
      vad.speaking = true;
      vad.heardSpeech = true;
      vad.holdUntil = now + vad.holdMs;
      for (const h of vad.preBuffer) { transport.sendAudio(h); vad.framesSent++; }
      vad.preBuffer = [];
      voiceBtn.style.boxShadow = '0 0 12px rgba(248,113,113,0.7)';
      jLog('debug', 'vad onset', {rms, noiseFloor: vad.noiseFloor});
    }
    return;
  }

  transport.sendAudio(handle);
  vad.framesSent++;

  if (rms > vad.noiseFloor * vad.offsetRatio) {
    vad.holdUntil = now + vad.holdMs;
  } else if (now > vad.holdUntil) {
    vad.speaking = false;
    voiceBtn.style.boxShadow = '0 0 4px rgba(248,113,113,0.3)';
    jLog('debug', 'vad hold expired', {framesSent: vad.framesSent});
  }
};

// Incoming audio from Grok — play it.
transport.onAudio = handle => transport.playAudio(handle);

// Voice events: status, transcripts, errors.
transport.onVoiceEvent = msg => {
  if (msg.type === 'status') {
    if (msg.status === 'connected') {
      voiceBtn.classList.remove('connecting');
      voiceBtn.classList.add('active');
      voiceStatus.classList.add('on');
      voiceStatusText.textContent = 'connecting to grok...';
    } else if (msg.status === 'ready') {
      voiceStatusText.textContent = 'listening';
    } else {
      voiceStatusText.textContent = msg.status;
    }
  } else if (msg.type === 'user_transcript') {
    addMsg('user', msg.text + ' \u{1F3A4}');
    voiceStatusText.textContent = 'listening';
  } else if (msg.type === 'assistant_transcript') {
    voiceStatusText.textContent = 'speaking';
    if (!startVoice._assistantEl) {
      startVoice._assistantEl = addMsg('jevons', '');
    }
    startVoice._assistantBuf = (startVoice._assistantBuf || '') + msg.text;
    const el = startVoice._assistantEl;
    const timeEl = el.querySelector('.msg-time');
    el.textContent = startVoice._assistantBuf;
    if (timeEl) el.appendChild(timeEl);
    scrollDown();
  } else if (msg.type === 'assistant_transcript_done') {
    if (startVoice._assistantEl && startVoice._assistantBuf) {
      const el = startVoice._assistantEl;
      const timeEl = el.querySelector('.msg-time');
      el.innerHTML = marked.parse(startVoice._assistantBuf);
      if (timeEl) el.appendChild(timeEl);
    }
    startVoice._assistantEl = null;
    startVoice._assistantBuf = '';
  } else if (msg.type === 'worker_note') {
    addWorkerMsg(msg);
  } else if (msg.type === 'transcript_failed') {
    // FSM unstuck from a wedged COMMITTING (xAI silent after commit).
    // Surface a brief inline note so the user knows the turn was lost
    // and they should retry, rather than waiting forever for a
    // response that's never coming.
    addStatusMsg('Sorry — didn\'t catch that. Try again.');
    voiceStatusText.textContent = 'listening';
  } else if (msg.type === 'error') {
    console.error('voice error:', msg.error);
    voiceStatusText.textContent = 'error';
    const d = document.createElement('div');
    d.className = 'msg jevons';
    d.style.color = 'var(--red)';
    d.style.border = '1px solid var(--red)';
    d.style.borderRadius = 'var(--radius)';
    d.style.padding = '10px 16px';
    d.textContent = msg.error;
    msgs.appendChild(d);
    scrollDown();
    stopVoice();
  }
};

// Hot reload + server-restart detection. The /ws/reload socket
// signals dev-time file changes ("reload" message). If the socket
// drops and a reconnect succeeds, the server was restarted —
// reload the page so fresh bundled assets are fetched.
(function hotReload() {
  const delays = [50, 100, 200, 400, 800, 1600, 3200, 5000];
  let attempt = 0;
  let wasOpen = false;
  const open = () => {
    const rh = location.hostname === 'localhost' ? '127.0.0.1:'+location.port : location.host;
    const rws = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+rh+'/ws/reload');
    rws.onopen = () => {
      if (wasOpen) {
        // Server came back after going away — page assets may be stale.
        sessionStorage.setItem('jevons-input', input.value);
        location.reload();
        return;
      }
      wasOpen = true;
      attempt = 0;
    };
    rws.onmessage = () => {
      sessionStorage.setItem('jevons-input', input.value);
      location.reload();
    };
    rws.onclose = () => {
      const delay = delays[Math.min(attempt, delays.length - 1)];
      attempt++;
      setTimeout(open, delay);
    };
  };
  open();
})();
</script>
</body>
