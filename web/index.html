    model.error = '';
  } else if (m.denied && m.error) {
    model.error = m.error;
  }
  // 🎯T250: sidebar shows aside content even when process transcript is empty
  // (register-only asides still route via overseer [attention:…] wire).
  model = mergeModelWithAsideWire(model, m.name || selectedAgent);
  // 🎯T371: this is the wholesale replace that used to delete owner bubbles.
  // Sealed server turns still win; unsealed owner turns are re-applied.
  model.lines = reconcileInspectPending(m.name || selectedAgent, model.lines);
  model.empty = !(model.lines && model.lines.length);
  _agentInspectLines = inspectLinesCopy(model.lines);
  // History with assistant turns seals optimistic working chrome (🎯T263).
  const hasAssistant = (_agentInspectLines || []).some(function (l) {
    return l && (l.role === 'assistant' || l.role === 'jevons');
  });
  if (hasAssistant) _agentInspectWorking = false;
  model.working = !!_agentInspectWorking && !hasAssistant;
  renderAgentInspect(model);
  document.querySelectorAll('.agent-node').forEach(n =>
    n.classList.toggle('selected', n.dataset.agent === selectedAgent));
}

// 🎯T308: per-turn inspect policy lives in AgentTranscript (pure, hermetic).
// This wrapper only supplies the two DOM-bound paint deps index.html owns.
function inspectSpecFor(line) {
  const deps = {
    parseAssistantMarkdown: (typeof parseAssistantMarkdown === 'function')
      ? parseAssistantMarkdown : undefined,
    renderUserText: (typeof renderUserText === 'function') ? renderUserText : undefined,
  };
  if (typeof AgentTranscript !== 'undefined' && AgentTranscript.inspectBubbleSpec) {
    return AgentTranscript.inspectBubbleSpec(line, deps);
  }
  return {
    kind: 'bubble',
    role: (line && line.role === 'user') ? 'user'
      : ((line && line.role === 'assistant') ? 'jevons' : 'status'),
    text: (line && line.text) || '',
    when: line && line.when,
    painted: null,
  };
}

// 🎯T308: buildMsg's opts.paint for inspect bubbles — the ONLY thing the
// sidebar does differently from main chat. Assistant turns still land on the
// shared paintBody (🎯T217: markdown + mermaid/hljs/links, never textContent);
// user turns take the inspect-only policy already decided in `painted`
// (🎯T221 MD-shaped fleet injects). Body paint must never throw: one bad turn
// aborting the loop would blank the whole pane.
function paintInspectBubbleBody(el, role, text, painted) {
  try {
    if (role === 'user' && painted) {
      if (painted.mode === 'html') {
        el._body.innerHTML = painted.content;
        if (typeof decorateBodyLinks === 'function') decorateBodyLinks(el._body);
      } else {
        el._body.textContent = painted.content != null ? painted.content : text;
      }
      return;
    }
    if (typeof paintBody === 'function') {
      paintBody(el, role, text);
    } else if (role === 'jevons' && typeof parseAssistantMarkdown === 'function') {
      el._body.innerHTML = parseAssistantMarkdown(text);
      if (typeof decorateBodyLinks === 'function') decorateBodyLinks(el._body);
    } else if (role === 'user' && typeof renderUserText === 'function') {
      el._body.innerHTML = renderUserText(text);
    } else {
      el._body.textContent = text;
    }
  } catch (paintErr) {
    el._body.textContent = text;
  }
}

// 🎯T205: RHS inspect = main transcript microcosm — .msg + paintBody (not .ai-turn
// log panel); stick/free scroll; fingerprint no-op when content unchanged.
// 🎯T208: body re-paint only — never setRhsBottomTab. Transcript tab is set only
// by selectAgent (owner picks fleet agent) or explicit Transcript tab click.
// Quiet wire/refresh must leave Frontier alone while selection remains.
// 🎯T209: primary delivery is WS agent_transcript; HTTP residual for refresh.
// 🎯T309.1: renderAgentInspect is a widget mount host only — scroll container
// + policy flags (lineSpec/paintBody) are params on the widget.
function renderAgentInspect(model) {
  if (!agentInspectEl || !agentInspectBody) return;
  if (agentInspectName) agentInspectName.textContent = model.title || selectedAgent || '';
  _agentInspectWorking = !!(model && model.working);
  if (model && model.lines) {
    _agentInspectLines = inspectLinesCopy(model.lines);
  }
  // 🎯T308/T221: per-turn policy still via inspectBubbleSpec (inspect-only user
  // body policy + painted MD for user_query-shaped injects); host does not
  // re-implement the bubble loop — ConversationWidget.renderModel + buildMsg.
  if (!inspectConversation || typeof inspectConversation.renderModel !== 'function') {
    // Widget required for product path — loud empty residual if mount failed.
    agentInspectBody.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'ai-err';
    err.textContent = 'Conversation widget unavailable.';
    agentInspectBody.appendChild(err);
    return;
  }
  if (inspectConversation.setLines) inspectConversation.setLines(_agentInspectLines);
  inspectConversation.renderModel(model || {});
  if (typeof decorateBodyLinks === 'function') {
    decorateBodyLinks(agentInspectBody);
  }
  const lines = (model && model.lines) || [];
  const wantWorking = !!(model && model.working);
  // 🎯T372: the host dedupes on exactly the fingerprint the widget dedupes on.
  // The AgentTranscript copy this replaces ignored `when`, so the host could
  // call a re-timestamped line set unchanged while the widget repainted it.
  _agentInspectFp = ConversationWidget.linesFingerprint(lines, wantWorking);
}

// 🎯T209 residual: manual refresh re-issues inspect_subscribe (wire history),
// optionally falling back to HTTP GET for debug when transport is down.
function loadAgentTranscript(name, opts) {
  if (!name || !agentInspectEl) return;
  // Hard guard: never fetch/render overseer into RHS pane.
  if (typeof AgentTranscript !== 'undefined' && !AgentTranscript.shouldOpenTranscript(name)) {
    hideAgentInspect();
    return;
  }
  const quiet = !!(opts && opts.quiet);
  // Primary product path: re-subscribe on /ws/chat for sealed history push.
  if (typeof transport !== 'undefined' && transport.send) {
    subscribeAgentInspect(name);
    return;
  }
  // Residual HTTP when no chat transport (export/debug / hermetic stubs).
  fetch('/api/agents/' + encodeURIComponent(name) + '/transcript')
    .then(function (r) {
      if (!r.ok) return r.json().then(function (j) {
        throw new Error((j && j.error) || ('HTTP ' + r.status));
      });
      return r.json();
    })
    .then(function (payload) {
      const model = (typeof AgentTranscript !== 'undefined')
        ? AgentTranscript.paneModel(name, payload)
        : { title: name, lines: (payload && payload.turns) || [], empty: !(payload && payload.turns && payload.turns.length), error: '' };
      if (payload && payload.error && model.empty) {
        model.error = '';
      }
      // 🎯T371: same no-vanish invariant on the HTTP residual path.
      model.lines = reconcileInspectPending(name, model.lines);
      model.empty = !(model.lines && model.lines.length);
      _agentInspectLines = inspectLinesCopy(model.lines);
      renderAgentInspect(model);
      document.querySelectorAll('.agent-node').forEach(n =>
        n.classList.toggle('selected', n.dataset.agent === name));
    })
    .catch(function (err) {
      if (quiet) return;
      const model = (typeof AgentTranscript !== 'undefined')
        ? AgentTranscript.paneModel(name, null, err)
        : { title: name, lines: [], empty: true, error: String(err && err.message || err) };
      renderAgentInspect(model);
    });
}

function renderFrontierTable(model) {
  if (!frontierBodyEl) return;
  // 🎯T266: cache ledger/cwd for target-ask context chrome resolution.
  if (model) {
    lastFrontierLedger = model.ledger ? String(model.ledger) : '';
    lastFrontierCwd = model.cwd ? String(model.cwd) : '';
  }
  // 🎯T230: never tear down a latched InstantTip (pointer over tip or host).
  // Quiet poll / frontier_changed used to removeChild every .instant-tip,
  // which felt like an idle auto-timeout while the mouse sat still on the card.
  // Skip remount while latched; next poll after leave applies the fresh model.
  if (typeof InstantTip !== 'undefined' && typeof InstantTip.anyHoverLatched === 'function'
      && InstantTip.anyHoverLatched()) {
    return;
  }
  // Drop previous fixed-layer tips (hosts are about to be destroyed).
  // Prefer InstantTip.discardDetachedTips so registry + sticky state stay consistent.
  if (typeof InstantTip !== 'undefined' && typeof InstantTip.discardDetachedTips === 'function') {
    InstantTip.discardDetachedTips(document);
  } else {
    document.querySelectorAll('.instant-tip').forEach(function (el) {
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });
  }
  if (rhsTabMeta) {
    rhsTabMeta.textContent = model.available
      ? ((model.rows && model.rows.length) + ' ready')
      : '';
    rhsTabMeta.title = model.ledger
      ? ('Ledger: ' + model.ledger + ' (via bullseye discovery)')
      : (model.error || 'No ledger');
  }
  if (model.error && !model.available) {
    frontierBodyEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'ai-empty';
    empty.textContent = (typeof FrontierTable !== 'undefined')
      ? FrontierTable.emptyMessage(model)
      : (model.error || 'Frontier unavailable.');
    frontierBodyEl.appendChild(empty);
    return;
  }
  if (model.empty) {
    frontierBodyEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'ai-empty';
    empty.textContent = (typeof FrontierTable !== 'undefined')
      ? FrontierTable.emptyMessage(model)
      : 'Frontier is empty.';
    frontierBodyEl.appendChild(empty);
    return;
  }
  // 🎯T173: headerless table — id / name / status abbr / fanout N᚛ (hide 0).
  // 🎯T175: explanations via InstantTip (0ms), never native title= on these cells.
  // 🎯T181: ID + name → rich markdown target card (left-of-pointer placement).
  // 🎯T198: merge /api/agents target_id → engaged rows sink bottom, play→stop.
  const table = document.createElement('table');
  table.id = 'frontier-table';
  table.setAttribute('aria-label', 'Bullseye frontier');
  const tbody = document.createElement('tbody');
  const agents = (model && model.agents) || frontierAgentsCache || [];
  // 🎯T389: scope the merge to this ledger — the fleet spans several repos and
  // target ids are per-ledger, so another repo's T19 worker must not mark this
  // repo's T19 row engaged.
  let rows = (typeof FrontierTable !== 'undefined' && FrontierTable.applyEngagement)
    ? FrontierTable.applyEngagement(model.rows || [], agents, model.ledgerKey || '')
    : (model.rows || []);
  // 🎯T278: overlay optimistic kickoff-submitted; prune when engagement lands.
  if (typeof FrontierTable !== 'undefined' && FrontierTable.applyKickoffSubmitted) {
    if (typeof FrontierTable.pruneKickoffSubmitted === 'function') {
      frontierKickoffSubmitted = FrontierTable.pruneKickoffSubmitted(
        frontierKickoffSubmitted, rows);
    }
    rows = FrontierTable.applyKickoffSubmitted(rows, frontierKickoffSubmitted);
  }
  // 🎯T267: emphasize row matching frontierHighlightId (target-ask focus).
  const highlightId = (typeof frontierHighlightId !== 'undefined' && frontierHighlightId)
    ? frontierHighlightId
    : '';
  rows.forEach(function (row) {
    const tr = document.createElement('tr');
    const classes = [];
    if (row.engaged) {
      classes.push('ft-engaged');
      tr.setAttribute('data-engaged', '1');
      if (row.engaged_agents && row.engaged_agents.length) {
        tr.setAttribute('data-engaged-agents', row.engaged_agents.join(','));
      }
    }
    if (row.kickoff_submitted && !row.engaged) {
      classes.push('ft-kickoff-submitted');
      tr.setAttribute('data-kickoff-submitted', '1');
    }
    if (row.id) {
      tr.setAttribute('data-target-id', String(row.id).replace(/^🎯/, '').trim());
    }
    const isHL = (typeof FrontierTable !== 'undefined' && FrontierTable.rowMatchesHighlight)
      ? FrontierTable.rowMatchesHighlight(row, highlightId)
      : !!(highlightId && row.id &&
        String(row.id).replace(/^🎯/, '').trim() === String(highlightId).replace(/^🎯/, '').trim());
    if (isHL) {
      classes.push('ft-highlight');
      tr.setAttribute('data-frontier-highlight', '1');
      tr.setAttribute('aria-selected', 'true');
    }
    if (classes.length) tr.className = classes.join(' ');
    const id = document.createElement('td');
    id.className = 'ft-id';
    id.textContent = '🎯' + row.id;
    const name = document.createElement('td');
    name.className = 'ft-name';
    const fullName = row.name || '';
    name.textContent = (typeof FrontierTable !== 'undefined')
      ? FrontierTable.shortName(fullName, 72)
      : fullName;
    // 🎯T181/T184: full semantic card on ID and name (markdown HTML + mermaid deps).
    if (typeof InstantTip !== 'undefined' && typeof FrontierTable !== 'undefined'
        && FrontierTable.formatTargetCardMarkdown) {
      const md = FrontierTable.formatTargetCardMarkdown(row);
      const plain = FrontierTable.formatTargetCardPlain
        ? FrontierTable.formatTargetCardPlain(row)
        : md;
      if (md) {
        let html = md;
        // Markdown-bearing fields (acceptance/context/attestation + mermaid fence)
        // via marked / parseAssistantMarkdown — not plain escaped text only.
        if (typeof parseAssistantMarkdown === 'function') {
          try { html = parseAssistantMarkdown(md); } catch (_) { html = md; }
        } else if (typeof marked !== 'undefined' && marked.parse) {
          try { html = marked.parse(md); } catch (_) { html = md; }
        }
        // 🎯T186/T231: sticky card; ONE hit rect = AABB(card ∪ id+name).
        // Leave rect → dismiss immediately (HIDE_GRACE_MS=0). No bridge element.
        // groupHosts = id+name of active row; clamp right edge left of table.
        const cardOpts = {
          html: true,
          ariaLabel: plain,
          placement: InstantTip.PLACE_LEFT_OF_POINTER || 'left-of-pointer',
          className: InstantTip.CARD_CLASS || 'instant-tip-card',
          sticky: true,
          hitGroup: true,
          groupHosts: [id, name],
          clampSelectors: ['#frontier-table', '#frontier-body'],
        };
        // Single attach per row (id primary; name in groupHosts hit rect).
        const tipCard = InstantTip.attach(id, html, cardOpts);
        // 🎯T184: render mermaid minigraph inside card tips (same path as chat).
        if (typeof renderMermaidIn === 'function' && tipCard) {
          renderMermaidIn(tipCard);
        }
      }
    } else if (fullName && typeof InstantTip !== 'undefined') {
      // Fallback: name-only tip when pure helpers unavailable.
      InstantTip.attach(name, fullName);
    }
    const status = document.createElement('td');
    status.className = 'ft-status';
    let statusTip = '';
    if (typeof FrontierTable !== 'undefined') {
      status.textContent = FrontierTable.formatStatus(row.status);
      statusTip = FrontierTable.statusTitle(row.status);
    } else {
      status.textContent = row.status || '';
      statusTip = row.status || '';
    }
    if (statusTip && typeof InstantTip !== 'undefined') {
      InstantTip.attach(status, statusTip);
    }
    const fan = document.createElement('td');
    fan.className = 'ft-fanout';
    if (typeof FrontierTable !== 'undefined' && FrontierTable.formatFanout) {
      // 🎯T179: tip = lead count line + "• TID Name" bullets from dependents[]
      const fo = FrontierTable.formatFanout(row.fanout, row.id, row.dependents);
      if (fo.visible) {
        fan.textContent = fo.text;
        if (fo.title && typeof InstantTip !== 'undefined') {
          InstantTip.attach(fan, fo.title);
        }
      } else {
        fan.className = 'ft-fanout ft-fanout-empty';
        fan.textContent = '';
      }
    } else {
      const n = row.fanout != null ? row.fanout : 0;
      fan.textContent = n > 0 ? String(n) : '';
    }
    // 🎯T182/T198/T278: free → play; submitted → spinner; engaged → stop.
    const play = document.createElement('td');
    play.className = 'ft-play';
    const playBtn = document.createElement('button');
    playBtn.type = 'button';
    const playPO = (typeof FrontierTable !== 'undefined' && FrontierTable.resolvePlayPO)
      ? FrontierTable.resolvePlayPO({
          selectedAgent: typeof selectedAgent !== 'undefined' ? selectedAgent : null,
          agents: agents,
        })
      : 'jevons-po';
    const chrome = (typeof FrontierTable !== 'undefined' && FrontierTable.playChromeSpec)
      ? FrontierTable.playChromeSpec(row, {
          po: playPO,
          selectedAgent: typeof selectedAgent !== 'undefined' ? selectedAgent : null,
          agents: agents,
        })
      : (row.engaged
        ? {
            mode: 'stop',
            className: 'ft-play-btn ft-stop-btn',
            glyph: '\u25A0',
            ariaLabel: 'Stop work on 🎯' + (row.id || ''),
            title: 'Stop engaged worker(s) for this target',
            disabled: false,
            spinning: false,
          }
        : (row.kickoff_submitted
          ? {
              mode: 'submitted',
              className: 'ft-play-btn ft-submitted-btn',
              glyph: '',
              ariaLabel: 'Kickoff submitted for 🎯' + (row.id || ''),
              title: 'Kickoff submitted to PO — waiting for engagement',
              disabled: true,
              spinning: true,
            }
          : {
              mode: 'play',
              className: 'ft-play-btn',
              glyph: '\u25B6',
              ariaLabel: 'Start work on 🎯' + (row.id || ''),
              title: 'Start work via ' + playPO,
              disabled: false,
              spinning: false,
              po: playPO,
            }));
    applyFrontierPlayBtnChrome(playBtn, chrome);
    if (chrome.mode === 'stop') {
      playBtn.addEventListener('click', function (ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        stopFrontierEngagement(row, playBtn);
      });
    } else if (chrome.mode === 'play') {
      playBtn.addEventListener('click', function (ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        playFrontierTarget(row, playBtn);
      });
    }
    // submitted: no click handler (disabled spinner — not a dead free control).
    play.appendChild(playBtn);
    tr.appendChild(id);
    tr.appendChild(name);
    tr.appendChild(status);
    tr.appendChild(fan);
    tr.appendChild(play);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  frontierBodyEl.innerHTML = '';
  frontierBodyEl.appendChild(table);
  // 🎯T267: ensure highlighted target-ask row is visible in the pane.
  const hlRow = tbody.querySelector('tr.ft-highlight');
  if (hlRow && typeof hlRow.scrollIntoView === 'function') {
    try { hlRow.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (_) { /* ignore */ }
  }
}

// 🎯T198: latest /api/agents snapshot for frontier engagement merge.
let frontierAgentsCache = [];
// 🎯T278: ids with kickoff in flight (optimistic submitted chrome until engage/error).
let frontierKickoffSubmitted = {};

// Paint play/stop/submitted chrome onto an existing button (DOM helper for T278).
function applyFrontierPlayBtnChrome(btnEl, spec) {
  if (!btnEl || !spec) return;
  btnEl.className = spec.className || 'ft-play-btn';
  btnEl.disabled = !!spec.disabled;
  if (spec.ariaLabel) btnEl.setAttribute('aria-label', spec.ariaLabel);
  if (spec.title != null) btnEl.title = spec.title;
  if (spec.po) btnEl.setAttribute('data-play-po', spec.po);
  else btnEl.removeAttribute('data-play-po');
  btnEl.setAttribute('data-play-mode', spec.mode || 'play');
  btnEl.innerHTML = '';
  if (spec.spinning) {
    const spin = document.createElement('span');
    spin.className = 'ft-spin';
    spin.setAttribute('aria-hidden', 'true');
    btnEl.appendChild(spin);
  } else if (spec.glyph) {
    btnEl.textContent = spec.glyph;
  }
}

// 🎯T182: POST product agent-send path so PO spawns/briefs work on the target.
// Mock seam: window.__frontierAgentSend(url, body) → Promise (hermetic tests).
// 🎯T222: blocked when engaged / set_aside / achieved — no second kickoff.
// 🎯T255: kickoff recipient = selected product PO (not hard-coded jevons-po).
// 🎯T278: immediately paint submitted spinner before async send resolves.
function playFrontierTarget(row, btnEl) {
  if (!row || !row.id) return Promise.resolve(null);
  const playOpts = {
    selectedAgent: typeof selectedAgent !== 'undefined' ? selectedAgent : null,
    agents: (typeof frontierAgentsCache !== 'undefined' && frontierAgentsCache)
      ? frontierAgentsCache
      : (typeof lastFleetAgents !== 'undefined' && lastFleetAgents ? lastFleetAgents : []),
  };
  const req = (typeof FrontierTable !== 'undefined' && FrontierTable.playKickoffRequest)
    ? FrontierTable.playKickoffRequest(row, playOpts)
    : (function () {
        const po = (typeof FrontierTable !== 'undefined' && FrontierTable.resolvePlayPO)
          ? FrontierTable.resolvePlayPO(playOpts)
          : 'jevons-po';
        return {
          url: '/api/agents/' + encodeURIComponent(po) + '/send',
          method: 'POST',
          body: {
            text: 'Start work on frontier target 🎯' + row.id +
              (row.name ? (' — ' + row.name) : '') +
              '.\n\nKick off now: spawn/brief a fleet worker with parent=' + po +
              ' and target_id=' + row.id +
              ' (jevons_agent_start target_id — 🎯T198). Do not only toast or acknowledge.',
          },
          po: po,
        };
      })();
  // 🎯T222: pure gate may return blocked (no body).
  if (req && req.blocked) {
    if (typeof jLog === 'function') {
      jLog('info', 'frontier_play_blocked', {
        target: row.id,
        reason: req.reason,
        message: req.message,
      });
    }
    return Promise.resolve({ status: 'blocked', reason: req.reason, message: req.message });
  }
  if (!req || !req.body || !req.body.text) return Promise.resolve(null);
  // 🎯T278: mark submitted + paint spinner NOW (sync), before PO/async send.
  if (typeof FrontierTable !== 'undefined' && FrontierTable.addKickoffSubmitted) {
    frontierKickoffSubmitted = FrontierTable.addKickoffSubmitted(frontierKickoffSubmitted, row.id);
  } else {
    const tid = String(row.id).replace(/^🎯/, '').trim();
    if (tid) {
      frontierKickoffSubmitted = Object.assign({}, frontierKickoffSubmitted);
      frontierKickoffSubmitted[tid] = true;
    }
  }
  if (btnEl) {
    const subSpec = (typeof FrontierTable !== 'undefined' && FrontierTable.playChromeSpec)
      ? FrontierTable.playChromeSpec({ id: row.id, kickoff_submitted: true })
      : {
          mode: 'submitted',
          className: 'ft-play-btn ft-submitted-btn',
          glyph: '',
          ariaLabel: 'Kickoff submitted for 🎯' + row.id,
          title: 'Kickoff submitted to PO — waiting for engagement',
          disabled: true,
          spinning: true,
        };
    applyFrontierPlayBtnChrome(btnEl, subSpec);
    const tr = btnEl.closest ? btnEl.closest('tr') : null;
    if (tr) {
      tr.classList.add('ft-kickoff-submitted');
      tr.setAttribute('data-kickoff-submitted', '1');
    }
  }
  const sendFn = (typeof window !== 'undefined' && typeof window.__frontierAgentSend === 'function')
    ? window.__frontierAgentSend
    : function (url, body) {
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) {
              const err = new Error((j && j.error) || ('HTTP ' + r.status));
              err.status = r.status;
              err.body = j;
              throw err;
            }
            return j;
          }).catch(function (e) {
            if (e && e.status) throw e;
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return {};
          });
        });
      };
  return Promise.resolve(sendFn(req.url, req.body))
    .then(function (res) {
      if (typeof jLog === 'function') {
        jLog('info', 'frontier_play', {
          target: row.id,
          po: req.po,
          status: (res && res.status) || 'sent',
        });
      }
      // Keep submitted chrome until engagement overlay lands (not on mere HTTP OK).
      return res;
    })
    .catch(function (err) {
      if (typeof jLog === 'function') {
        jLog('warn', 'frontier_play_failed', {
          target: row.id,
          po: req.po,
          err: String(err && err.message || err),
        });
      }
      // Restore free play chrome on send failure.
      if (typeof FrontierTable !== 'undefined' && FrontierTable.removeKickoffSubmitted) {
        frontierKickoffSubmitted = FrontierTable.removeKickoffSubmitted(
          frontierKickoffSubmitted, row.id);
      } else {
        const tid = String(row.id).replace(/^🎯/, '').trim();
        if (tid && frontierKickoffSubmitted[tid]) {
          frontierKickoffSubmitted = Object.assign({}, frontierKickoffSubmitted);
          delete frontierKickoffSubmitted[tid];
        }
      }
      if (btnEl) {
        const freeSpec = (typeof FrontierTable !== 'undefined' && FrontierTable.playChromeSpec)
          ? FrontierTable.playChromeSpec({ id: row.id, engaged: false, kickoff_submitted: false }, {
              po: req.po,
              selectedAgent: playOpts.selectedAgent,
              agents: playOpts.agents,
            })
          : {
              mode: 'play',
              className: 'ft-play-btn',
              glyph: '\u25B6',
              ariaLabel: 'Start work on 🎯' + row.id,
              title: 'Start work via ' + (req.po || 'jevons-po'),
              disabled: false,
              spinning: false,

        applyFrontierPlayBtnChrome(btnEl, freeSpec);

}

// 🎯T198: POST /api/agents/engagement/stop — kill workers with matching target_id.
// Mock seam: window.__frontierEngagementStop(url, body) → Promise.
function stopFrontierEngagement(row, btnEl) {
  if (!row || !row.id) return Promise.resolve(null);
  // 🎯T389: stop within the ledger the table is bound to (🎯T253 rebinds it).
  const req = (typeof FrontierTable !== 'undefined' && FrontierTable.stopEngagementRequest)
    ? FrontierTable.stopEngagementRequest(row.id, lastFrontierCwd)
    : {
        url: '/api/agents/engagement/stop',
        method: 'POST',
        body: { target_id: String(row.id).replace(/^🎯/, '').trim() },
        target_id: String(row.id).replace(/^🎯/, '').trim(),
      };
  if (!req || !req.body || !req.body.target_id) return Promise.resolve(null);
  if (btnEl) btnEl.disabled = true;
  const stopFn = (typeof window !== 'undefined' && typeof window.__frontierEngagementStop === 'function')
    ? window.__frontierEngagementStop
    : function (url, body) {
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) {
              const err = new Error((j && j.error) || ('HTTP ' + r.status));
              err.status = r.status;
              err.body = j;
              throw err;
            }
            return j;
          }).catch(function (e) {
            if (e && e.status) throw e;
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return {};
          });
        });
      };
  return Promise.resolve(stopFn(req.url, req.body))
    .then(function (res) {
      if (typeof jLog === 'function') {
        jLog('info', 'frontier_stop', {
          target: row.id,
          stopped: (res && res.stopped) || [],
          status: (res && res.status) || 'ok',
        });
      }
      // Refresh agents + frontier so engaged chrome clears without waiting for poll.
      if (typeof refreshAgents === 'function') refreshAgents();
      if (typeof loadFrontier === 'function') loadFrontier({ quiet: true });
      return res;
    })
    .catch(function (err) {
      if (typeof jLog === 'function') {
        jLog('warn', 'frontier_stop_failed', {
          target: row.id,
          err: String(err && err.message || err),
        });
      }
      return null;
    })
    .finally(function () {
      if (btnEl) btnEl.disabled = false;
    });
}

function loadFrontier(opts) {
  if (!frontierBodyEl) return;
  const quiet = !!(opts && opts.quiet);
  // 🎯T253: bind frontier fetch to selected agent workdir (primary when none/overseer).
  const baseApi = (typeof FrontierTable !== 'undefined' && FrontierTable.API_PATH)
    ? FrontierTable.API_PATH
    : '/api/frontier';
  const agentsForCwd = (typeof frontierAgentsCache !== 'undefined' && frontierAgentsCache && frontierAgentsCache.length)
    ? frontierAgentsCache
    : (typeof lastFleetAgents !== 'undefined' ? lastFleetAgents : []);
  const frontierCwd = (typeof FrontierTable !== 'undefined' && FrontierTable.resolveFrontierCwd)
    ? FrontierTable.resolveFrontierCwd(
        typeof selectedAgent !== 'undefined' ? selectedAgent : null,
        agentsForCwd)
    : '';
  const api = (typeof FrontierTable !== 'undefined' && FrontierTable.frontierAPIURL)
    ? FrontierTable.frontierAPIURL(baseApi, frontierCwd)
    : (frontierCwd
      ? baseApi + '?cwd=' + encodeURIComponent(frontierCwd)
      : baseApi);
  const agentsApi = (typeof FrontierTable !== 'undefined' && FrontierTable.AGENTS_API_PATH)
    ? FrontierTable.AGENTS_API_PATH
    : '/api/agents';
  // 🎯T198: fetch frontier + agents; merge by target_id (no name parse).
  Promise.all([
    fetch(api).then(function (r) {
      if (!r.ok) return r.json().then(function (j) {
        throw new Error((j && j.error) || ('HTTP ' + r.status));
      }).catch(function () {
        throw new Error('HTTP ' + r.status);
      });
      return r.json();
    }),
    fetch(agentsApi).then(function (r) {
      if (!r.ok) return [];
      return r.json().catch(function () { return []; });
    }).catch(function () { return []; }),
  ])
    .then(function (pair) {
      const payload = pair[0];
      const agents = Array.isArray(pair[1]) ? pair[1] : [];
      frontierAgentsCache = agents;
      const model = (typeof FrontierTable !== 'undefined')
        ? FrontierTable.normalizePayload(payload)
        : {
            available: !!(payload && payload.available),
            ledger: (payload && payload.ledger) || '',
            rows: (payload && payload.targets) || [],
            empty: !(payload && payload.targets && payload.targets.length),
            error: (payload && payload.error) || '',
          };
      model.agents = agents;
      renderFrontierTable(model);
      // Light poll fallback when pane is up (fsnotify pushes frontier_changed).
      if (!frontierPollTimer) {
        const ms = (typeof FrontierTable !== 'undefined' && FrontierTable.POLL_MS)
          ? FrontierTable.POLL_MS
          : 8000;
        frontierPollTimer = setInterval(function () {
          loadFrontier({ quiet: true });
        }, ms);
      }
    })
    .catch(function (err) {
      if (quiet) return;
      const model = (typeof FrontierTable !== 'undefined')
        ? FrontierTable.normalizePayload(null, err)
        : { available: false, rows: [], empty: true, error: String(err && err.message || err) };
      model.agents = frontierAgentsCache || [];
      renderFrontierTable(model);
    });
}

// 🎯T354: RSI coach judgments + dispositions. Bare list v1 — the owner sees
// what the coach judged (T243/T353) and what the overseer did with it (T333).
// Built with textContent, never innerHTML: judgment text is model-authored.
function renderCoachList(model) {
  if (!coachBodyEl) return;
  coachBodyEl.textContent = '';
  if (coachCountsEl) {
    coachCountsEl.textContent = RSIDispositions.countsText(model);
  }
  if (model.error) {
    const err = document.createElement('div');
    err.className = 'ai-err';
    err.textContent = 'Coach ledger unavailable: ' + model.error;
    coachBodyEl.appendChild(err);
    return;
  }
  if (model.empty) {
    const empty = document.createElement('div');
    empty.className = 'ai-empty';
    empty.textContent = RSIDispositions.emptyText();
    coachBodyEl.appendChild(empty);
    return;
  }
  model.rows.forEach(function (r) {
    const row = document.createElement('div');
    row.className = 'coach-row';
    row.title = r.fingerprint;

    const head = document.createElement('div');
    head.className = 'coach-row-head';
    const title = document.createElement('span');
    title.className = 'coach-title';
    title.textContent = (r.retro ? '⏮ ' : '') + r.title;
    head.appendChild(title);
    if (r.severity) {
      const sev = document.createElement('span');
      sev.className = 'coach-sev' + (r.severity === 'high' ? ' coach-sev-high' : '');
      sev.textContent = r.severity;
      head.appendChild(sev);
    }
    const chip = document.createElement('span');
    chip.className = 'coach-chip' + (r.pending ? ' coach-pending' : '');
    chip.textContent = r.dispositionLabel;
    head.appendChild(chip);
    row.appendChild(head);

    // Title already shows the observation when the judgment carried no name.
    if (r.observation && r.observation !== r.title) {
      const obs = document.createElement('div');
      obs.className = 'coach-obs';
      obs.textContent = r.observation;
      row.appendChild(obs);
    }
    const detail = RSIDispositions.detailText(r);
    if (detail) {
      const det = document.createElement('div');
      det.className = 'coach-detail';
      det.textContent = detail;
      row.appendChild(det);
    }
    const meta = [];
    if (r.deliveredAt) meta.push(new Date(r.deliveredAt).toLocaleString());
    if (r.evidence) meta.push(r.evidence);
    if (meta.length) {
      const m = document.createElement('div');
      m.className = 'coach-meta';
      m.textContent = meta.join(' · ');
      row.appendChild(m);
    }
    coachBodyEl.appendChild(row);
  });
}

function loadCoachList(opts) {
  const quiet = !!(opts && opts.quiet);
  if (!coachBodyEl || typeof RSIDispositions === 'undefined') return;
  fetch(RSIDispositions.API_PATH)

    .then(function (payload) {

function openTerminal(name) {
  closeTerminal();
  termHeader.textContent = name;
  termHeader.style.display = 'block';
  termContainer.style.display = 'block';

  term = new Terminal({
    fontFamily: 'JetBrains Mono, SF Mono, Menlo, monospace',
    fontSize: 12,
    theme: {
      background: '#0c0c0f',
      foreground: '#d4d4dc',
      cursor: '#8b7cf6',
      selectionBackground: 'rgba(139,124,246,0.3)',
    },
    scrollback: 10000,
    convertEol: true,
  });
  termFit = new FitAddon.FitAddon();
  term.loadAddon(termFit);
  term.open(termContainer);
  termFit.fit();

  const h = location.hostname === 'localhost' ? '127.0.0.1:'+location.port : location.host;
  const cols = term.cols;
  const rows = term.rows;
  termWs = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+h+'/ws/agent-terminal?name='+encodeURIComponent(name)+'&cols='+cols+'&rows='+rows);
  termWs.binaryType = 'arraybuffer';
  termWs.onmessage = e => {
    if (e.data instanceof ArrayBuffer) {
      term.write(new Uint8Array(e.data));
    } else {
      term.write(e.data);
    }
  };
  termWs.onclose = () => { /* terminal closed */ };

  // Handle resize.
  const ro = new ResizeObserver(() => {
    if (termFit) {
      termFit.fit();
      if (termWs && termWs.readyState === 1) {
        termWs.send(JSON.stringify({type:'resize', cols:term.cols, rows:term.rows}));
      }
    }
  });
  ro.observe(termContainer);
  termContainer._ro = ro;
}

function closeTerminal() {
  selectedAgent = null;
  if (typeof hideAgentInspect === 'function') hideAgentInspect();
  if (termWs) { termWs.close(); termWs = null; }
  if (term) { term.dispose(); term = null; }
  if (termContainer._ro) { termContainer._ro.disconnect(); termContainer._ro = null; }
  termHeader.style.display = 'none';
  termContainer.style.display = 'none';

}

// Voice UI — uses transport abstraction for both browser and native modes.
const voiceBtn = document.getElementById('voice-btn');
const voiceStatus = document.getElementById('voice-status');
const voiceStatusText = document.getElementById('voice-status-text');
let voiceActive = false;

// Built-in voice/mic removed from the web UI — dictation is done via
// Wispr Flow into the text field. The voice machinery below is left
// dormant (never engaged) rather than ripped out. Guard the (now
// absent) button so the rest of the script still loads.
voiceBtn?.addEventListener('click', () => {
  if (voiceActive) stopVoice(); else startVoice();
});

// Push-to-talk via Ctrl. Hold Control to engage voice, release to stop.
// If any other key is pressed while Ctrl is down, treat it as a Ctrl+X
// shortcut and cancel voice (so Ctrl+C / Ctrl+R / etc. still work).
// PTT model: voiceActive means "the WS to the server is open". pttActive
// means "Ctrl is currently held — actively recording". The WS persists
// across press/release cycles so the Grok session can stay alive between
// utterances (commit on release, response streams back over the same WS).
//
// Ctrl is the engagement key, but the user has system hotkeys that
// include Ctrl as a modifier (screenshots, etc.). To avoid engaging the
// mic the moment Ctrl goes down during one of those chords, we arm a
// short timer on Ctrl keydown and only engage when Ctrl has been held
// ALONE for pttArmDelayMs. Any other key arriving in that window
// cancels the arm, so Ctrl-Shift-3 etc. never fires the mic.
// 250ms is long enough to cover most multi-key system hotkeys
// (Ctrl→Shift→key chord sequences) without feeling sluggish for
// deliberate PTT presses, where the user is naturally holding the
// key down for >>250ms.
const pttArmDelayMs = 250;
let pttActive = false;
let pttArmTimer = null;

// Track every non-Ctrl key currently held so we can detect chords where
// some other key was pressed BEFORE Ctrl (simultaneous chord presses
// can land in any order; the previous logic only handled Ctrl-first).
const pttHeldKeys = new Set();

function pttArm() {
  return; // Ctrl push-to-talk disabled — using Wispr Flow, not the built-in mic.
  if (pttArmTimer || pttActive) return;
  pttArmTimer = setTimeout(() => {
    pttArmTimer = null;
    pttEngage();
  }, pttArmDelayMs);
}

function pttCancelArm() {
  if (pttArmTimer) {
    clearTimeout(pttArmTimer);
    pttArmTimer = null;
  }
}

function pttEngage() {
  if (!voiceActive) startVoice(); // lazy-open on first engage
  pttActive = true;
  transport.startMic();
  vadReset();
  voiceBtn.classList.add('active');
  voiceBtn.style.boxShadow = '0 0 4px rgba(248,113,113,0.3)';
  voiceStatusText.textContent = 'listening';
  jLog('info', 'ptt engage', {
    voiceActive,
    audioCtxState: transport._audioCtx?.state,
    mediaStreamActive: transport._mediaStream?.active,
    voiceWsState: transport.voiceWs?.readyState,
  });
}

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key !== 'Control') pttHeldKeys.add(e.code);

  if (e.key === 'Control') {
    // Refuse to arm if anything else is already held — chord, not PTT.
    // Covers BOTH orderings: Ctrl-after-X (pttHeldKeys non-empty) and
    // Ctrl-with-modifier (e.shiftKey/altKey/metaKey already set, which
    // can happen even if the modifier keydown wasn't observed yet on
    // this listener — the underlying state is current).
    if (pttHeldKeys.size > 0 || e.shiftKey || e.altKey || e.metaKey) {
      console.debug('[ptt] arm suppressed — other key/modifier held');
      return;
    }
    pttArm();
  } else {
    // Any other keydown while we are armed or active → chord.
    pttCancelArm();
    if (pttActive && (e.ctrlKey || e.metaKey)) pttRelease();
  }
});
window.addEventListener('keyup', e => {
  if (e.key !== 'Control') pttHeldKeys.delete(e.code);
  if (e.key === 'Control') {
    pttCancelArm(); // brief Ctrl tap (< arm delay) → never engaged
    if (pttActive) pttRelease();
  }
});
// Window-blur, tab-switch, visibility loss: stop recording even if we
// missed the keyup (focus changes can swallow it). Force-kill the mic
// regardless of pttActive's state so the OS indicator can never hang
// stale. Also clear the held-keys Set — a key whose keyup we missed
// during a focus shift would otherwise stay "held" forever.
window.addEventListener('blur', () => {
  pttHeldKeys.clear();
  if (pttActive) pttRelease();
  transport.stopMic();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    pttHeldKeys.clear();
    if (pttActive) pttRelease();
    transport.stopMic();
  }
});

function pttRelease() {
  pttActive = false;
  voiceBtn.classList.remove('active');
  voiceBtn.style.boxShadow = '';
  const audioCtxState = transport._audioCtx?.state;
  const voiceWsState = transport.voiceWs?.readyState;
  const stats = {
    framesSeen: vad.framesSeen,
    framesSent: vad.framesSent,
    peakRms:    vad.peakRms,
    noiseFloor: vad.noiseFloor,
    audioCtxState, voiceWsState,
  };
  if (vad.heardSpeech) {
    voiceStatusText.textContent = 'processing';
    transport.commitVoice();
    jLog('info', 'ptt release / commit', stats);
  } else {
    voiceStatusText.textContent = 'listening';
    transport.clearVoice();
    jLog('info', 'ptt release / clear (no speech)', stats);
  }
}

function startVoice() {
  voiceBtn.classList.add('connecting');
  voiceActive = true;
  transport.startVoice();
}

function stopVoice() {
  voiceActive = false;
  pttActive = false;
  voiceBtn.classList.remove('active', 'connecting');
  voiceStatus.classList.remove('on');
  voiceBtn.style.boxShadow = '';
  transport.stopVoice();
}

// Transport's voice WS closed unexpectedly (most commonly: server-side
// 30 s idle timeout). Reset the page-level state so the next PTT press
// triggers a fresh startVoice() — without this, voiceActive stays true,
// startVoice is skipped, and the next utterance's audio + commit are
// silently dropped over a dead WS.
transport.onVoiceClose = () => {
  jLog?.('info', 'voice WS closed — resetting page state');
  // Don't call pttRelease — its commitVoice() would no-op against a
  // dead WS and the UI state would land in 'processing' instead of
  // back at 'idle'. Just inline the cleanup.
  pttCancelArm();
  pttActive = false;
  voiceActive = false;
  voiceBtn.classList.remove('active', 'connecting');
  voiceBtn.style.boxShadow = '';
  voiceStatus.classList.remove('on');
  voiceStatusText.textContent = 'listening';
};

// Local VAD — gate the audio stream to Grok so silence between turns
// or mid-pause "I changed my mind" releases don't deliver an empty
// buffer that Grok dutifully responds to.
//
// Design constraints (learned the hard way):
//   - holdMs must be long enough to span a normal mid-sentence pause
//     (~2-3 seconds), or VAD chops mid-utterance and Grok hears two
//     fragments instead of one. We pick 2500ms.
//   - preBuffer captures the few frames before VAD onset, otherwise
//     soft openings ("uh, can you...") lose their leading consonants.
//   - onset/offset use hysteresis (different ratios) so a single
//     loud blip doesn't briefly start/stop the stream.
//
// State is per-engagement: reset in pttEngage so VAD's noise floor
// learns from the current room rather than yesterday's session.
const vad = {
  noiseFloor:   0.005, // running estimate of background level
  noiseAlpha:   0.02,  // EMA weight for noise-floor adaptation
  onsetRatio:   2.5,   // RMS > noiseFloor * onsetRatio triggers speech
  offsetRatio:  1.5,   // RMS < noiseFloor * offsetRatio counts as silence
  holdMs:       2500,  // continue sending for this long after silence
  preBufferMax: 8,     // ~340ms of pre-roll at ~43ms/frame
  speaking:     false,
  holdUntil:    0,
  preBuffer:    [],
  heardSpeech:  false, // any onset during the current PTT cycle?
  // Per-engagement counters (for jLog diagnostics).
  framesSeen:   0,
  framesSent:   0,
  peakRms:      0,
};

function vadReset() {
  vad.speaking = false;
  vad.holdUntil = 0;
  vad.preBuffer = [];
  vad.heardSpeech = false;
  vad.framesSeen = 0;
  vad.framesSent = 0;
  vad.peakRms = 0;
  // Don't reset noiseFloor — let it stay adapted across PTT cycles.
}

transport.onMicFrame = ({handle, rms}) => {
  if (!pttActive) {
    return;
  }
  vad.framesSeen++;
  if (rms > vad.peakRms) vad.peakRms = rms;

  const now = Date.now();

  if (!vad.speaking) {
    vad.noiseFloor += vad.noiseAlpha * (rms - vad.noiseFloor);
    vad.preBuffer.push(handle);
    if (vad.preBuffer.length > vad.preBufferMax) vad.preBuffer.shift();

    if (rms > vad.noiseFloor * vad.onsetRatio && rms > 0.005) {
      vad.speaking = true;
      vad.heardSpeech = true;
      vad.holdUntil = now + vad.holdMs;
      for (const h of vad.preBuffer) { transport.sendAudio(h); vad.framesSent++; }
      vad.preBuffer = [];
      voiceBtn.style.boxShadow = '0 0 12px rgba(248,113,113,0.7)';
      jLog('debug', 'vad onset', {rms, noiseFloor: vad.noiseFloor});
    }
    return;
  }

  transport.sendAudio(handle);
  vad.framesSent++;

  if (rms > vad.noiseFloor * vad.offsetRatio) {
    vad.holdUntil = now + vad.holdMs;
  } else if (now > vad.holdUntil) {
    vad.speaking = false;
    voiceBtn.style.boxShadow = '0 0 4px rgba(248,113,113,0.3)';
    jLog('debug', 'vad hold expired', {framesSent: vad.framesSent});
  }
};

// Incoming audio from Grok — play it.
transport.onAudio = handle => transport.playAudio(handle);

// Voice events: status, transcripts, errors.
transport.onVoiceEvent = msg => {
  if (msg.type === 'status') {
    if (msg.status === 'connected') {
      voiceBtn.classList.remove('connecting');
      voiceBtn.classList.add('active');
      voiceStatus.classList.add('on');
      voiceStatusText.textContent = 'connecting to grok...';
    } else if (msg.status === 'ready') {
      voiceStatusText.textContent = 'listening';
    } else {
      voiceStatusText.textContent = msg.status;
    }
  } else if (msg.type === 'user_transcript') {
    addMsg('user', msg.text + ' \u{1F3A4}');
    voiceStatusText.textContent = 'listening';
  } else if (msg.type === 'assistant_transcript') {
    voiceStatusText.textContent = 'speaking';
    if (!startVoice._assistantEl) {
      startVoice._assistantEl = addMsg('jevons', '');
    }
    startVoice._assistantBuf = (startVoice._assistantBuf || '') + msg.text;
    const el = startVoice._assistantEl;
    const timeEl = el.querySelector('.msg-time');
    el.textContent = startVoice._assistantBuf;
    if (timeEl) el.appendChild(timeEl);
    scrollDown();
  } else if (msg.type === 'assistant_transcript_done') {
    if (startVoice._assistantEl && startVoice._assistantBuf) {
      const el = startVoice._assistantEl;
      const timeEl = el.querySelector('.msg-time');
      el.innerHTML = parseAssistantMarkdown(startVoice._assistantBuf);
      if (timeEl) el.appendChild(timeEl);
    }
    startVoice._assistantEl = null;
    startVoice._assistantBuf = '';
  } else if (msg.type === 'worker_note') {
    addWorkerMsg(msg);
  } else if (msg.type === 'transcript_failed') {
    // FSM unstuck from a wedged COMMITTING (xAI silent after commit).
    // Surface a brief inline note so the user knows the turn was lost
    // and they should retry, rather than waiting forever for a
    // response that's never coming.
    addStatusMsg('Sorry — didn\'t catch that. Try again.');
    voiceStatusText.textContent = 'listening';
  } else if (msg.type === 'error') {
    console.error('voice error:', msg.error);
    voiceStatusText.textContent = 'error';
    // 🎯T308: even the voice error notice is a conversational bubble — one
    // constructor, red chrome layered on top (no second div.msg shell).
    const d = buildMsg('jevons', String(msg.error == null ? '' : msg.error), Date.now(), {
      paint: function (el, role, text) { el._body.textContent = text; },
    });
    d.style.color = 'var(--red)';
    d.style.border = '1px solid var(--red)';
    d.style.borderRadius = 'var(--radius)';
    d.style.padding = '10px 16px';
    const row = registerTranscriptRow('jevons', String(msg.error == null ? '' : msg.error), Date.now(), {});
    row.el = d;
    d._vIndex = transcriptRows.length - 1;
    if (typeof VirtualList !== 'undefined' && VirtualList.layoutTop) {
      d.style.top = VirtualList.layoutTop(transcriptLayout, d._vIndex) + 'px';
    }
    msgsCanvas.appendChild(d);
    applyRowHeight(d._vIndex, Math.max(40, d.offsetHeight || 40));
    scrollDown();
    stopVoice();
  }
};

// Hot reload + server-restart detection. The /ws/reload socket
// signals dev-time file changes ("reload" message). If the socket
// drops and a reconnect succeeds, the server was restarted —
// reload the page so fresh bundled assets are fetched.
(function hotReload() {
  const delays = [50, 100, 200, 400, 800, 1600, 3200, 5000];
  let attempt = 0;
  let wasOpen = false;
  const open = () => {
    const rh = location.hostname === 'localhost' ? '127.0.0.1:'+location.port : location.host;
    const rws = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+rh+'/ws/reload');
    rws.onopen = () => {
      if (wasOpen) {
        // Server came back after going away — page assets may be stale.
        // 🎯T239: localStorage draft is continuous; also flush seed-stripped.
        try {
          const t = (typeof WisprContext !== 'undefined')
            ? WisprContext.prepareWireText(input.value) : input.value;
          if (typeof persistComposerDraft === 'function') persistComposerDraft(t);
          else sessionStorage.setItem('jevons-input', input.value);
        } catch (_) {
          try { sessionStorage.setItem('jevons-input', input.value); } catch (__) {}
        }
        location.reload();
        return;
      }
      wasOpen = true;
      attempt = 0;
    };
    rws.onmessage = () => {
      try {
        const t = (typeof WisprContext !== 'undefined')
          ? WisprContext.prepareWireText(input.value) : input.value;
        if (typeof persistComposerDraft === 'function') persistComposerDraft(t);
        else sessionStorage.setItem('jevons-input', input.value);
      } catch (_) {
        try { sessionStorage.setItem('jevons-input', input.value); } catch (__) {}
      }
      location.reload();
    };
    rws.onclose = () => {
      const delay = delays[Math.min(attempt, delays.length - 1)];
      attempt++;
      setTimeout(open, delay);
    };
  };
  open();
})();

// 🎯T375: the last statement of the last inline script. Reaching it is the
// only proof this ~9000-line script ran to completion. If a top-level throw
// above aborted it, this never runs and the sentinel tears the page's timers
// down and tells the owner why, rather than letting the dead bindings emit a
// recurring window.onerror cascade on every fleet poll. Nothing load-bearing
// may be added below this line.
if (typeof BootSentinel !== 'undefined' && window.__jevonsBoot) window.__jevonsBoot.markBooted();
</script>
</body>
