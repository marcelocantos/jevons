name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_CFLAGS: "-DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_FTS5"
        run: |
          cp agents-guide.md internal/cli/help_agent.md
          go test -tags "sqlite_preupdate_hook sqlite_fts5" ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_FTS5"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-X github.com/marcelocantos/jevons/internal/cli.Version=${VERSION}"
          cp agents-guide.md internal/cli/help_agent.md

          go build -tags "sqlite_preupdate_hook sqlite_fts5" \
            -ldflags "${LDFLAGS}" -o jevonsd ./cmd/jevonsd
          go build -tags "sqlite_preupdate_hook sqlite_fts5" \
            -ldflags "${LDFLAGS}" -o remote ./cmd/remote

          tar czf "jevons-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            jevonsd remote

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            jevons-*-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: marcelocantos
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula_folder: Formula
          version: ${{ github.event.release.tag_name }}
          # gh is the only brew-installable tool the daemon shells out to.
          # Quoted formula names — bare `gh` is invalid Ruby (undefined local).
          depends_on: |
            "gh"
          # Run jevonsd as a keep-alive brew service. formula_includes injects
          # this verbatim inside the formula class (the formula is DO-NOT-EDIT
          # generated, so the service block must come from the generator, not a
          # hand-edit). launchd gives brew services a spartan PATH, so augment
          # it here — otherwise the daemon can't resolve gh at runtime. The
          # remote CLI is terminal-launched and unaffected.
          formula_includes: |
            service do
              run [opt_bin/"jevonsd"]
              environment_variables PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:#{Dir.home}/.cargo/bin:#{Dir.home}/.local/bin:#{Dir.home}/.py/bin:#{Dir.home}/go/bin:/usr/bin:/bin:/usr/sbin:/sbin"
              keep_alive true
              log_path var/"log/jevonsd.log"
              error_log_path var/"log/jevonsd.log"
            end
          install: |
            bin.install "jevonsd" => "jevonsd"
            bin.install "remote" => "remote"
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true
          test: 'system bin/"jevonsd", "--version"'
          skip_checksum: true
          update_readme_table: true
