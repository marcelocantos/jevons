name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Frozen legacy obligation blobs are verification inputs.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The cost tests run Claudia's sidecar from its frozen lockfile; a
      # missing Bun is a failure there by design, not a skip.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify the React assets embedded in the release binary
        run: make ui-check-bundle
      - name: Install browser dependencies for the clean-checkout UI gate
        run: |
          make playwright-deps
          cd scripts/browser-loop-test && npx playwright install --with-deps chromium
      - name: Test
        env:
          CGO_CFLAGS: "-DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_FTS5"
        run: |
          cp agents-guide.md internal/cli/help_agent.md
          go test -timeout 45m -tags "sqlite_preupdate_hook sqlite_fts5" ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Frozen legacy obligation blobs are verification inputs.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Verify the React assets embedded in the release binary
        run: make ui-check-bundle

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_FTS5"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-X github.com/marcelocantos/jevons/internal/cli.Version=${VERSION}"
          cp agents-guide.md internal/cli/help_agent.md

          go build -tags "sqlite_preupdate_hook sqlite_fts5" \
            -ldflags "${LDFLAGS}" -o jevonsd ./cmd/jevonsd

          tar czf "jevons-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            jevonsd

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            jevons-*-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
