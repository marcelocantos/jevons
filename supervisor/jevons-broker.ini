; Seat broker (🎯T866.7). Separate process from jevonsd so a daemon
; bounce still reclaims seats by name. The Oh My Pi sidecar is started
; here and is not killed when this program exits.
;
; Template: supervisor/install.sh writes supervisor.d/jevons-broker.ini
; with @REPO@ expanded.

[program:jevons-broker]
command=@REPO@/supervisor/run-jevons-broker.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:/usr/bin:/bin:/usr/sbin:/sbin",JEVONS_DEV_REPO="@REPO@"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/.local/var/log/jevons-broker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
