; Vanilla reference cockpit on :13706 (UI-only; proxies /api /ws /health /mcp to :13705).
; Template: supervisor/install.sh writes supervisor.d/jevons-vanilla.ini with @REPO@ expanded.
; Not a Vite HMR job (🎯T540.4).

[program:jevons-vanilla]
command=@REPO@/supervisor/run-vanilla.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/.local/var/log/jevons-vanilla.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
