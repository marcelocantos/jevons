; Supervision loop: one unattended claude -p pass over the Jevons fleet
; every 15 minutes, driven by @REPO@/supervisor/jevons-tick-loop.
;
; Held here rather than in launchd so it sits beside the services it
; watches and tails the same way (supervisorctl tail -f jevons-tick).
; Its staleness alarm stays a launchd job on purpose: a watcher in the same
; process tree as the thing it watches dies with it (🎯T405).
;
; The 🎯T704 blindness fix (--add-dir ~/.jevons, bypassPermissions) lives in
; supervisor/run-tick.sh, which this loop always calls. Do not point the
; program at a bare `claude -p`.

[program:jevons-tick]
command=@REPO@/supervisor/jevons-tick-loop
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:/usr/bin:/bin:/usr/sbin:/sbin",JEVONS_TICK_REPO="@REPO@"
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_HOME)s/.local/var/log/jevons-tick.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
