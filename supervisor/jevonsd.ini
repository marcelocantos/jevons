; Daily jevonsd (React cockpit on :13705).
; Template: supervisor/install.sh writes supervisor.d/jevonsd.ini with @REPO@ expanded.
; Same shape as vellum/supervisor/vellum-view.ini.
;
; JEVONS_DEV_REPO makes this checkout's bin/jevonsd the binary supervisor
; runs (🎯T594). Rendering it here is what marks this machine a development
; one: everywhere else the program is installed without it and run-jevonsd.sh
; falls through to the Homebrew release.

[program:jevonsd]
command=@REPO@/supervisor/run-jevonsd.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:/usr/bin:/bin:/usr/sbin:/sbin",JEVONS_DEV_REPO="@REPO@"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/.local/var/log/jevonsd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
