; Phone access to the development cockpit: https://jevons.canticode.com
; (the default URL of the mobile shell, mobile/lib/settings.dart).
; Template: supervisor/install.sh writes supervisor.d/jevons-tunnel.ini with
; @REPO@ expanded.
;
; Jevons has no web auth and trusts every request that reaches it, so the
; tunnel is never run without the traffic policy: Google sign-in at ngrok's
; edge, owner only (~/.config/ngrok/jevons-policy.yml). The ngrok authtoken
; stays in ngrok's own config (~/Library/Application Support/ngrok/ngrok.yml).
; A missing policy file makes ngrok refuse to start, which is the safe
; failure: no tunnel rather than an open one.

[program:jevons-tunnel]
command=/opt/homebrew/bin/ngrok http 13705 --domain=jevons.canticode.com --traffic-policy-file=%(ENV_HOME)s/.config/ngrok/jevons-policy.yml --log=stdout --log-format=logfmt
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/.local/var/log/jevons-tunnel.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
