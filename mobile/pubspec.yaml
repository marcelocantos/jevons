name: jevons_mobile
description: Thin WebView shell for the jevons cockpit (iOS + Android).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.0
  image_picker: ^1.2.4
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Only for the fake WebView platform in test/shell_test.dart.
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
