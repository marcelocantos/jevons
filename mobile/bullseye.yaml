  T2:
    name: Jevons cockpit WebView shell hides all browser chrome (no URL bar/reload/settings icon) and feels like a native app
    status: achieved
    value: 4.0
    cost: 1.0
    attestation: 'Commits c2bad89 (AppBar removed, full-screen WebView, GestureDetector long-press opens Settings, widget tests against a fake WebViewPlatform) and e3ae0ac ("Save and reload" reloads even with an unchanged URL, the manual reload path now that the toolbar button is gone). Gates on the clean tree: `GATE flutter-analyze exit=0 GREEN id=a0261003 out=30f7faabcf27 dur=6.1s tree=clean@e3ae0ac1818b`; `GATE flutter-test exit=0 GREEN id=ea174ad0 out=1322c590a5a5 dur=6.2s tree=clean@e3ae0ac1818b` (11 tests: 7 settings, 4 shell; negative control: the no-chrome and long-press shell tests fail against the previous shell). iOS: `flutter build ios --release --no-codesign` + `scripts/sign-ios.sh` (existing wildcard profile, no new credentials); `spyder deploy Jevons …/Runner.app` installed and launched both builds (`spyder is-running Jevons com.canticode.jevonsMobile` → pid 5700 for c2bad89, pid 5707 for e3ae0ac; the second deploy''s verify-pid step tripped on a transient device-tunnel read error after install+launch had succeeded). Screenshots `~/.spyder/screenshots/jevons-mobile-T2-ipad-nochrome-c2bad89.png` and `…-e3ae0ac.png`: only the iOS status bar above the cockpit, no URL bar, no reload button, no settings icon; `…-ipad-before-toolbar.png` is the previous build for comparison. Android bonus: `flutter build apk --release`, `spyder deploy Pixel …/app-release.apk --bundle-id com.canticode.jevons_mobile` → pid 1927; `…-pixel-nochrome.png` shows the same chrome-free shell; `spyder input-swipe Pixel` held at one point for 1500 ms opened the Settings screen (`…-pixel-longpress-settings.png`) and `input-tap` on "Save and reload" returned to the cockpit (`…-pixel-after-save-reload.png`), so the hidden gesture is proven on a real device. Residue: the long-press was not exercised on the iPad itself because iOS touch injection (WebDriverAgent/XCTest) is waiting on the owner to approve the "Enable UI Automation" Touch ID prompt now showing on the Jevons iPad; the gesture code path is platform-neutral Flutter and is covered by the widget test plus the Pixel observation. Pixel Fold untested per the T1 brief.'
    acceptance:
    - 'No app-bar/toolbar chrome (no URL bar, no reload button, no visible settings icon) is shown on normal app launch — WebView fills the screen as a native-feeling shell. Settings screen is still reachable via a hidden trigger (default: long-press gesture on the WebView surface) so the URL can still be changed at runtime for the later Pigeon transport swap. flutter analyze and flutter test remain green. Verified live via Spyder on at least the physical Jevons iPad — screenshot confirms no chrome is visible on launch. If a trigger other than long-press is wanted, flag to the owner rather than silently deciding.'
    context: |-
      Owner follow-up on 🎯T989 / mirrored T1. Owner wants the shell to feel like a native app, not a browser — since it's a single-purpose SPA pointed at one cockpit URL, there's never a reason to show navigation chrome. Removing the visible settings icon would strand the URL-change capability needed for Pigeon later, so a hidden entry point (long-press by default, pending owner confirmation) replaces it.

      Achieved 2026-10-02: Commits c2bad89 (AppBar removed, full-screen WebView, GestureDetector long-press opens Settings, widget tests against a fake WebViewPlatform) and e3ae0ac ("Save and reload" reloads even with an unchanged URL, the manual reload path now that the toolbar button is gone). Gates on the clean tree: `GATE flutter-analyze exit=0 GREEN id=a0261003 out=30f7faabcf27 dur=6.1s tree=clean@e3ae0ac1818b`; `GATE flutter-test exit=0 GREEN id=ea174ad0 out=1322c590a5a5 dur=6.2s tree=clean@e3ae0ac1818b` (11 tests: 7 settings, 4 shell; negative control: the no-chrome and long-press shell tests fail against the previous shell). iOS: `flutter build ios --release --no-codesign` + `scripts/sign-ios.sh` (existing wildcard profile, no new credentials); `spyder deploy Jevons …/Runner.app` installed and launched both builds (`spyder is-running Jevons com.canticode.jevonsMobile` → pid 5700 for c2bad89, pid 5707 for e3ae0ac; the second deploy's verify-pid step tripped on a transient device-tunnel read error after install+launch had succeeded). Screenshots `~/.spyder/screenshots/jevons-mobile-T2-ipad-nochrome-c2bad89.png` and `…-e3ae0ac.png`: only the iOS status bar above the cockpit, no URL bar, no reload button, no settings icon; `…-ipad-before-toolbar.png` is the previous build for comparison. Android bonus: `flutter build apk --release`, `spyder deploy Pixel …/app-release.apk --bundle-id com.canticode.jevons_mobile` → pid 1927; `…-pixel-nochrome.png` shows the same chrome-free shell; `spyder input-swipe Pixel` held at one point for 1500 ms opened the Settings screen (`…-pixel-longpress-settings.png`) and `input-tap` on "Save and reload" returned to the cockpit (`…-pixel-after-save-reload.png`), so the hidden gesture is proven on a real device. Residue: the long-press was not exercised on the iPad itself because iOS touch injection (WebDriverAgent/XCTest) is waiting on the owner to approve the "Enable UI Automation" Touch ID prompt now showing on the Jevons iPad; the gesture code path is platform-neutral Flutter and is covered by the widget test plus the Pixel observation. Pixel Fold untested per the T1 brief.
