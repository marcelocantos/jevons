  T1:
    name: Flutter WebView shell for the jevons cockpit builds and deploys to real iOS and Android devices (mirror of jevons 🎯T989)
    status: achieved
    value: 5.0
    cost: 3.0
    attestation: 'Oracle evidence, 2026-10-02: `flutter analyze` → "No issues found"; `flutter test` → 4/4 passed (test/settings_test.dart). iOS: `flutter build ios --release --no-codesign` built Runner.app (16.9MB); `scripts/sign-ios.sh` signed it with the existing wildcard profile 4fac34fa (team SWA3H3N7TW, expires 2027-04-18) and identity "Apple Development: MARCELO CANTOS (GJF5DNC392)", `codesign --verify --deep --strict` clean, no portal access. Spyder `deploy_app(device="Jevons")` → {bundle_id: com.canticode.jevonsMobile, pid 5664}, `is_running` → running; screenshot `~/.spyder/screenshots/screenshot-Jevons-20261002-092931.959653000.png` shows the shell toolbar with https://jevons.canticode.com and the page rendered (ngrok Google sign-in interstitial, the cockpit''s auth front door). Android: `flutter build apk --release` → app-release.apk (49.0MB); `apksigner verify` → v2 scheme verified, signer CN=Android Debug (template debug keystore). Spyder `deploy_app(device="Pixel", bundle_id=com.canticode.jevons_mobile)` → pid 31514, foreground app com.canticode.jevons_mobile; screenshot `screenshot-Pixel-20261002-093008.181506000.png` shows the same cockpit page. Residue: Pixel Fold verification deferred to the owner per brief; release-keystore signing for Android not set up (debug keystore by design).'
    acceptance:
    - Flutter app in this repo uses `webview_flutter` to show a WebView at a configurable URL defaulting to https://jevons.canticode.com
    - Settings screen changes the URL at runtime, persisted via `shared_preferences`; the URL literal lives in exactly one place (`kDefaultCockpitUrl`) and every use reads the persisted setting
    - '`flutter analyze` and `flutter test` are green'
    - 'iOS: `flutter build ios` succeeds and Spyder `deploy_app(device="Jevons")` installs and launches the app on the physical Jevons iPad; a screenshot shows the cockpit loaded in the WebView'
    - 'Android: `flutter build apk` succeeds with a signed APK, and it installs/launches on the Spyder-reachable Pixel Tablet (Pixel Fold testing deferred to the owner)'
    - Form-factor/layout polish is out of scope; iOS signing for the new bundle ID reuses existing on-machine provisioning only (no new credentials created)
    context: |-
      Cross-repo mirror of jevons 🎯T989. Primary deploy target is the car-mounted 'Jevons' iPad mini (A17 Pro, iOS 27). The shell is intentionally thin so a later transport swap (Pigeon) is a settings change on the device, not a rebuild.

      Achieved 2026-10-02: Oracle evidence, 2026-10-02: `flutter analyze` → "No issues found"; `flutter test` → 4/4 passed (test/settings_test.dart). iOS: `flutter build ios --release --no-codesign` built Runner.app (16.9MB); `scripts/sign-ios.sh` signed it with the existing wildcard profile 4fac34fa (team SWA3H3N7TW, expires 2027-04-18) and identity "Apple Development: MARCELO CANTOS (GJF5DNC392)", `codesign --verify --deep --strict` clean, no portal access. Spyder `deploy_app(device="Jevons")` → {bundle_id: com.canticode.jevonsMobile, pid 5664}, `is_running` → running; screenshot `~/.spyder/screenshots/screenshot-Jevons-20261002-092931.959653000.png` shows the shell toolbar with https://jevons.canticode.com and the page rendered (ngrok Google sign-in interstitial, the cockpit's auth front door). Android: `flutter build apk --release` → app-release.apk (49.0MB); `apksigner verify` → v2 scheme verified, signer CN=Android Debug (template debug keystore). Spyder `deploy_app(device="Pixel", bundle_id=com.canticode.jevons_mobile)` → pid 31514, foreground app com.canticode.jevons_mobile; screenshot `screenshot-Pixel-20261002-093008.181506000.png` shows the same cockpit page. Residue: Pixel Fold verification deferred to the owner per brief; release-keystore signing for Android not set up (debug keystore by design).
