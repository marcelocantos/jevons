    acceptance:
    - Flutter app in this repo uses `webview_flutter` to show a WebView at a configurable URL defaulting to https://jevons.canticode.com
    - Settings screen changes the URL at runtime, persisted via `shared_preferences`; the URL literal lives in exactly one place (`kDefaultCockpitUrl`) and every use reads the persisted setting
    - '`flutter analyze` and `flutter test` are green'
    - 'iOS: `flutter build ios` succeeds and Spyder `deploy_app(device="Jevons")` installs and launches the app on the physical Jevons iPad; a screenshot shows the cockpit loaded in the WebView'
    - 'Android: `flutter build apk` succeeds with a signed APK, and it installs/launches on the Spyder-reachable Pixel Tablet (Pixel Fold testing deferred to the owner)'
    - Form-factor/layout polish is out of scope; iOS signing for the new bundle ID reuses existing on-machine provisioning only (no new credentials created)
    context: |-
      Cross-repo mirror of jevons 🎯T989. Primary deploy target is the car-mounted 'Jevons' iPad mini (A17 Pro, iOS 27). The shell is intentionally thin so a later transport swap (Pigeon) is a settings change on the device, not a rebuild.

