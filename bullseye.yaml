  T100:
    name: Cross-tree kill escalates via nearest common ancestor with skeptical parent justification
    status: identified
    value: 8.0
    cost: 8.0
    acceptance:
    - A cross-tree kill request (actor not ancestor of target) is not executed as a direct kill; it is reified as an escalation toward the nearest common ancestor (NCA) of actor and target.
    - Escalation may ripple one parent link at a time; each intermediate parent can deny, request more evidence, or forward.
    - 'Parents act skeptical: require concrete justification/evidence (what, why, blast radius) before approving a kill outside their own direct authority pattern.'
    - Successful escalation results in the authorized ancestor performing a normal lineage kill (same as parent→descendant path).
    - Denied or abandoned escalations leave the target alive and leave an audit trail.
    - Hermetic tests cover NCA resolution, deny without evidence, and approved escalation → kill.
    context: |-
      Owner 2026-08-01 (after parent-only kill): later enhancement — cross-tree kill is not a direct operation. Interpret as a request to the nearest common ancestor, possibly rippling up the tree a parent at a time. Each parent should be skeptical and require justification with evidence before approving a kill outside its own strict descendant set.

      Builds on lineage (parent field) and parent→descendant-only kill authorization already in jevons_agent_kill.
    tags:
    - product
    - fleet
    - security
    - kill
    - lineage
    - later
    origin: owner
    discovered: 2026-08-01
