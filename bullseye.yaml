  T14:
    name: Onboarding and device pairing
    status: identified
    value: 8.0
    cost: 8.0
    acceptance:
    - '`brew install` installs both `jevons` CLI and `jevonsd` daemon'
    - '`jevons --init` runs the pairing ceremony end-to-end'
    - Device secret persists in iOS Keychain; hash in jevonsd's DB
    - Subsequent connections authenticate automatically
    - '`jevons --unpair` revokes a paired device'
    - No manual host/port entry in the app
    - jevonsd runs as a brew service
    - Relay runs on Fly.io
    context: |
      Desired state: a new user goes from zero to connected in one flow with
      no manual IP entry or configuration.

      Onboarding flow:
      1. User installs the iOS app. App opens a QR scanner and displays a brew install hint.
      2. `jevons --init` prompts for OpenAI API key, stores in macOS Keychain.
      3. CLI pings jevonsd (brew service) that the key is available.
      4. jevonsd generates a one-time auth token, encodes host:port+token as QR, sends to CLI.
      5. User points device at the QR on terminal.
      6. App scans QR, connects to jevonsd with token, jevonsd promotes connection.

      Relay architecture: Go relay on Fly.io (`carrier-pigeon.fly.dev`). Each
      jevonsd connects outbound to `/register`, gets instance ID. iOS connects
      to `/ws/<instance-id>`. Relay bridges traffic. No per-user DNS, no
      tunnels, one relay for all users.

      Pairing ceremony: CLI prompts for key; jevonsd generates single-use
      pairing token; CLI displays QR; user scans; app sends pairing token;
      jevonsd sends 6-digit confirmation code; user types code into CLI;
      jevonsd generates persistent device secret; app stores secret in iOS
      Keychain. Subsequent connections use device fingerprint
      (identifierForVendor) + stored secret.
    depends_on:
    - T14.1
    origin: manual
    discovered: 2026-03-21
  T14.1:
    name: Adopt pigeon's PairingArtifact / PairingHost / CredentialStore primitives
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - jevonsd no longer carries bespoke X25519 key management — internal/server/pairing.go is deleted and serverKP/pubKeyBase64 are removed from Server
    - Pairing flow uses pigeon.PairingHost.Mint and emits artifact.MarshalText() in the QR (or via `pigeon pair` for out-of-band deploy)
    - Server-side crypto.PairingRecord set is persisted at ~/.jevons/credentials.json and loaded on startup; incoming relay connections look up the matching record and reject unknown/expired peers
    - jevonsd accepts server records out-of-band via `--add-credential <path>` (or watched ~/.jevons/credentials.d/) so deploy scripts can register peers without a daemon restart
    - iOS Transport / JevonsBridge use PigeonConn.connect(artifact:) with the artifact persisted via KeychainCredentialStore
    - iOS QR scanner decodes via PairingArtifact.unmarshalText and drops the legacy {id,relay,pub} JSON + jevons:// parsers
    - App launch checks PIGEON_PAIRING_ARTIFACT env var first (decode + persist), then loads from credential store → connectWithArtifact, falls back to QR scanner on ErrPairingExpired / ErrNoCredential
    - 'End-to-end smoke (developer flow): `xcrun devicectl ... process launch --environment-variables PIGEON_PAIRING_ARTIFACT=$(pigeon pair ...)` works zero-touch on the iPad'
    - 'End-to-end smoke (user flow): pair via QR on iPad → send chat message → force-expire artifact → re-pair UI fires'
    context: |
      Pigeon v0.19.0 ships PairingArtifact + PairingHost + CredentialStore + ConnectWithArtifact across Go/Swift/Kotlin, plus Swift PigeonConn.connect(artifact:) and a `pigeon pair` subcommand. This sub-target adopts those primitives, deleting the bespoke key/QR/pairing code in jevonsd and the manual PigeonConn.connect plumbing in the iOS app. The developer-flow deploy path uses `pigeon pair` to mint an artifact, passes it to the iOS app via PIGEON_PAIRING_ARTIFACT env var on launch (no QR scan needed), and registers the server record with jevonsd via --add-credential. End-user pairing remains QR-driven. See docs/plans/pigeon-migration.md for the 13-step migration.

      Status (2026-05-23): code-side migration complete. Server uses PairingHost.Mint + CredentialStore; relay derives the E2E channel from the persisted PairingRecord. iOS has PigeonAccount (KeychainCredentialStore wrapper), env-var ingestion at launch, artifact-only QR scanner, and JevonsBridge collapsed to {direct, relayArtifact}. Legacy Transport.swift, BridgeMode.relay, connectChatTern, and the jevons://+ws:// QR parsers are gone. Remaining: device smoke tests (developer-flow xcrun deploy + user-flow QR pair-expire-repair).
    origin: manual
    discovered: 2026-04-25
