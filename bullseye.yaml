  T30:
    name: 'Jevons runs production-worthy as a web-only butler/CEO: adopts, spawns, monitors, and directs agents on the owner''s behalf, and never loses a thread'
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - '[decidable | ORACLE: e2e integration test] ADOPT-OBSERVE: given a list of session IDs in conversation (''adopt these: ...''), each is registered as a durable thread (id, workdir, claude session id, description) and appears in the thread list with readable status; adoption is non-invasive — no running process is taken over, the transcript is tailed for status. Test adopts a known session id and asserts the registry entry + readable status + that no process was spawned.'
    - '[decidable | ORACLE: e2e integration test] SPAWN + DIRECT: Jevons spawns an agent for a stated piece of work; a directed message reaches that agent and its response round-trips back to the user over the web chat. Test spawns a (mock or real) agent, sends, asserts the response returns.'
    - '[decidable | ORACLE: e2e integration test] STATUS: for any thread (adopted or spawned), current status (active/idle/working/blocked/done + a recent-activity summary derived from its transcript) is retrievable on demand.'
    - '[decidable | ORACLE: e2e integration test — LOAD-BEARING, rule 11] NEVER LOSE A THREAD: after a jevonsd restart, the full thread set persists (durable registry), and any thread can be rehydrated on demand (idle transcript -> --resume -> continue the conversation). Test restarts the daemon and asserts the thread set is intact and a rehydrate succeeds with continuity.'
    - '[decidable | ORACLE: e2e integration test — LOAD-BEARING, rule 11] NO SILENT-FAIL DIRECT: directing a thread whose process has aged out or been GC''d does not silently fail (the T24 wedge) — it transparently rehydrates and delivers, or returns a distinct actionable error. Test ages/kills a thread''s process, directs it, asserts delivery or a typed error, never a silent 30s timeout.'
    - '[decidable | ORACLE: e2e integration test] PROCESS-AS-CACHE GC: an idle thread''s process is stopped resumably after a threshold (freeing resources); the thread persists and rehydrates on next interaction. Test asserts idle -> stopped -> registry intact -> rehydrate.'
    - '[decidable | ORACLE: T19 checks] ALWAYS-ON: jevonsd runs under brew services (keep_alive, PATH-augmented), survives a reboot, and resolves the external tools it shells out to.'
    - '[decidable] WEB-ONLY: the entire v1 interaction is the web chat over /ws/chat rendering plain markdown; no native app or other client is required to spawn/adopt/monitor/direct.'
    - '[class-3 HUMAN GATE — isolated, once, rule 1] In real daily use over roughly a week, running the fleet by talking to Jevons in the web chat is satisfactory: spawn/adopt/status/direct feel natural in conversation, and its briefings are good enough that dropping into a raw session is rare. One owner accept/reject at the end; kept separate from the decidable criteria above so the target does not inherit this clause''s p.'
    context: |-
      The near-term focus (2026-07-04), narrowed hard from the broadened T27 hub scope. Jevons purely as the owner's butler/CEO: connect the owner to agents it spawns, watches, gets status from, and directs on their behalf — nothing else. T27 (provider hub), T29 (rich generative UI), and voice/iPad are all explicitly DEFERRED.

      Product shape (v1): a WEB-ONLY chat where you talk to Jevons; it renders plain markdown now (T29 is the deferred rich-surface ambition). The only interface is Jevons — zero pre-built UI (charter 'Interaction' principle); any UI is generated on demand.

      Threads model (the spine): a THREAD is a durable semantic unit (transcript + target + status), NOT tied to a process. The process is a disposable cache — spun up to interact, SIGINT'd/stopped when idle, rehydrated on demand via --resume. This is what kills the reboot fear ('remember where we were no matter what happens'). The CEO owns thread lifecycle (when to start/stop), and translates between the owner's work-language ('the multimaze2 rebuild') and the underlying threads — no thread-management UI.

      Grandfathering is critical-path, not later: the owner has many active sessions to bring in. v1 = adopt-observe by session ID, conversationally. Two-writer constraint: a session actively driven in a terminal can be registered+observed (transcript tailed) but not directed until handed over (take-over = --resume, requires the owner to stop driving it). Adopt-observe now; take-over on demand.

      Critical path: grandfathering adopt-observe (T16.2, the slice that matters) -> threads-durable + no-silent-fail direct (T24) -> always-on (T19), all under one e2e integration harness (the oracle, to be built — jevonsd has unit tests but no butler-loop integration test). Load-bearing properties (oracle-first rule 11): 'never lose a thread' (durability/rehydration) and 'no silent-fail direct' — if either breaks, the butler is worthless; both carry explicit decidable oracles above.

      Verification note: the build loop runs against the integration harness, never against 'does the chat feel right' (rule 2). The conversational-quality judgment is the single isolated class-3 gate at the end.
    depends_on:
    - T16.2
    - T24
    - T19
    origin: manual
