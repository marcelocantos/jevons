      REMAINING (fleet worker jv-t285-provider-handover is on it): delivery is inline-only, so a migration whose relaunch failed, or a daemon that died between rotation and seeding, leaves the record on disk with nothing retrying it. The worker is adding ResumePendingHandover on attach (single-flight, delivered via sendNotes so the mark is honest). Daily fleet: 8 agents still on grok; the endpoint goes live on the next daemon restart.

