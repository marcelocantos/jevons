      Owner 2026-08-07, after flipping the daily default to claude (🎯T282): "We need to continue the conversation somehow. Could we summarise the active transcript automatically and hand it to the new model when we do a switch like this?" Owner refined the design: do not interview the outgoing session (it may already be dead) — one-off prompt the successor with the location of the predecessor's transcript and an instruction to pick up where it left off.

      LANDED (bc39b66, b3672a2, 1fd0b39; HEAD verified green in an isolated worktree): internal/handover (seed prompt + durable Pending store), fleet.PrepareMigration / SeedSuccessor, MCP jevons_agent_migrate, and the overseer arm — server.MigrateOverseer + POST /api/overseer/migrate, which shares the rotate half and adds attach + seed (mirrors RewindOverseer).

      Ordering is the substance: the transcript pointer is persisted BEFORE the rotation that overwrites the session id. Seeding for fleet agents goes through Deliver, not a bare Send — fire-and-forget suits a Claude TUI but breaks Grok's ACP request/response cycle ("Internal error" on the next prompt). Rotation also clears ConnectURL/PID: the first cut re-persisted a dead serve endpoint from the pre-Stop snapshot, the 🎯T204 trap reached by a different road.

