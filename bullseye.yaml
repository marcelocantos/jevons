  T16.2:
    name: Session grandfathering — adopt existing sessions as durable observe-only threads
    status: achieved
    value: 8.0
    cost: 8.0
    acceptance:
    - '[decidable | ORACLE: internal/butler e2e test — DONE] ADOPT-OBSERVE: a Claude Code session is registered by session ID as a durable thread (id, workdir, claude session id, description) NON-INVASIVELY — no process is taken over or spawned; the session''s own transcript is tailed for status. Adopting a session with no transcript on disk fails cleanly.'
