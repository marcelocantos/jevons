    - '[decidable | ORACLE: schema + provenance-resolution check] BOOTSTRAP: a one-shot pass over the distilled layer (mnemo memories/decisions/synthesis + auto-memory) produces a manual whose every doctrine entry validates against the entry schema (statement, rationale, class, provenance, evidence, confidence) and whose evidence pointers each resolve to a real session/memory. Test asserts schema-validity and that no entry has an unresolvable or empty evidence list.'
    - '[decidable | ORACLE: regression test — LOAD-BEARING] CONTRARIAN PRESERVATION: the seed protected-contrarian priors (relational≫object-stores, sync≫messaging, monolith≫microservices) appear tagged class=protected-contrarian with non-empty rationale, and a synthesis/refresh pass driven by a conventional-wisdom prompt does NOT overwrite them or strip their rationale. Test runs the synthesizer against a mean-regressing prompt and asserts the protected entries survive intact.'
