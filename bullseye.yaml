  T107:
    name: User journeys are live end-to-end agent interactions; successful runs may be cached for replay
    status: achieved
    value: 13.0
    cost: 5.0
    actual_cost: 1.0
    acceptance:
    - Project docs define a user journey as end-to-end exercise of a real owner-visible path that interacts with at least one agent (overseer and/or fleet worker), not documentation greps or pure unit checks of suite helpers.
    - Hermetic doctrine/inventory/port-guard tests (if retained) live under a name/path that is explicitly not called a journey (e.g. doctrine package) and are documented as meta-guards only.
    - make test-journey / suite entrypoint still boots isolate and runs agent-touching journeys; optional cache of a successful agent interaction is specified (record once on green, replay until invalidated) without replacing the requirement that first-pass / uncached runs hit a real agent.
    - At least one journey path documents how cache miss vs hit works, or a stubbed interface is ready for cache store — no journey may claim green while only grepping source.
    - Bullseye T101 context or acceptance notes the owner correction if T101 was achieved under the weaker hermetic-only bar.
    context: |-
      Owner 2026-08-01: "The whole point of a user journey is to map out an actual user interaction with the tool and confirm that it runs end-to-end. This was explicit. It must interact with an agent. It's okay to cache the agent interaction once a successful run is achieved."

      Corrects a mis-execution of 🎯T101: hermetic doc/port greps are NOT journeys. Journeys require real user-path interaction with an agent (overseer and/or fleet) on Universe B isolate. After a green live run, caching the agent interaction for faster replay is allowed (not required to invent stubs that never hit an agent).

      Related T101 (standing net doctrine), T102 step library, T105.x per-feature journey coverage, journey-suite J1–J10.
    tags:
    - product
    - testing
    - journey
    - e2e
    - oracle
    - agent
    - cache
    origin: owner
    discovered: 2026-08-01
    achieved: 2026-08-02
