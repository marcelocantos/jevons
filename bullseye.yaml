      Refines T93 (out-of-band filing without a heavyweight multi-turn attention thread): the light path is still not a full park/pursue stack item for days — it is a dedicated short-lived aside opened by the target: prefix. The overseer may clarify name/acceptance/scope in a small back-and-forth, then must file 🎯Tn and auto-close the aside so focus returns to main without owner ceremony.

