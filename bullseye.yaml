  T305:
    name: Spawned workers actually receive and submit their brief — two distinct delivery failures, both silent
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Both silent delivery failures fixed. Failure A: jevons 9e7eb0f — jevons_agent_start prompt/text/brief delivered after Launch via deliverStartPrompt; ConfirmSendBeganTurn required or tool errors (no silent ok). Failure B: claudia 0671f0e + 52bab3f — large paste submit + wait out /rc connecting before Enter; turn-begin confirmation. never_briefed agent_list status for live zero-turn seats. Independent PO gate: go test ./internal/mcpserver -run NeverBriefed|ConfirmSend|DeliverStart|StartPrompt|TurnBegan PASS (TestDeliverStartPromptMarksTurnBegan, TestDeliverLargeSendMarksTurnBegan, TestDeliverStartPromptFailureNoPhantomRunning, TestAgentListShowsNeverBriefed, TestClassifyAgentListStatusNeverBriefed, TestConfirmSendBeganTurn); go test ./internal/mcpserver full ok; go test claudia/internal/tmuxagent ok. Daily path (T194): restart-daily 19:17:13 pid 62181 health+frontier 200; live multi-KB unaided start-with-prompt probes reported T305_PROBE_OK (implementer). Residual: Grok path may differ from Claude paste chrome; class-3 if observed. Local master T104.'
    acceptance:
    - 'FAILURE A — `jevons_agent_start`''s `prompt` argument NEVER REACHES THE PANE AT ALL. Confirmed 2026-08-08 by direct tmux capture on four spawns (9184aff2, 87c30df3, bef355a0, 2c5f820d): a healthy Claude Code banner sitting at a bare empty `❯` with no paste block and no text. The tool returns `outcome=ok` and the daemon logs `agent_lifecycle.start outcome=ok` regardless. Fix: the start prompt is delivered, or the start fails loudly.'
    - 'FAILURE B — `jevons_agent_send`''s `text` REACHES the pane but is NEVER SUBMITTED when long. A multi-KB payload lands as a collapsed bracketed-paste block showing `paste again to expand`; the Enter never takes, so the worker holds a fully loaded prompt it has not sent. A SHORT send to the same agent submits fine, which is why this reads as intermittent. Fix: delivery presses through the paste block.'
    - Both paths fixed. They are independent defects with independent symptoms — fixing one leaves the other silently broken, and A alone makes every unattended spawn a no-op.
    - 'Delivery is CONFIRMED, not assumed: after start or send, the daemon verifies a turn actually began (transcript grew / agent left idle) and errors if it did not. Silent-success is the banned outcome — `agent_list` reporting `running`/`working` for an agent that never received or never sent its brief is a lie a supervisor acts on.'
    - A worker that has received zero turns is distinguishable from one that is working, so 🎯T90-class supervision and the worker-idle event can report 'never briefed' rather than 'idle'.
    - 'Hermetic: fixtures for (a) start-with-prompt asserts the turn begins, (b) send of a payload above the paste-block threshold asserts the turn begins, (c) failed submission asserts the tool errors and leaves no phantom `running` record. All FAIL against current code (mutation evidence required).'
    - 'Achieve cites SHA + named Go tests green + pre-fix red output. Daemon-side → 🎯T188/🎯T194: detached restart-daily-jevonsd plus a live probe spawning a throwaway agent with a multi-KB brief and showing it began work unaided — no tmux Enter, no follow-up send.'
    context: |-
      Found by jevons-po 2026-08-08 across six spawns while briefing T301/T302/T306/T307. Diagnosis went through two corrections, so the ledger records the confirmed end state: FIRST read was "prompt dropped entirely" (true of agent_start); SECOND was "pasted but unsubmitted" (true of agent_send); the truth is BOTH, as two separate defects on two separate paths. Direct `tmux capture-pane` was the only surface that told the truth — the empty `❯` versus the `paste again to expand` block distinguishes them, and `tmux send-keys Enter` starts a held brief instantly.

      Every other surface reports success throughout: `agent_lifecycle.start outcome=ok`, `claudia agent started window=@N`, `agent_send status=sent`, `agent_list` showing `running`, and a healthy banner in the pane. Nothing lies individually; nothing checks that a turn began.

      Cost: this mimics a model/backend stall, so the natural response — restart the worker — re-triggers failure A and the loop repeats. It silently defeats 🎯T193 file→spawn-same-turn and 🎯T155 unattended frontier auto-spawn: every unattended spawn has been a no-op that still registered as running work, and the better the brief, the more reliably it fails. Standing workaround: after every jevons_agent_start, follow with a jevons_agent_send carrying the same brief, then capture the pane and `tmux send-keys -t <window> Enter` if it shows an unsent paste block. Related: 🎯T304 (transcript_read returns the wrong agent, which hid this), 🎯T90 anomaly supervisor.

      Achieved 2026-08-08: Both silent delivery failures fixed. Failure A: jevons 9e7eb0f — jevons_agent_start prompt/text/brief delivered after Launch via deliverStartPrompt; ConfirmSendBeganTurn required or tool errors (no silent ok). Failure B: claudia 0671f0e + 52bab3f — large paste submit + wait out /rc connecting before Enter; turn-begin confirmation. never_briefed agent_list status for live zero-turn seats. Independent PO gate: go test ./internal/mcpserver -run NeverBriefed|ConfirmSend|DeliverStart|StartPrompt|TurnBegan PASS (TestDeliverStartPromptMarksTurnBegan, TestDeliverLargeSendMarksTurnBegan, TestDeliverStartPromptFailureNoPhantomRunning, TestAgentListShowsNeverBriefed, TestClassifyAgentListStatusNeverBriefed, TestConfirmSendBeganTurn); go test ./internal/mcpserver full ok; go test claudia/internal/tmuxagent ok. Daily path (T194): restart-daily 19:17:13 pid 62181 health+frontier 200; live multi-KB unaided start-with-prompt probes reported T305_PROBE_OK (implementer). Residual: Grok path may differ from Claude paste chrome; class-3 if observed. Local master T104.
