  T10:
    name: sqlpipe-based state sync
    status: converging
    value: 13.0
    cost: 13.0
    acceptance:
    - WebSocket carries only sqlpipe peer messages — no application-level JSON messages
    - Server writes to transcript/sessions/scripts/state tables; changes stream to client automatically
    - Client writes to requests table; server processes inserts as actions
    - Reconnect uses diff sync — no full state resend
    - Lua scripts render from query subscription results
    - Chat, sessions, and status all reflect server state reliably without manual push logic
    context: |-
      Desired state: all state synchronisation between jevonsd and clients flows through sqlpipe bidirectional peer sync. No application-level message protocol — WebSocket is pure sqlpipe transport.

      Architecture:
      - jevonsd is a sqlpipe Peer (server-owned: transcript, sessions, scripts, state).
      - Client is a sqlpipe Peer (client-owned: requests, preferences).
      - Diff sync on reconnect; query subscriptions feed render.

      2026-08-03 thin-slice: 🎯T10.1 achieved — pure transport framing + policy in internal/sync; /ws/sqlpipe rejects application JSON and fails closed without PeerSession. Product /ws/chat and /ws/remote still application JSON (chat_wire).

      Blockers for remaining children:
      - T10.2: re-introduce sqlpipe Go Peer (CGO + C++23). Removed in 2d1f5b4 for modernc.org/sqlite; needs explicit CI toolchain decision.
      iOS SyncPeer + Vendor/sqlpipe still present client-side but server Peer is gone.
      - T10.3–T10.5 depend on Peer.
      - T10.6 product cutover after pure path is real.

      Dependencies: marcelocantos/sqlpipe sibling repo (v0.30.0 wire tags must stay aligned with internal/sync constants).
    origin: manual
    discovered: 2026-03-15
