    acceptance:
    - Migrating an existing agent (overseer or fleet agent) to a different provider captures a handover brief from the OUTGOING session while it is still alive — mission, current state, next steps, open threads — and persists it durably BEFORE the old process is stopped, so a crash mid-migration cannot lose it.
    - 'The successor launches on the new provider with the brief injected as its first input (same shape as the rewind recap and the fleet standing brief), and the chatlog is untouched: owner-visible history is unchanged by a migration.'
    - 'Fallback chain is explicit and reported, never a silent cold start: live self-written brief → chatlog recap (overseer) → transcript tail distil (either provider store, 🎯T213) → persona-only. The path actually used is logged and surfaced to the owner.'
