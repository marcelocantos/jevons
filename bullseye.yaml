    context: |-
      Raised 2026-07-04 from the Jevons-as-C2 pivot (user decision #2): Jevons becomes the ecosystem coordinator + aggregating UI host; mnemo and sibling tools (doit, bullseye, ...) invert to pure feed/capability providers (see mnemo 🎯T109; the parked mnemo T102.* plugin-host graph is the seed design). This umbrella is the successor to that parked work, relocated to where the coordinator + UI live.

      GROUNDING (from a 2026-07-04 architecture investigation of jevonsd): the hub is largely GREENFIELD, not a relocation onto existing rails. jevonsd today is a single-tenant Claude-Code coordinator: an MCP *producer* at /mcp (mark3labs/mcp-go), a hand-rolled JSON WebSocket broadcast hub (/ws/remote, /ws/chat), and a Claude *agent* registry via the external claudia module. What it LACKS for a provider system: (1) any provider/feed/plugin concept (none, not even a stub); (2) structured config or a persistence layer (~/.jevons/ is a few JSON files; no SQLite, no config.json; CLI flags + Keychain only); (3) an MCP *client* to aggregate external tools (producer-only); (4) a generic process supervisor — claudia is Claude-hardwired (tmux PTY, --resume, LookPath("claude"), no generic argv); (5) the server-side half of server-driven UI — deleted mid-pivot (internal/ui/schema.go+viewstate.go gone), so T9 now sends state and the client runs Lua locally, with no server hook for contributed UI.

      The UI contract to target IS real and native: ViewNode{type,id,props,children} + ViewProps (~40 fields) + ViewMessage/DismissMessage/ActionMessage in ios/Jevon/Models/ViewNode.swift, rendered by ServerView.swift + LuaRuntime.swift (T9/T11). Providers feed a model; Jevons renders it — not served HTML.

      COUPLINGS to existing Jevons targets (noted here rather than wired as depends_on edges, to avoid reshaping the active roadmap — the user can promote these to hard edges): the server-side UI producer child depends on the T9/T11 client renderer being real; the generic-supervision child extends claudia beyond its current Claude-hardwiring (relates to T8); MCP aggregation adds an MCP client alongside the T8/mcpserver producer. Cross-repo edge to mnemo 🎯T109 (mnemo implements the provider side) is recorded in prose since bullseye is per-repo.

      SHAPE: contract-first — the provider contract pins the protocol; config/persistence, registry+lifecycle, MCP-client, and feed-ingestion fan out; the server-side UI producer + desktop head build the render path; mnemo-as-provider and automation-liveness converge as proof.
