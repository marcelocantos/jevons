  T99:
    name: Continuation statements route into the matching thread without full re-discussion in main
    status: identified
    value: 13.0
    cost: 8.0
    acceptance:
    - Given a continuation-style owner message that names or strongly evokes a topic discussed in a recent non-main thread (or durable session), and not recently in main, the system identifies the best matching thread/session as the continuation target.
    - The message is delivered into that thread (transplant / focus switch + inject) so the reply continues there — not a cold main-thread digression that re-derives restic context from scratch.
    - 'Routing does not require a full deliberative agent pass on every owner message by default: a cheap index (terms, n-grams, titles, recent digests, and/or RAG over thread metadata) is the primary path; agent-level judgment is reserved for low-confidence or multi-match cases.'
    - Ambiguous or no-match cases stay on main (or ask one short clarifying question) without silently hijacking an unrelated thread.
    - Owner can still force main or a named thread via existing prefix/aside ceremony (T65) — auto-routing never overrides an explicit focus.
    - 'Hermetic or journey coverage: fixture threads with distinct topics; continuation query matches the right thread and does not match main; negative case with no thread stays on main.'
    context: |-
      Owner 2026-08-01: identify a thread based on a continuation statement. Example: "How's restic going?" should (1) recognize restic has not been discussed recently in the main thread, (2) find that a recent session/thread did discuss restic, (3) transplant the message into that thread so discussion continues there.

      Getting this right is tricky: the owner does not want the agent pondering every single request for whether it belongs here or elsewhere. Prefer a fast path (term matching, n-gram, embedding/RAG-style lookup over thread titles + recent digests) over always spending a full agent turn on routing. Full agent judgment only when the cheap index is ambiguous.

      Related T65 attention threads / prefix UX, T93/T95 target asides, T87 impatience (don't make owner re-find context), T88 history nav, CEO alter-ego T98 (owner would just continue the right conversation).
