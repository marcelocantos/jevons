    - Coalesce/working-indicator Playwright test still passes.
    context: 'Owner feedback 2026-07-26 after T55 shipped locally: T55 only HIDES content (clamp after full render), so the browser still does all the parse+DOM work and it happens after-the-fact (15-20s of tool lists scrolling before cleanup). Root causes: (1) marked.parse on full huge content then post-hoc clamp; (2) appendOrAddJevons re-parses target._streamRaw on EVERY streamed chunk → O(n²) on replay of a turn that streamed as many deltas; (3) scrollDown per message. Fix = bound the WORK: preview-only up-front render, lazy full render on expand, debounced re-parse, throttled scroll. Distinct from and precedes 🎯T56 (true virtualisation + server replay cap for the ~10s WS transfer of the whole history).'
