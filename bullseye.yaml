    context: 'Forcing function: the 2026-07-06 token-runaway incident (docs/analysis/postmortem-token-runaway-2026-07-06.md). BUILT on branch cost-clampdown (internal/cost): L1 collector tails every active session JSONL into SQLite usage_events (modernc.org/sqlite, costUSD-or-pricing, request-id dedup, persisted tail offsets); L2 monitor computes rolling burn-rate per worker/fleet(=attributed+orphan)/global with the runaway signals (rate ladders, session-count, orphan=in-fleet-but-unregistered, projected/hard-ceiling), a thin-rate guard (kill needs >=N events, not one spike), and a collector-staleness watchdog; L3 enforcer escalates warn->throttle->pause->kill with kill-confirmation ticks, protects the overseer, a dead-man''s switch, an auto-resume guard, spawn/resume gates on the butler, and the TmuxKillSwitch that reaps the launchd-detached fleet server. Wired live into jevonsd: jevons_cost MCP tool + GET /api/cost + web ticker + cost_alert broadcast + owner-chat heartbeat. Global burn is INFORMATIONAL (the owner''s own sessions); the destructive path is fleet+orphan only. Criterion-8 drill (real detached burners in a private tmux server, detected and killed automatically) passes locally; CI installs tmux to run it. Dependency on T8.2 removed — T36 built its own collection layer and delivers T8.2''s ''per-worker token counts recorded'' criterion. Retire once the PR''s CI runs the drill green (the confirming oracle).'
