  T272:
    name: Working indicator is level-triggered from live in-flight state — not edge-triggered kickoff
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Independent PO gate: SHA 14aca9d fix(web) level-trigger working chrome after reload (T272). Product: history_meta.working via overseerWorkingLevel; ChatEvents.workingLevelFromSample; applyWorkingLevelSample on history_meta/status. Re-ran green: node web/scripts/chat_events_test.js T272 PASS; go test ./internal/server -run TestHistoryMetaWorkingLevel|TestChatReplaysFromJevonsLog PASS; /health 200. Residual: multi-agent busy thin-slice; hard-reload + daemon restart-daily if binary pre-T272. Local master only T104.'
    acceptance:
    - Working chrome reflects a continuous detection of whether an owner-visible turn is currently in flight (level), not only set on send/kickoff and cleared on terminal events (edge). After reload/reconnect, chrome is correct because state is re-derived from current play (session busy / open stream / server truth), not because a prior edge was remembered.
    - If nothing is in flight, chrome is idle without sticky false working; if work is in flight, chrome shows working even when the client never observed the original start edge (reload, late attach).
    - 'Hermetic: (1) hydrate/reconnect with open-turn fixture → working on without simulating a send edge; (2) hydrate with sealed history only → idle; (3) edge-only kickoff without level re-sample is not the product model. Residual: multi-agent busy thin-slice.'
