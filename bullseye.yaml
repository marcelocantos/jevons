  T28:
    name: Adaptive road-noise suppression trains on idle cabin audio and subtracts it during speech
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - During idle periods (no local-VAD trigger), the iPad continuously samples cabin/road noise and maintains an adaptive noise profile (e.g. running noise spectrum / RNN state), updated over time as driving conditions change.
    - When the user speaks, the captured audio has the learned noise profile subtracted BEFORE it reaches the local VAD and before it is streamed to Grok — so both VAD triggering and Grok STT operate on cleaned speech.
    - 'The suppressor is evaluated against a known real-time noise-suppression library rather than hand-rolled: candidates to assess are RNNoise (Xiph, RNN-based, real-time, permissive licence), WebRTC APM noise suppression, and whether AVAudioEngine VoiceProcessingIO''s built-in NS is already sufficient for low-frequency road rumble (it is tuned for echo + speech, may under-attenuate cabin noise).'
    - 'Measurable improvement in the car: local-VAD false-trigger rate during driving drops materially vs. the current -38 dBFS plain-threshold gate, AND Grok user-transcript accuracy on a fixed spoken script improves at highway speed. Capture before/after clips for the record.'
    - 'Adaptation is genuinely online: entering a noisier environment (windows down, higher speed) degrades then recovers transcription as the profile re-trains, without an app restart.'
    - The suppressor sits as a stage in the VoicelabKit capture pipeline (AudioEngine → [suppressor] → VAD + Grok), platform-neutral where possible so it survives the iOS-first / future-platform split.
    context: 'Requested 2026-07-04. The car cabin is the primary deployment and road noise is the dominant threat to both the local VAD (false triggers on rumble) and Grok STT accuracy. VoiceProcessingIO already gives AEC + AGC + some NS, but its NS is tuned for echo/voice on a phone call, not sustained low-frequency road noise. The user''s framing: use idle periods (when not speaking) to learn the ambient noise, then subtract it adaptively while speaking — classic adaptive noise cancellation / spectral subtraction, with strong prior art. Leverage a library rather than rolling our own DSP: RNNoise is the leading real-time RNN suppressor (permissive licence, ~1 CPU-% per stream, designed exactly for this); WebRTC''s APM is the other proven option; first confirm whether VP''s built-in NS is already enough before adding a stage. Slots into the VoicelabKit capture pipeline ahead of the VAD and the Grok stream. Relates to the voice foundation in T25 (this cleans the input side of that loop).'
    depends_on:
    - T37
    origin: manual
    discovered: 2026-07-04
  T29:
    name: Jevons interaction is a generative rich visual surface driven by conversation, not a chat log
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'Representation is chosen by content: the butler renders responses on a rich web content surface (embedded in the native shell), reaching for the densest adequate form — status cards, tables, charts, sequence/Mermaid diagrams (rendered, not code), diffs with inline controls, live widgets. Prose is the FALLBACK, not the default.'
    - The agent generates its own UI in TypeScript against a typed component SDK, composing and EXTENDING an accumulating reusable toolkit (quality compounds with use) rather than us pre-guessing a fixed vocabulary. A freeform generated-markup escape covers the long tail; everything degrades to plain text on failure.
    - 'Bidirectional density: the surface takes rich INPUT too (approve a diff in place, brush a chart, drag a priority), not just renders output.'
    - 'Fault isolation so one bad widget can''t take the app down: per-widget sandboxed iframes (style + script isolation), error boundaries -> fallback card, and a reload-the-whole-surface backstop (safe and near-free because the client is thin and all durable state is server-side). Watchdog/Web-Worker termination for sync-hang widgets is a later add, driven by real pain.'
    - 'Security posture matches single-user self-hosted reality: NO heavyweight sandbox. The native bridge is presentation-only (generated UI expresses intent -> Jevons -> doit; it can never actuate directly, per the charter ''never actuates''); a tight CSP with locally-bundled libs (no remote loads) neutralises the one realistic vector (a prompt-injection-manipulated generator phoning home). Revisit only if jevonsd is ever exposed networked/multi-user.'
    - 'Extreme case demonstrated: a live app preview streamed into a widget via ge/spyder''s streaming capability.'
    context: |-
      DEFERRED / future work (filed 2026-07-04). The near-term butler MVP starts with plain conventional markdown rendering; this target is the ambition it grows into, captured so the design conversation isn't lost.

      Thesis (the headline of the butler, not a feature of it): Jevons is a HIGH-BANDWIDTH VISUAL INTERFACE to your fleet that you drive by talking — not a chatbot that happens to render markdown. The goal is to maximise the density and velocity of information transfer between computer and human, across the entire breadth of what the agent might want to present. Text/bold/markdown is constrictive; we lean all the way into rich, generated, visual surfaces.

      Key architecture decisions from the 2026-07-04 design conversation:
      - This COMPLETES the 'end of the UI' philosophy rather than reversing it: the fixed UI you operate dies; a surface generated per-turn by the conversation replaces it. You never operate a UI — you express intent, the agent composes the interface.
      - Surface split: NATIVE Swift shell (menubar presence, actionable push notifications, window, global summon hotkey — the butler's proactivity lives here) + WEB content surface (the agent's generative canvas — dynamic UI construction is web's singular strength). Native was decided for the shell; the web half is elevated from 'markdown renderer' to 'the agent's generative surface'. Thin client throughout — brain stays in jevonsd (medium-independence via shared client kit, per mnemo's proven Go-server/lean-Swift pattern).
      - Language: TypeScript, NOT Lua. Lua was right for the old native-SwiftUI/ViewNode render path; once the surface is web, JS/TS is the substrate's native tongue (zero marginal cost — the JS engine is already there; Lua becomes the extra dependency), the agent is dramatically stronger at it, and TS types ARE the bounded-but-rich vocabulary contract. This largely supersedes the T9/T11 native ViewNode renderer for the content surface.
      - Frontier-risk strategy: rather than build a rich surface and hope the agent uses it well, give the agent an open-ended surface it controls + 'use it to the max' prompting, and let it build its own tooling. Faults are quarantined and fed back as signal so the generator improves — quality compounds.

