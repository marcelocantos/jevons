  T119:
    name: Transcript is fully loaded in-browser, windowed for render stress, recent-first, whole-chunk only
    status: achieved
    value: 8.0
    cost: 5.0
    attestation: '76d74bb feat(web): shell+content windowing. make test-web green (virtual_list_test T119 oracles: recent-first, whole-chunk, progressive pages, size cache, resize remeasure, jump-to-bottom/no jump-to-top). UI: infinite-scroll-test progressive full hydrate without scroll-for-data; virtual-list-test shells/material band. Residual: estimate≠real height may nudge on first far-scroll rematerialize; WS still recent-30 replay (T57 API); no journey/live smoke this slice.'
    acceptance:
    - On reload/reconnect/open, visible transcript lands on the latest end without a parade of older content through the viewport (recent-first hydrate, render from front/latest backward as needed)
    - 'History units are only complete cohesive chunks: whole owner request, whole assistant response, and associated step/activity indicators — never partial markdown or mid-turn fragments'
    - Full transcript data lives in the browser (progressive network load for first paint OK; no page-sized or scrollback data cap). Owner machines assumed beefy — do not throttle data for bandwidth
    - 'DOM model is shell+content: every chunk has a persistent shell container in the DOM; only shells on or near the viewport materialize rich content; far shells keep frozen height/width from last measure and drop inner content'
    - 'Size cache: after a chunk is measured (content rendered once at known width), store its container dimensions; dematerialize content without collapsing the shell; rematerialize from cache + full chunk data without reflow jumps'
    - 'Lazy measure: do not render-all-then-strip at startup; measure on first materialization (or opportunistic near-viewport); avoid huge upfront render cost'
    - Horizontal resize invalidates size cache (wrapping changes natural height); remeasure only shells that need it (near viewport first, others on next materialization)
    - 'Events drive the model: scroll/intersection (with anticipation margin), resize, chunk append/seal, jump-to-bottom — no polling loop for content residency'
    - Jump-to-bottom is one step (hotkey + affordance); deliberately no jump-to-top
    - 'Hermetic oracles: recent-first hydrate, whole-chunk only, full data resident with windowed content, shell dimension stability after dematerialize, resize remeasure, jump-to-bottom, no jump-to-top'
    context: |-
      Owner 2026-08-02: implement now — prioritized. Overseer briefed jevons-po to ship shell+content model (full data in browser, windowed content, recent-first, whole chunks, jump-to-bottom, lazy measure, resize invalidation).

      Owner 2026-08-02 design (shell+content virtualization):

      Goal: right content on screen at the right time; lean outside the viewport — without using infinite scroll as a data-saving throttle.

      ## Model

      **Two layers per chunk**
      1. **Shell** — always in the DOM for every chunk (once known). Owns identity, spacing, and a **cached box size** (height at last measured content width).
      2. **Content** — markdown/mermaid/tool steps — only mounted when the shell is **in or near** the viewport (anticipation band).

      **Data vs DOM**
      - **Data:** full transcript in memory (progressive fetch OK).
      - **DOM stress:** controlled by dematerializing content far from the viewport, not by deleting history from the client.

      **Procedural loop (event-triggered, not a one-shot startup purge)**
      - **hydrate/append (recent-first):** materialize near the live end first so the owner lands on latest; older shells can exist as empty measured/unmeasured placeholders as data arrives.
      - **enter band:** if content missing → render whole chunk → measure → cache size → keep content while in band.
      - **leave band:** freeze shell to cached size → drop content (and heavy subtrees).
      - **scroll / intersection:** only driver for enter/leave (with pre-edge margin).
      - **resize (esp. width):** invalidate size cache (wrap changes height); rematerialize/remeasure near viewport first; far shells remeasure lazily on next enter.
      - **jump-to-bottom:** one-step hotkey; ensure end band is material; no jump-to-top.

      **Reject naive startup:** do not render entire transcript then strip — lazy measure on first materialization.

      **Supersedes pure T56 “only on-screen nodes”** in spirit: shells may stay for scroll stability/jump-to-bottom; **content** is what leaves. Related T56/T57/T101.

      ## Simplicity rule
      One state machine per shell: `unmeasured | dematerialized(size) | material` driven by viewport-band + resize + data-seal events. No second infinite-scroll-as-fetch policy once data is local.

      Achieved 2026-08-02: 76d74bb feat(web): shell+content windowing. make test-web green (virtual_list_test T119 oracles: recent-first, whole-chunk, progressive pages, size cache, resize remeasure, jump-to-bottom/no jump-to-top). UI: infinite-scroll-test progressive full hydrate without scroll-for-data; virtual-list-test shells/material band. Residual: estimate≠real height may nudge on first far-scroll rematerialize; WS still recent-30 replay (T57 API); no journey/live smoke this slice.
    tags:
