  T104:
    name: Jevons product default is local progress, not PR machinery — fleet and CEO resist pathological pull-requesting
    status: achieved
    value: 13.0
    cost: 5.0
    actual_cost: 2.0
    acceptance:
    - 'Overseer persona (and any shipped worker/PO briefing defaults) state explicitly: do not open GitHub PRs, run PR-creation flows, or treat "open a PR" as the completion signal unless the owner (or overseer on the owner''s clear instruction) requested delivery via PR.'
    - 'Default blessed completion path for fleet agents: commit on the designated branch/workdir, report SHA + evidence to overseer; optional push of the branch only if already part of the agreed integration path — still not "open a PR" by default.'
    - PO/boss briefings and agents-guide (or equivalent product surface) teach the same rule so workers under Jevons inherit it without relying on each worker's external harness defaults.
    - 'When a worker''s underlying harness is PR-biased, Jevons instructions countermand it in plain language (name the failure mode: training/system default to PR-as-done).'
    - 'Hermetic or journey check: persona/docs contain the no-default-PR rule (structural), and/or a fixture briefing for a spawned worker includes it.'
    - Does not ban PRs as a delivery mechanism when the owner wants them — only removes them as ambient autopilot.
    context: |-
      Owner 2026-08-01: agents (and by extension coding agents under Jevons) have a pathological need to raise PRs constantly; system prompts and training lean that way. Guard rails are needed as a **Jevons product** property — not merely this chat session, not only the jevons git repo's contributor AGENTS.md, and not only global CLAUDE.md for human-driven coding agents.

      Jevons is the CEO/butler over a fleet. Its persona, worker briefings, PO doctrine, and any default spawn templates must encode the owner's delivery preference: accumulate commits locally (or on a shared working branch), prove with oracles, and open/push PRs only when the owner explicitly asks to ship/review via PR. "Done" for fleet work is landed commits + evidence + notification to overseer — not "I opened a PR."

      Related T78 fleet spawn doctrine, T98 CEO alter-ego, T87 impatience (PRs are human-review stalls), fan-out one-PR discipline as *product* for workers not just outer agent.
    tags:
    - product
    - persona
    - fleet
    - doctrine
    - git
    - pr
    - alter-ego
    - week-of-use
    origin: owner
    discovered: 2026-08-01
