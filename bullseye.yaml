    - 'A target: aside is lighter than a general T65 multi-work attention thread: it is purpose-bound to filing one (or a tightly related set of) target(s), not an open-ended park/pursue workstream.'
    - Product/persona or harness implements the auto-close after successful file — not "hope the model remembers"; regression coverage (hermetic, journey, or structured fixture) proves prefix → clarify optional → file → aside gone.
    - Design stays consistent with T65 prefix-first UX (composer placeholder / aside chrome) and does not reintroduce button-primary thread chrome.
    context: |-
