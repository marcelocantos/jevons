    - 'Layer 3 (dead-man''s switch): a fleet with no attached owner/heartbeat self-terminates instead of running indefinitely'
    - 'Auto-resume guard: unattended multi-agent Workflow/fan-out work is not auto-resumed after a crash without a liveness + budget check, and resume attempts are capped'
