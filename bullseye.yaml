  T25:
    name: Grok used as voice I/O layer; overseer agent runs outside xAI's session model
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: Premise invalidated — the shipped Grok-only harness makes the overseer itself a Grok ACP session, contradicting "overseer runs outside xAI's session model". The 🎯T37 decision will spawn a successor if the voice/brain split is still wanted.
    acceptance:
    - 'Voice runs entirely client-side on the iPad (swift/voicelab): AVAudioEngine + VoiceProcessingIO AEC, local-VAD-gated episodic Grok Realtime sessions, direct iPad->Grok with no audio through jevonsd. [DONE - Phase 0, device-validated 2026-07-04: episodic loop, barge-in, background-audio, VAD threshold -38 dBFS confirmed]'
    - 'Each Grok episode is stateless: opens on local-VAD trigger (with pre-roll so the trigger syllables survive), closes on post-response silence. No JSONL replay into Grok; Grok holds no cross-episode continuity. [DONE - Phase 0]'
    - 'Overseer bridge: the final user transcript from an open iPad episode is forwarded to the jevons Claude overseer over jevonsd /ws/chat; the streamed reply is injected back into the still-open Grok episode via GrokRealtime.speak() for TTS. [Phase 1]'
    - The overseer is the existing jevons claudia.Agent (tools-denied router) delegating via jwork / jevons_agent_send - unchanged; only the voice transport is new. Conversation continuity lives in the overseer's Claude session + the iPad transcript, not in Grok. [Phase 1]
    - Async worker/agent completions surface as spoken notes at the next episode and appear in the iPad transcript immediately (reuse the worker_note frames). [Phase 2]
    - 'The old server-side Go voice bridge is deleted: internal/server/voice.go + voice_fsm.go, GrokLog replay, and the delegate/list_agents/task_status Grok tools - all superseded by the client-side loop. [Phase 3]'
    - 'Degraded mode: when the home overseer is unreachable (car, ngrok down), Grok-only chit-chat still works rather than erroring. Latency contract: acknowledge fast, deliver overseer results when ready.'
    context: |-
      After ten days of fighting xAI Grok Realtime to behave as a long-running overseer agent (🎯T18), we accumulated six distinct workarounds for a fundamental architectural mismatch: xAI Realtime is designed for ephemeral phone-call-style voice interactions, while we want a persistent overseer that survives hours and reconnects on demand. Symptoms: replay-on-reconnect costing tokens and occasionally breaking STT, silent transcription failures requiring fallback timers, conversation-state assumptions baked into multiple layers, worker-completion injection as a workaround for async events arriving in a synchronous-feeling chat.

      The pragmatic resolution surfaced in conversation 2026-05-21: stop asking Grok to be the brain. Use it for what it's genuinely good at — sub-second voice STT/TTS. Move the overseer logic to a Claude agent which already has the right shape: persistent sessions, robust tool calling, good reasoning, the existing claudia.Agent infrastructure.

      Salvage rate is high: FSM, deps adapter, JSONL persistence, worker-delegate plumbing, three test harnesses all reusable. The wholesale changes are concentrated in startGrokSession (no more Grok tools, no more replay), the FSM transition table (COMMITTING and RESPONDING simplify since they become synchronous round-trips), and the bridge between transcript and Claude overseer (new code, but tracks an existing pattern).

      Phased implementation suggested:
        Phase 2a — strip Grok's overseer role: remove tools, remove system prompt instructions about delegation, remove replay-on-reconnect. Grok becomes a vanilla STT/TTS endpoint. Verify voice still works as a dumb echo.
        Phase 2b — wire Claude overseer: register a 'jevons-overseer' claudia.Agent (or repurpose the existing 'jevons' agent), give it tools (delegate, list_agents), route transcripts through it.
        Phase 2c — close the loop: pipe Claude's text response back through Grok TTS for spoken playback.
        Phase 2d — remove dead xAI continuity code: replay path, system-note injection, the FSM's worker-completion queue (workers now report to Claude's own conversation).

      Trade-offs explicit: voice latency goes up by Claude's response time (often 2-5s for non-trivial turns vs Grok's 1-2s). Acceptable given the user prefers reliability over snappiness for an overseer agent. Per-turn cost may go up (Claude tokens) or down (no xAI conversation context being reprocessed every turn) — net effect TBD.
    origin: manual
    discovered: 2026-05-22
