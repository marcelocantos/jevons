  T114:
    name: 'Fleet model is unified: an aside is a kind of agent — one registry, one talk path, purpose distinguishes side chat'
    status: achieved
    value: 13.0
    cost: 8.0
    actual_cost: 5.0
    attestation: 'Unified fleet vertical slice landed (doctrine + purpose + Deliver). Claudia AgentDef.Purpose (a25494f local) + jevons replace. Deliver/PushEvent resolves thread OR agent (0cc5720 T111.2 path); Spawn purpose=aside dual-write; agent_start purpose=work; overseer purpose; /api/agents purpose; persona/agents-guide/AGENTS T114 doctrine; hermetic tests TestDeliverSameAPIThreadAndAgent, TestSpawnDefaultsPurposeAside, TestPushEventAgentOnlyParticipant. Residual: threads.json retained (dual-write, not eliminated); claudia Purpose on local replace until claudia ships; owner attention chrome primarily T65/T95/T115 UI.'
    acceptance:
    - 'Product doctrine states: there is one fleet participant model (agent). An aside/thread is an agent whose purpose is a side chat (long or short) off main — not a second spine with separate lifecycle/talk APIs'
    - 'Single registry (or single logical store with one id space) lists all participants: overseer, POs, workers, asides — with fields for purpose/role (e.g. work | aside | overseer) and optional parent lineage'
    - One deliver/send/push/rehydrate path addresses any participant by name/id; event_push and agent_send are not split by store; no no thread X when the agent exists
    - 'UI: work agents appear in RHS fleet tree as today; asides appear in attention/aside chrome and do not pollute main flow when active/done (T95.1); both remain the same underlying agent records'
    - Spawn paths (work vs aside:) set purpose appropriately but share EnsureAgent/Launch/parent rules where applicable
    - 'Migration: threads.json dual-write or import into the unified model; docs/persona/MCP tool surface updated; hermetic tests cover send-to-aside and send-to-worker via the same API'
    - Hard decoupling (separate butler-only Direct vs agent-only Send as permanent architecture) is retired as a design goal
