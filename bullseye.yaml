  T31:
    name: Jevons enforces oracle-first as a system property and interactively co-develops oracles from intent for greenfield work
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'ENFORCEMENT (independent gate, oracle-first rule 9): no work item proceeds to production without either a declared executable oracle or an explicitly recorded accepted-risk / isolated class-3 gate. Jevons is that gate and it did not produce the work, so its judgement is structurally independent of the executor. Verifiable: every accepted work item carries an oracle reference or a logged risk acceptance; none is accepted on an agent''s bare ''done''.'
    - 'GREENFIELD ELICITATION: for new software (no reference to extract from), Jevons runs an interactive design process that produces, ALONGSIDE the design, an oracle-coverage map — which parts of the intended behaviour are pinned by executable checks, which are still fuzzy, and the load-bearing concrete examples (''when X, expect Y'') elicited from the owner that seed those checks.'
    - 'SPIRAL, not waterfall: the process supports design -> thin slice -> owner reacts -> intent sharpens -> new oracle, capturing each sharpened intent as an executable check; production work is refused on still-fuzzy parts until the intent is pinned enough to test.'
    - 'DECIDABLE-FROM-TASTE SORT (rule 1): the process explicitly separates decidable criteria from irreducibly perceptual taste, making most functional intent decidable and flagging the residue as a single owner accept/reject — so nothing is built against ''feel'' by accident, and no decidable target inherits a perceptual clause''s p.'
    - 'PROPORTIONALITY + GOODHART GUARDS: Jevons exercises judgement about when a thing is ripe for an oracle vs. still an exploratory spike (does not straitjacket exploration), and drives toward LOAD-BEARING examples so the elicited oracle pins the real intent rather than an incidental one (rule 6).'
    - '[class-3 HUMAN GATE, isolated] The elicited oracles faithfully reproduce the owner''s intent — validated by the owner in real design sessions. One accept/reject on the process''s fidelity, kept separate from the decidable enforcement criteria above.'
    context: |-
      DEFERRED / future capability (filed 2026-07-04). Sits ON TOP of the butler MVP (T30) — Jevons must exist and reliably coordinate before it can oversee planning and act as final judge of outcomes. Must not re-expand T30.

      The idea: /oracle-first is currently a per-invocation hack the owner types to force a testability bias. This target makes it a SYSTEM PROPERTY: Jevons oversees planning, ensures the verification-first principles are followed, and acts as the independent final judge of the outcome — the CEO's QA function from the charter ('drive p down without ever accepting unverified work'). Structurally stronger than putting it in CLAUDE.md, which is passive guidance checked by the same agent that has an incentive to declare done (oracle-first rule 9: attestation != execution). Jevons, as a party that did not do the work, is a real gate.

      The novel, harder half is GREENFIELD ORACLE ELICITATION. The oracle-first doctrine is port-centric: extract the reference's behaviour into an executable oracle. For NEW software there is no reference — the 'reference' is the owner's intent, which is incomplete, evolving, and partly tacit. So the oracle must be MANUFACTURED from intent via an interactive process (like Claude's plan mode but far more detailed and, crucially, very interactive), converting intent to load-bearing concrete examples -> executable checks, progressively, in a design->slice->react spiral, sorting decidable behaviour from irreducible taste early. This is the enhancement to doctrine.md filed alongside this target.

      Dogfoods T29: the interactive design process is itself a rich generated surface — Jevons renders the evolving design + its oracle-coverage map (pinned / fuzzy / examples), the owner manipulates it. Relates to charter.md (arbitration role, the four-role constitution: Jevons arbitrates but never produces or certifies the evidence it rules on) and the oracle-first skill/doctrine."
    depends_on:
    - T30
    origin: manual
    discovered: 2026-07-04
