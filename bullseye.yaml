    acceptance:
    - '[decidable | ORACLE: e2e integration test] ADOPT-OBSERVE: given a list of session IDs in conversation (''adopt these: ...''), each is registered as a durable thread (id, workdir, claude session id, description) and appears in the thread list with readable status; adoption is non-invasive — no running process is taken over, the transcript is tailed for status. Test adopts a known session id and asserts the registry entry + readable status + that no process was spawned.'
